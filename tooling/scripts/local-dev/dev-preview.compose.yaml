# Existing DEV renderer only; no new instance or renderer is provisioned.
# Overlay on ~/.athyper/instances/dev/workspace/source.compose.json.
services:
  api:
    environment:
      PREVIEW_RENDERER_BASE_URL: http://preview-renderer:3000
    networks:
      athyper-dev-preview: {}
  worker:
    environment:
      PREVIEW_RENDERER_BASE_URL: http://preview-renderer:3000
    networks:
      athyper-dev-preview: {}
networks:
  athyper-dev-preview:
    external: true
    name: athyper-dev-preview
