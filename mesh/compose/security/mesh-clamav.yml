# =======================================================================
# Stack       : athyper Mesh – Security
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : mesh-clamav-config
#
# Description :
#   ClamAV daemon (clamd) — virus scanning sidecar for CMS attachment uploads.
#   Scans file bytes via the INSTREAM TCP protocol (RFC-style streaming scan)
#   before bytes are committed to object storage and master.attachment.
#
# Memory allocation :
#   ~500 MB RSS at idle (virus signature database resident in memory).
#   Set mem_limit to 600 m to give ~100 MB headroom.
#   Ensure the Docker host has sufficient available memory before enabling.
#
# Protocol (INSTREAM) :
#   1. Client connects to clamd:3310 (TCP).
#   2. Sends "nINSTREAM\n" (newline-terminated command).
#   3. Sends chunks: 4-byte big-endian length prefix + chunk bytes.
#   4. Sends 4-byte zero terminator to signal end of stream.
#   5. Reads response line: "stream: OK" or "stream: <THREAT> FOUND".
#
# Health check :
#   Sends "PING\n" via netcat; clamd responds "PONG\n" when ready.
#   start_period is 120 s to allow signature database load on first boot.
#   Subsequent restarts are faster (clamav-data volume persists signatures).
#
# Freshclam (signature updates) :
#   Auto-update is disabled in local/dev mode (FRESHCLAM_NO_DAEMON=true).
#   In production, run freshclam as a separate scheduled job or enable
#   the built-in daemon by removing FRESHCLAM_NO_DAEMON from the environment.
#   Latest definitions are ~200 MB; allow 5–10 min on first pull.
# =======================================================================

services:
  clamav:
    image: clamav/clamav:stable
    profiles: ["mesh", "apps"]
    mem_limit: "${CLAMAV_MEMORY_LIMIT:-600m}"
    networks: [internal]
    environment:
      # Disable the freshclam auto-update daemon in local dev.
      # Remove this line (or set to "false") in production to enable live updates.
      FRESHCLAM_NO_DAEMON: "true"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  clamav-data:
    name: athyper-mesh-clamav-data
