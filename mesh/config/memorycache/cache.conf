############################################
# Cache-only Redis for athyper framework
############################################

# Network
port 6379
bind 0.0.0.0
protected-mode yes

# Memory + Eviction (CRITICAL)
# maxmemory must stay below the Docker mem_limit (MEMORYCACHE_MEMORY_LIMIT=128m).
# 100mb leaves ~28m headroom for Redis internal overhead (zmalloc, client buffers, etc.)
# so the kernel OOM killer never fires before noeviction can reject writes cleanly.
maxmemory 100mb
maxmemory-policy noeviction
maxmemory-samples 10

# Performance / housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Durability OFF (cache-only)
appendonly no
save ""

# Safety limits (avoid client runaway)
timeout 300
tcp-keepalive 300

# Performance (Enable based on performance; tune if needed)
databases 1
maxclients 5000
# io-threads 2
# io-threads-do-reads yes

# Optional (reduce huge value risk; tune if needed)
proto-max-bulk-len 8mb
activedefrag yes
logfile ""

# Logging
loglevel notice

# ACL — least-privilege user model (overrides --requirepass default user)
# Mount: ${MESH_CONFIG}/memorycache/redis-acl.conf → /usr/local/etc/redis/redis-acl.conf
# Users: app (runtime), exporter (prometheus), admin (runbook only); default disabled
aclfile /usr/local/etc/redis/redis-acl.conf
