name: athyper-iam-live
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iam_live
      POSTGRES_USER: iam_live
      POSTGRES_PASSWORD: iam_live_test_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_live -d iam_live"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "iam_live_test_only",
        "--aclfile",
        "/usr/local/etc/redis/users.acl",
      ]
    volumes:
      - ./redis-users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "iam_live_test_only", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:831330513f55695572286e521f94fcd3c7e285250ed5b848090265a33192f669
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: iam_live_test_only
      STUDIO_PUBLIC_WEB_URL: http://studio.iam-live.test
      NEON_PUBLIC_WEB_URL: http://neon.iam-live.test
      MESH_PUBLIC_WEB_URL: http://mesh.iam-live.test
    volumes:
      - ../../deploy/config/iam/realm-athyper.json:/opt/keycloak/data/import/realm-athyper.json:ro
  keycloak-health:
    image: busybox:1.37
    command: ["sh", "-c", "exec sleep 3600"]
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://keycloak:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
