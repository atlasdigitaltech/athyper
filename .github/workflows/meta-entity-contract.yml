name: Meta Entity Contract

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: meta-entity-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '10.33.0'
  DATABASE_URL: postgresql://athyperadmin:athyperadmin@127.0.0.1:5432/athyper_contract
  DATABASE_ADMIN_URL: postgresql://athyperadmin:athyperadmin@127.0.0.1:5432/athyper_contract
  RLS_APP_ROLE: athyperapp_test

jobs:
  contract-static:
    name: contract-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Schema, registry and coverage-ledger parity
        run: |
          pnpm policy:meta-entity-contract
          pnpm test:meta-entity-contract-coverage
          pnpm test:meta-entity-rollout
          pnpm verify:meta-entity-certification
          pnpm test:meta-entity-certification

  contract-postgres:
    name: contract-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: athyperadmin
          POSTGRES_PASSWORD: athyperadmin
          POSTGRES_DB: athyper_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U athyperadmin -d athyper_contract"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @athyper/db run db:setup:ddl
      - run: pnpm --filter @athyper/db run db:setup:system
      - name: Contract route and transaction tests
        run: pnpm --dir server exec vitest run packages/services/metadata/src

  contract-upgrade:
    name: contract-upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: athyperadmin
          POSTGRES_PASSWORD: athyperadmin
          POSTGRES_DB: athyper_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U athyperadmin -d athyper_contract"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Clean install
        run: pnpm --filter @athyper/db run db:setup:ddl
      - name: N-1 additive upgrade and replay
        run: pnpm --filter @athyper/db run db:verify:meta-contract-upgrade

  contract-security:
    name: contract-security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: athyperadmin
          POSTGRES_PASSWORD: athyperadmin
          POSTGRES_DB: athyper_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U athyperadmin -d athyper_contract"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @athyper/db run db:setup:ddl
      - run: pnpm --filter @athyper/db run db:setup:system
      - name: RBAC, RLS, tenant isolation and separation of duties
        run: |
          pnpm --filter @athyper/db run db:verify:provision-atlas-rls-role
          pnpm --filter @athyper/db run db:verify:rls
          pnpm --dir server exec vitest run packages/services/iam/__tests__/permission-context-resolvers.test.ts packages/services/metadata/src/__tests__/contract-publication-m3.test.ts

  contract-artifact:
    name: contract-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate, dry-run, apply twice, export and canonical hash
        run: pnpm --dir server exec vitest run packages/services/metadata/src/__tests__/contract-application-v21.test.ts

  contract-drift:
    name: contract-drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: athyperadmin
          POSTGRES_PASSWORD: athyperadmin
          POSTGRES_DB: athyper_contract
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U athyperadmin -d athyper_contract"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @athyper/db run db:setup:ddl
      - run: pnpm --filter @athyper/db run db:setup:system
      - name: Staged, materialized and compiled drift
        run: pnpm --filter @athyper/db run db:verify:meta-contract-audit
      - name: Export migration and quarantine evidence
        run: pnpm --filter @athyper/db run db:report:meta-contract-migration -- --output=../../artifacts/meta-entity-contract-migration-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-entity-contract-migration-${{ github.sha }}
          path: artifacts/meta-entity-contract-migration-report.json

  contract-e2e:
    name: contract-e2e
    runs-on: ubuntu-latest
    needs: [contract-static, contract-artifact]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Admin publish to Neon and Mesh contract wiring
        run: pnpm --dir server exec vitest run packages/services/metadata/src/__tests__/contract-publication-m3.test.ts packages/services/metadata/src/__tests__/meta-entity-studio-m4.test.ts packages/services/metadata/src/__tests__/mesh-runtime-m6.test.ts
      - name: Build all three consumers
        run: |
          pnpm --filter @athyper/admin run build
          pnpm --filter @athyper/neon run build
          pnpm --filter @athyper/mesh run build

  contract-performance:
    name: contract-performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Descriptor, bootstrap, list and detail budget contracts
        run: |
          node --test scripts/performance/qualify-meta-entity.test.mjs
          node --test scripts/performance/verify-runtime-list-cache-rollout.test.mjs
      - name: Live qualification when environment is configured
        if: ${{ vars.PERF_BASE_URL != '' }}
        env:
          PERF_BASE_URL: ${{ vars.PERF_BASE_URL }}
          TOKEN_TENANT_A: ${{ secrets.PERF_TOKEN }}
          ORG_TENANT_A: ${{ secrets.PERF_ORG }}
          ENTITY: company_code
        run: pnpm qualify:meta-entity
