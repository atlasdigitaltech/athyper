name: Brand Sync Check

on:
  pull_request:
    paths:
      - "packages/shared/foundation/brand/**"
      - "mesh/config/iam/themes/neon/login/_neon-brand-*.ftl"
      - "mesh/config/iam/themes/neon/login/resources/img/neon-*.svg"
      - "scripts/brand/**"
      - ".github/workflows/brand-sync.yml"
  push:
    branches: [main, develop]

jobs:
  verify-brand-sync:
    name: Verify KC brand assets match canonical source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Keycloak brand sync
        run: pnpm brand:verify
