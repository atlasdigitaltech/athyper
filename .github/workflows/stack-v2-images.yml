name: Stack v2 container images

on:
  workflow_dispatch:
    inputs:
      channel:
        description: ImageSet channel metadata; publication remains immutable
        required: true
        default: dev
        type: choice
        options: [dev, candidate]
      confirm_publish:
        description: Confirm publication to GHCR
        required: true
        default: false
        type: boolean

concurrency:
  group: stack-v2-images-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Confirm publication
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [[ "$CONFIRM_PUBLISH" != "true" ]]; then
            echo "Set confirm_publish=true to authorize GHCR writes."
            exit 1
          fi

  publish:
    name: Build, scan, publish / ${{ matrix.id }}
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: neon-web
            image: ghcr.io/atlasdigitaltech/athyper-neon-web
            context: .
            dockerfile: apps/Dockerfile
            build_args: |
              APP_PACKAGE=@athyper/neon
              APP_NAME=neon
          - id: mesh-web
            image: ghcr.io/atlasdigitaltech/athyper-mesh-web
            context: .
            dockerfile: apps/Dockerfile
            build_args: |
              APP_PACKAGE=@athyper/mesh
              APP_NAME=mesh
          - id: studio-web
            image: ghcr.io/atlasdigitaltech/athyper-studio-web
            context: .
            dockerfile: apps/Dockerfile
            build_args: |
              APP_PACKAGE=@athyper/studio
              APP_NAME=studio
          - id: runtime-server
            image: ghcr.io/atlasdigitaltech/athyper-runtime-server
            context: .
            dockerfile: server/Dockerfile.prod
            build_args: ''
          - id: iam
            image: ghcr.io/atlasdigitaltech/athyper-keycloak
            context: stack/config/iam
            dockerfile: stack/config/iam/Dockerfile
            build_args: ''
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build local scan candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          load: true
          push: false
          tags: athyper-scan:${{ github.run_id }}-${{ matrix.id }}
          cache-from: type=gha,scope=stack-v2-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=stack-v2-${{ matrix.id }}

      - name: Scan local image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: athyper-scan:${{ github.run_id }}-${{ matrix.id }}
          format: json
          output: trivy-${{ matrix.id }}.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-${{ matrix.id }}-${{ github.sha }}
          path: trivy-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce vulnerability gate
        env:
          REPORT: trivy-${{ matrix.id }}.json
        run: |
          count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "$REPORT")"
          echo "Fixed HIGH/CRITICAL findings: $count"
          test "$count" -eq 0

      - name: Log in to GHCR after scan passes
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image with BuildKit SBOM and provenance
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stack-v2-${{ matrix.id }}
          provenance: mode=max
          sbom: true

      - name: Create GitHub build provenance attestation
        # Private organization plans may not expose the repository-attestation
        # API. BuildKit registry provenance and SBOM above remain mandatory.
        continue-on-error: true
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image result
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          jq -n \
            --arg id "$IMAGE_ID" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg revision "$SOURCE_REVISION" \
            --arg channel "$CHANNEL" \
            '{id:$id,reference:($image+"@"+$digest),sourceRevision:$revision,channel:$channel}' \
            > image-${IMAGE_ID}.json
          cat image-${IMAGE_ID}.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.id }}-${{ github.sha }}
          path: image-${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Assemble immutable image set
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download image results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*-${{ github.sha }}
          merge-multiple: true

      - name: Assemble digest manifest
        env:
          SOURCE_REVISION: ${{ github.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          jq -s \
            --arg revision "$SOURCE_REVISION" \
            --arg channel "$CHANNEL" \
            '{
              apiVersion:"athyper.io/v1alpha1",
              kind:"ImageSet",
              metadata:{
                id:($channel+"-"+($revision[0:12])),
                channel:(if $channel == "dev" then "development" else "candidate" end)
              },
              spec:{
                sourceRevision:$revision,
                images:(sort_by(.id) | map({id,reference}))
              }
            }' \
            image-*.json > published-image-set.json
          jq . published-image-set.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-v2-image-set-${{ github.sha }}
          path: published-image-set.json
          if-no-files-found: error
          retention-days: 90
