name: CI

on:
  # Feature branches are covered by pull_request. Triggering on every push too
  # produced two identical runs, and two failure emails, for every commit on a
  # branch with an open PR. Matches authorization-idempotency, brand-sync and
  # service-layer-qualification, which already scope push to the trunk branches.
  push:
    branches: [main, develop]
  pull_request:
  # Cleanup-plan v5 P5c — manual trigger for the screenshot parity gate
  # while activation prereqs land. See tests/e2e/README.md.
  workflow_dispatch:
    inputs:
      format_base:
        description: "Optional commit used as the changed-file formatting baseline"
        required: false
        default: ""
      playwright_base_url:
        description: "Base URL for Neon (e.g. https://neon.athyper.local)"
        required: false
        default: "https://neon.athyper.local"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "10.33.0"
  ATHYPER_ARTIFACT_ROOT: ${{ github.workspace }}-artifacts
  ATHYPER_ARTIFACT_RUN_ID: ci

jobs:
  iam-live:
    name: IAM dependency readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Boot and verify live IAM dependencies
        run: node tests/iam-live/run.mjs

  # ─── Quality Gate ────────────────────────────────────────────────
  # Independent static policies aggregate; dependent generated-code and test steps stay sequential.
  # Uses pnpm + Turbo with GitHub Actions cache for speed
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Independent checks aggregate failures and retain every diagnostic log.
      - name: Static policies (all results)
        id: static-policies
        env:
          FORMAT_BASE_REF: ${{ inputs.format_base }}
        run: pnpm policy:static

      - name: Retain static policy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-policy-${{ github.sha }}
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/static-policy/ci/
          if-no-files-found: error

      - name: Generate Prisma/Kysely types
        run: pnpm --fail-if-no-match --filter @athyper/server-db run codegen

      - name: Check generated Kysely types are current
        run: |
          git diff --exit-code -- \
            server/packages/adapters/database/neon-postgres/src/generated/kysely/types.ts \
            server/packages/adapters/database/mesh-postgres/src/generated/kysely-mesh/types.ts \
            server/packages/adapters/database/athyper-postgres/src/generated/kysely-studio/types.ts

      - name: Lint
        run: pnpm run lint:errors
        env:
          FORCE_COLOR: "1"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test URL catalogue extraction
        run: pnpm run test:url-catalogue

      - name: Test DDL service coverage failure gates
        run: pnpm run test:ddl-service-coverage

      - name: Test host capability composition failure gates
        run: pnpm run test:host-capability-registry

      # Workspace runners include Node tests as well as Vitest. Coverage needs a
      # runner-specific gate; forwarding --coverage to Turbo never ran these tests.
      - name: Workspace tests
        run: pnpm run test:workspace
        env:
          CI: "true"
          FORCE_COLOR: "1"

      # The bespoke R9 application and its evaluator were removed in 870f08f52.
      # Disposition and remaining coverage gaps: docs/runbooks/entity-foundation-qualification.md.

      - name: Root tests and reachability
        # test:root includes the required Country browser qualification gate.
        run: pnpm exec playwright install --with-deps chromium && pnpm run test:root
        env:
          CI: "true"
          FORCE_COLOR: "1"

      - name: Document-open rollout CI gates
        env:
          DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH: ${{ vars.DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH }}
          DOCUMENT_OPEN_RAW_TRACE_PATH: ${{ vars.DOCUMENT_OPEN_RAW_TRACE_PATH }}
          DOCUMENT_OPEN_ROLLOUT_MINIMUM_SAMPLES: ${{ vars.DOCUMENT_OPEN_ROLLOUT_MINIMUM_SAMPLES }}
          DOCUMENT_OPEN_ROLLOUT_PROGRESS_SNAPSHOT: ${{ vars.DOCUMENT_OPEN_ROLLOUT_PROGRESS_SNAPSHOT }}
        run: |
          if [ -n "$DOCUMENT_OPEN_RAW_TRACE_PATH" ]; then
            if [ ! -f "$DOCUMENT_OPEN_RAW_TRACE_PATH" ]; then
              echo "Missing document-open raw trace input: $DOCUMENT_OPEN_RAW_TRACE_PATH"
              exit 1
            fi
            snapshot_output="${DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH:-/tmp/document-open-rollout.snapshot.json}"
            export_args="--input=$DOCUMENT_OPEN_RAW_TRACE_PATH --output=$snapshot_output"
            if [ -n "$DOCUMENT_OPEN_ROLLOUT_MINIMUM_SAMPLES" ]; then
              export_args="$export_args --minimum-samples=$DOCUMENT_OPEN_ROLLOUT_MINIMUM_SAMPLES"
            fi

            pnpm document-open-rollout-snapshot-export $export_args
            echo "DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH=$snapshot_output"
            export DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH="$snapshot_output"
          fi

          if [ -n "$DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH" ]; then
            if [ ! -f "$DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH" ]; then
              echo "Missing document-open gate snapshot file: $DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH"
              exit 1
            fi
            pnpm document-open-rollout-ci-gate --snapshot="$DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH"
            exit 0
          fi

          if [ -n "$DOCUMENT_OPEN_ROLLOUT_PROGRESS_SNAPSHOT" ]; then
            pnpm document-open-rollout-ci-gate
            exit 0
          fi

          echo "No document-open snapshot input found; skipping rollout CI gate check."
          echo "Set DOCUMENT_OPEN_CI_GATE_SNAPSHOT_PATH (preferred) or DOCUMENT_OPEN_ROLLOUT_PROGRESS_SNAPSHOT to enable."

      # Obsolete advisory Changesets invocation had no installed CLI and only
      # retired package coordinates. Its disposition is in ci-invariant-map.md.

      # Current strict MFA, seed and finance checks run in three-plane-verify.
      # Legacy PC source-string checks and removed schema contracts are explicitly
      # mapped (including coverage gaps) in docs/architecture/ci-invariant-map.md.
      # The v2 meta-entity kernel governance (routes / test-matrix / dependencies)
      # was retired in the reconciliation — its single-kernel anti-pattern rules
      # do not map to the governed-entity-lifecycle service layer, and the
      # identity-parsing concern is covered by the records identity-boundary
      # ratchet in the static profile. See
      # docs/architecture/plans/meta-entity-governance-reconciliation.md
      - name: Verify meta-entity certification
        run: pnpm verify:meta-entity-certification

      - name: Verify unified experience production budgets
        run: pnpm perf:verify:experience-contracts && pnpm perf:verify:shell-bundle

      - name: Verify meta-entity retirement evidence boundary
        run: pnpm test:meta-entity-retirement

      # Gate 3 — Legacy DDL schema reference check (advisory → blocking at Phase 3).
      # Fails if server/packages/**/*.ts or server/src/**/*.ts contains any of the
      # old-DDL relation names: shared.module, shared.workspace,
      # shared.plan_module_access, master.tenant_module_subscription,
      # control.entity_version, control.entity_operation.
      # Advisory while runtime code is being migrated off the old relations.
      # Promote to blocking (remove continue-on-error) once Phase 3 migration
      # confirms zero references remain.
      - name: Verify no legacy DDL schema references (Gate 3 — advisory)
        continue-on-error: true
        run: pnpm policy:no-legacy-schema-refs

  # Studio reference authoring is independent of the older Country/Principal pilot
  # and unrelated quality failures. Each check remains required after installation.
  entity-studio-foundation:
    name: Entity Studio reference foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Verify Entity foundation generated contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm entity:foundation:check
      - name: Test reference dictionary DDL evidence generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsx --test tooling/scripts/metadata/reference-ddl-status.test.ts
      - name: Test complete Entity authoring contract suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-contract-meta-entity-authoring test
      - name: Test complete Entity authoring implementation suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-plane-studio-meta-entity-authoring test
      - name: Test governed control-plane composition
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-platform-host exec vitest run src/composition/control-plane
      - name: Test shared detail navigation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsx --test packages/contracts/platform/entity-runtime/src/detail-navigation.test.ts
      - name: Test Entity DEV preparation runner
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test tooling/scripts/verification/apply-entity-native-resource-preparation.test.mjs tooling/scripts/verification/rehearse-product-command-installation.test.mjs server/db/scripts/operations/authorization/prepare-dev-product-command.test.mjs
      - name: Typecheck native Entity tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-plane-studio-meta-entity-authoring typecheck:native-tests
      - name: Test Entity release source pin compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm --fail-if-no-match --filter @athyper/server-platform-metadata exec vitest run src/__tests__/compiled-runtime-contract.test.ts src/live-read-descriptor.test.ts src/compiled-runtime-provenance-storage.test.ts
          pnpm --fail-if-no-match --filter @athyper/server-service-publication exec vitest run src/__tests__/compiled-runtime-worker.test.ts src/__tests__/compiled-runtime-publication.test.ts
      - name: Rehearse scoped Entity persistence on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ATHYPER_SCOPED_GRAPH_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-plane-studio-meta-entity-authoring exec vitest run src/scoped-graph-writer.postgres.test.ts

      - name: Rehearse native Entity persistence on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ATHYPER_NATIVE_GRAPH_POSTGRES: "1"
          ATHYPER_NATIVE_AI_RECONCILIATION_POSTGRES: "1"
          ATHYPER_LEGACY_ENROLLMENT_POSTGRES: "1"
          ATHYPER_NATIVE_CONSTRAINT_POSTGRES: "1"
          ATHYPER_ROOT_REGISTRATION_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-plane-studio-meta-entity-authoring exec vitest run src/native-core-layout.postgres.test.ts src/native-ai-reconciliation.postgres.test.ts src/legacy-enrollment.postgres.test.ts src/native-constraint-compatibility.postgres.test.ts src/native-root-registration.postgres.test.ts

      - name: Rehearse native Entity review and publication admission on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PRODUCT_REVIEW_POSTGRES: "1"
          NATIVE_PUBLICATION_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-platform-host exec vitest run src/composition/control-plane/product-review.postgres.test.ts src/composition/shared/publication/native-publication-authority.postgres.test.ts src/composition/shared/publication/native-publication-validation.postgres.test.ts

      - name: Rehearse restricted component installation on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ATHYPER_COMPONENT_INSTALLATION_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-plane-studio-meta-entity-authoring exec vitest run src/native-component-installation.postgres.test.ts

      - name: Rehearse generated native row guards on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ATHYPER_NATIVE_ROW_GUARDS_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-contract-meta-entity-authoring exec vitest run src/native-row-guards.test.ts

      - name: Rehearse native contract tables on PostgreSQL
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          ATHYPER_NATIVE_AI_POSTGRES: "1"
          ATHYPER_NATIVE_OPERATION_POSTGRES: "1"
          ATHYPER_NATIVE_ROOT_POSTGRES: "1"
        run: pnpm --fail-if-no-match --filter @athyper/server-contract-meta-entity-authoring exec vitest run src/native-ai.postgres.test.ts src/native-operation.postgres.test.ts src/native-root.postgres.test.ts

  # Run framework security evidence independently of unrelated static-policy failures.
  entity-foundation:
    name: Country and Principal framework qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify qualification failure gates
        run: node --test tooling/scripts/verification/entity-foundation-qualification.test.mjs
      - name: Qualify shared authoring, records, publication and host
        run: pnpm qualify:entity-foundation
      - name: Qualify record audit contract upgrade and failure recovery
        if: ${{ !cancelled() }}
        run: pnpm qualify:entity-audit-upgrade
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-audit-upgrade-${{ github.sha }}
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/entity-audit-upgrade/ci/
          if-no-files-found: error
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entity-foundation-${{ github.sha }}
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/entity-foundation/ci/
          if-no-files-found: error

  # P0 performance baseline. Advisory until two stable captured runs have
  # been reviewed. Enable by setting the PERF_BASE_URL repository variable.
  performance-baseline:
    name: P0 Performance Baseline (Advisory)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ vars.PERF_BASE_URL != '' }}
    continue-on-error: true
    env:
      PERF_BASE_URL: ${{ vars.PERF_BASE_URL }}
      PERF_DATASET_PROFILE: ${{ vars.PERF_DATASET_PROFILE }}
      PERF_API_REPLICAS: ${{ vars.PERF_API_REPLICAS }}
      PERF_POSTGRES_TOPOLOGY: ${{ vars.PERF_POSTGRES_TOPOLOGY }}
      PERF_REDIS_TOPOLOGY: ${{ vars.PERF_REDIS_TOPOLOGY }}
      PERF_LIFECYCLE_SCRIPT: ${{ vars.PERF_LIFECYCLE_SCRIPT }}
      PERF_POOL_PRESSURE_SCRIPT: ${{ vars.PERF_POOL_PRESSURE_SCRIPT }}
      PERF_PG_TOP_SQL_COMMAND: ${{ vars.PERF_PG_TOP_SQL_COMMAND }}
      TOKEN_TENANT_A: ${{ secrets.PERF_TOKEN }}
      ORG_TENANT_A: ${{ secrets.PERF_ORG }}
      ENTITY: ${{ vars.PERF_ENTITY }}
      RECORD_ID: ${{ vars.PERF_RECORD_ID }}
      PERF_OUTPUT_DIR: tooling/performance/artifacts/p0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Capture three real baseline runs
        run: pnpm perf:capture:p0
        env:
          PERF_REPETITIONS: "3"
      - name: Upload P0 performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athyper-p0-performance-${{ github.sha }}
          path: tooling/performance/artifacts/p0/
          if-no-files-found: error
          retention-days: 30

  # ─── Screenshot Regression (PI) ──────────────────────────────────
  # Cleanup-plan v5 P5c. Visual diff against a pinned reference
  # snapshot of the descriptor-driven PI route. After Sprint 8 PR6
  # the framework (Playwright dep, global setup, fixture seed
  # skeleton, spec) is in place; the test itself stays guarded by
  # `test.skip(...)` until the activation steps in
  # `tests/e2e/README.md` complete:
  #   1. `pnpm exec playwright install chromium` (per-machine)
  #   2. PC + AD INSERTs authored in
  #      server/db/seed/tenants/neon/010_demo/999_visual_fixture_pi.sql
  #   3. PLAYWRIGHT_USER + PLAYWRIGHT_PASSWORD set in CI secrets
  #   4. PLAYWRIGHT_BASE_URL set in CI secrets
  #   5. Reference snapshot generated + committed
  #
  # To enable: flip the `if:` guard below + the `env:` block per
  # `tests/e2e/README.md` § "Flip the CI gate".
  # ─────────────────────────────────────────────────────────────────
  screenshot-parity-pi:
    name: Screenshot Regression (PI)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual regression tests
        env:
          # Activation: replace `inputs.playwright_base_url` with
          # `${{ secrets.PLAYWRIGHT_BASE_URL }}` once a stable test env
          # URL is configured as a repo secret.
          PLAYWRIGHT_BASE_URL: ${{ inputs.playwright_base_url }}
          # Activation: add `PLAYWRIGHT_USER` + `PLAYWRIGHT_PASSWORD` to
          # the env block here once those repo secrets are configured.
          # Until they exist global-setup writes an empty storageState
          # and the spec's `test.skip(...)` keeps the suite dormant.
        run: pnpm test:visual

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-parity-diffs
          path: |
            tests/e2e/.playwright-output/
            tests/e2e/visual/__screenshots__/
          retention-days: 14

  # ─── Build ───────────────────────────────────────────────────────
  # Build every current product independently; failed policy checks remain blocking
  # in CI Success but must not hide compilation evidence.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database types for this runner
        run: pnpm --fail-if-no-match --filter @athyper/server-db run codegen

      - name: Build packages
        # Build the current workspace; obsolete negative filters hid profile drift.
        run: pnpm build
        env:
          NODE_ENV: production
      - name: Verify nonempty product artifacts
        run: pnpm verify:ci-build
      - name: Retain build verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-verification
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/ci-integrity/ci/build.json
          if-no-files-found: error

  # All database mutations are confined to fresh, runner-owned Docker volumes.
  # Independent of quality so unrelated policy drift cannot hide security results.
  rls-verify:
    name: RLS + Tenant Stamp Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate workflow entrypoints
        run: pnpm policy:ci-entrypoints
      - name: Typecheck CI database runner
        run: pnpm --fail-if-no-match --filter @athyper/server-db run typecheck:ci-integrity
      - name: Provision and verify disposable three-plane security and service suites
        run: pnpm verify:ci-database
      - name: Require substantive evidence from this commit
        run: node tooling/scripts/verification/verify-ci-integrity-evidence.mjs
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-database-integrity-${{ github.sha }}
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/ci-integrity/ci/
          if-no-files-found: error

  three-plane-verify:
    name: Three-Plane Permission Stack Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Validate workflow entrypoints and their failure tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm policy:ci-entrypoints && pnpm test:ci-integrity
      - name: Verify strict MFA realm export
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm policy:ci-realm
      - name: Check canonical DDL plane contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-db run db:verify:ddl-model
      - name: Check current seed contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-db run db:seed:contract:lint
      - name: Verify authorization contract rejection and seed lint negative fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --fail-if-no-match --filter @athyper/server-db exec tsx --test scripts/__tests__/authorization/authorization-release-gates.test.ts scripts/__tests__/seed/seed-contract-lint.test.ts
      - name: Current finance budget, reversal, posting and inventory semantics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify:ci-finance
      - name: Retain finance verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-verification
          path: ${{ env.ATHYPER_ARTIFACT_ROOT }}/ci-integrity/ci/finance-tests.json
          if-no-files-found: error

  # ─── CI Status Gate ──────────────────────────────────────────────
  # Aggregate check intended for branch protection; actual GitHub rules are external.
  # RLS is blocking and runs under NOBYPASSRLS.
  # three-plane-verify is blocking as of Phase 8.
  # ─────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        quality,
        build,
        rls-verify,
        three-plane-verify,
        iam-live,
        entity-foundation,
        entity-studio-foundation,
      ]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.entity-studio-foundation.result }}" != "success" ]]; then
            echo "Entity Studio reference foundation failed"
            exit 1
          fi
          if [[ "${{ needs.entity-foundation.result }}" != "success" ]]; then
            echo "Entity Framework qualification failed"
            exit 1
          fi
          if [[ "${{ needs.iam-live.result }}" != "success" ]]; then
            echo "IAM dependency readiness failed"
            exit 1
          fi
          quality="${{ needs.quality.result }}"
          build="${{ needs.build.result }}"
          rls="${{ needs.rls-verify.result }}"
          threeplane="${{ needs.three-plane-verify.result }}"

          echo "quality           : $quality"
          echo "build             : $build"
          echo "rls-verify        : $rls"
          echo "three-plane-verify: $threeplane"

          if [[ "$quality" != "success" ]]; then
            echo "Quality gate failed — lint, typecheck, test, or format check did not pass."
            exit 1
          fi

          if [[ "$build" != "success" ]]; then
            echo "Build failed — package compilation did not succeed."
            exit 1
          fi

          if [[ "$rls" != "success" ]]; then
            echo "RLS verification failed under NOBYPASSRLS — tenant isolation is a release blocker."
            exit 1
          fi

          if [[ "$threeplane" != "success" ]]; then
            echo "Three-plane permission stack verify failed — see Phase 6 + Phase 8 contracts."
            exit 1
          fi

          echo "All CI checks passed."
