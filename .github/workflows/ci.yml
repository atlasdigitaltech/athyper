name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.0'
  PNPM_VERSION: '10.28.2'

jobs:
  # ─── Quality Gate ────────────────────────────────────────────────
  # Runs: format check → lint → typecheck → test → depcheck
  # Uses pnpm + Turbo with GitHub Actions cache for speed
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint
        env:
          FORCE_COLOR: '1'

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test -- --coverage
        env:
          CI: 'true'
          FORCE_COLOR: '1'

      - name: Check changeset
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

      - name: Dependency graph check
        run: pnpm run depcheck

  # ─── Build ───────────────────────────────────────────────────────
  # Builds all workspace packages excluding @neon/web (Next.js app)
  # which requires runtime secrets not available in CI.
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        # Builds framework, shared packages, tooling — excludes Next.js app
        # @neon/web requires runtime secrets (DB, Keycloak, Redis) for production build
        run: pnpm turbo run build --filter=!@neon/web --filter=!@neon/auth --filter=!@neon/content
        env:
          NODE_ENV: production

  # ─── Security Scan ───────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # ─── CI Status Gate ──────────────────────────────────────────────
  # Single required check — PRs must pass this to be mergeable
  # ─────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          quality="${{ needs.quality.result }}"
          build="${{ needs.build.result }}"

          echo "quality : $quality"
          echo "build   : $build"

          if [[ "$quality" != "success" ]]; then
            echo "Quality gate failed — lint, typecheck, test, or format check did not pass."
            exit 1
          fi

          if [[ "$build" != "success" ]]; then
            echo "Build failed — package compilation did not succeed."
            exit 1
          fi

          echo "All CI checks passed."
