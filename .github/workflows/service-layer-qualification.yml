name: Service-layer PostgreSQL qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/db/ddl/**"
      - "server/packages/**/*.postgres.test.ts"
      - "server/packages/test-utils/**"
      - "tooling/config/ddl-service-*"
      - "tooling/tools/scripts/*ddl-service-coverage*"
      - ".github/workflows/service-layer-qualification.yml"
  push:
    branches: [main]
    paths:
      - "server/db/ddl/**"
      - "server/packages/**/*.postgres.test.ts"
      - "server/packages/test-utils/**"
      - "tooling/config/ddl-service-*"
      - "tooling/tools/scripts/*ddl-service-coverage*"
      - ".github/workflows/service-layer-qualification.yml"
  schedule:
    - cron: "15 3 * * 1-5"

concurrency:
  group: service-layer-postgres-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Studio, Neon, and Mesh application-role suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATHYPER_SERVICE_DB_TESTS: "true"
      ATHYPER_STUDIO_TEST_DATABASE_URL: postgresql://athyperapp:athyper-test@127.0.0.1:5432/athyper_studio
      ATHYPER_NEON_TEST_DATABASE_URL: postgresql://athyperapp:athyper-test@127.0.0.1:5432/athyper_neon
      ATHYPER_MESH_TEST_DATABASE_URL: postgresql://athyperapp:athyper-test@127.0.0.1:5432/athyper_mesh
      ATHYPER_STUDIO_TEST_DATABASE_ROLE: athyperapp
      ATHYPER_NEON_TEST_DATABASE_ROLE: athyperapp
      ATHYPER_MESH_TEST_DATABASE_ROLE: athyperapp
      ATHYPER_SERVICE_TEST_TENANT_ID: 11111111-1111-4111-8111-111111111111
      ATHYPER_SERVICE_TEST_PRINCIPAL_ID: 22222222-2222-4222-8222-222222222222
      ATHYPER_SERVICE_TEST_OTHER_TENANT_ID: 55555555-5555-4555-8555-555555555555
      ATHYPER_SERVICE_TEST_OTHER_PRINCIPAL_ID: 66666666-6666-4666-8666-666666666666
      ATHYPER_PLATFORM_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/athyper_studio
      ATHYPER_NEON_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/athyper_neon
      ATHYPER_MESH_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/athyper_mesh
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject incomplete qualification configuration
        run: |
          node -e "for (const key of ['ATHYPER_STUDIO_TEST_DATABASE_URL','ATHYPER_NEON_TEST_DATABASE_URL','ATHYPER_MESH_TEST_DATABASE_URL','ATHYPER_STUDIO_TEST_DATABASE_ROLE','ATHYPER_NEON_TEST_DATABASE_ROLE','ATHYPER_MESH_TEST_DATABASE_ROLE','ATHYPER_SERVICE_TEST_TENANT_ID','ATHYPER_SERVICE_TEST_PRINCIPAL_ID','ATHYPER_SERVICE_TEST_OTHER_TENANT_ID','ATHYPER_SERVICE_TEST_OTHER_PRINCIPAL_ID']) if (!process.env[key]) throw new Error(key + ' is required')"
      - name: Create fresh plane databases and production application roles
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE athyperapp LOGIN PASSWORD 'athyper-test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE athyperadmin NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE athyperadmin_atlas_maintenance NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE athyper_studio OWNER postgres TEMPLATE template0 ENCODING 'UTF8';
          CREATE DATABASE athyper_neon OWNER postgres TEMPLATE template0 ENCODING 'UTF8';
          CREATE DATABASE athyper_mesh OWNER postgres TEMPLATE template0 ENCODING 'UTF8';
          SQL
      - name: Apply committed three-plane DDL manifests
        shell: pwsh
        run: |
          ./server/db/ddl/foundation-runner.ps1 -Plane studio
          ./server/db/ddl/foundation-runner.ps1 -Plane neon
          ./server/db/ddl/foundation-runner.ps1 -Plane mesh
      - name: Seed RLS-valid qualification actors
        run: |
          for database in athyper_studio athyper_neon athyper_mesh; do
            psql -h 127.0.0.1 -U postgres -d "$database" -v ON_ERROR_STOP=1 \
              -v fixture_tenant_id="$ATHYPER_SERVICE_TEST_TENANT_ID" \
              -v fixture_principal_id="$ATHYPER_SERVICE_TEST_PRINCIPAL_ID" \
              -v fixture_other_tenant_id="$ATHYPER_SERVICE_TEST_OTHER_TENANT_ID" \
              -v fixture_other_principal_id="$ATHYPER_SERVICE_TEST_OTHER_PRINCIPAL_ID" \
              -f server/packages/test-utils/fixtures/rls-actors.sql
          done
      - run: pnpm ddl:coverage:check
      - run: pnpm test:ddl-service-coverage
      - run: pnpm --filter @athyper/server-test-utils typecheck
      - run: pnpm --filter @athyper/server-service-records typecheck
      - name: Run every required PostgreSQL suite with zero skips
        run: pnpm test:service-postgres
