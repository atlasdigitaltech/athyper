name: Business Partner artifact schema gate
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NEON_SCHEMA_DATABASE_URL:
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install artifact validator dependencies
        run: python3 -m pip install -r docs/architecture/application-experience/entity-policy-examples/New_Entity/requirements.txt
      - name: Validate draft artifact consistency
        run: python3 docs/architecture/application-experience/entity-policy-examples/New_Entity/validate.py
      - name: Compare reviewed catalog with real Neon schema
        env:
          NEON_SCHEMA_DATABASE_URL: ${{ secrets.NEON_SCHEMA_DATABASE_URL }}
        run: python3 docs/architecture/application-experience/entity-policy-examples/New_Entity/verify_live_schema.py
      - name: Verify descriptor permissions exist in target Neon catalog
        env:
          NEON_SCHEMA_DATABASE_URL: ${{ secrets.NEON_SCHEMA_DATABASE_URL }}
        run: python3 docs/architecture/application-experience/entity-policy-examples/New_Entity/verify_permission_catalog.py
