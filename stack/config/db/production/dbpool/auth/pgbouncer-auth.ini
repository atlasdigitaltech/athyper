[databases]
athyperauth = host=__DB_HOST__ port=__DB_PORT__ dbname=athyperauth

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6433
unix_socket_dir = /var/run/postgresql

server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/certs/ca.crt

; mTLS client certificates — uncomment once cert files are deployed to
; /etc/pgbouncer/certs/ (see staging/dbpool/certs/ for reference).
; server_tls_cert_file = /etc/pgbouncer/certs/pgbouncer-client.crt
; server_tls_key_file  = /etc/pgbouncer/certs/pgbouncer-client.key

auth_type = scram-sha-256
auth_user = pgbouncer_auth_user
auth_query = SELECT username, password FROM pgbouncer.get_auth($1)

pool_mode = session

max_client_conn = 500
default_pool_size = 50
reserve_pool_size = 15
reserve_pool_timeout = 5
max_db_connections = 50

server_connect_timeout = 15
server_login_retry = 2
server_idle_timeout = 300
client_idle_timeout = 600
server_lifetime = 7200

server_reset_query = DISCARD ALL
server_reset_query_always = 1

ignore_startup_parameters = extra_float_digits, options

logfile = /var/log/postgresql/pgbouncer-auth.log
pidfile = /var/run/postgresql/pgbouncer-auth.pid
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

admin_users = postgres, athyperauthdb_user
stats_users = postgres, athyperauthdb_user
