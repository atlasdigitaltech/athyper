[databases]
; Frozen topology — dbpool_apps / transaction / port 6432
; Budget: platform=5, neon=25, mesh=5, health=5, errors=5, secrets=5 → total=50 server conns
athyper_platform = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_platform pool_size=5
athyper_neon    = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_neon    pool_size=25
athyper_mesh    = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_mesh    pool_size=5
athyper_health  = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_health  pool_size=5
athyper_errors  = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_errors  pool_size=5
athyper_secrets = host=__DB_HOST__ port=__DB_PORT__ dbname=athyper_secrets pool_size=5

[pgbouncer]
; 0.0.0.0 required — 127.0.0.1 is unreachable from other Docker containers
listen_addr = 0.0.0.0
listen_port = 6432

server_tls_sslmode = verify-full
server_tls_ca_file = /etc/pgbouncer/certs/ca.crt

; mTLS client certificates — mutual TLS adds a second auth factor on top
; of scram-sha-256 password auth over the CA-verified TLS tunnel.
server_tls_cert_file = /etc/pgbouncer/certs/pgbouncer-client.crt
server_tls_key_file  = /etc/pgbouncer/certs/pgbouncer-client.key

; auth_file path matches what the compose entrypoint writes at container start
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

max_client_conn = 1500
default_pool_size = 100
reserve_pool_size = 30
reserve_pool_timeout = 5
max_db_connections = 50

server_connect_timeout = 15
server_login_retry = 2
server_idle_timeout = 60
client_idle_timeout = 300
server_lifetime = 3600
query_timeout = 0
query_wait_timeout = 120
cancel_wait_timeout = 10

server_reset_query = DISCARD ALL
server_reset_query_always = 0

ignore_startup_parameters = extra_float_digits, options, TimeZone

; Log to stdout — Docker captures it; no logfile/pidfile needed in containers
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

admin_users = postgres, athyper_user
stats_users = postgres, athyper_user
