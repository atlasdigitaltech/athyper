# ========================================================
# athyper Production DB tuning (8GB for Postgres)
# Host: 8 vCPU, 16GB RAM, NVMe SSD
# ========================================================
# ---- Networking (private-only — PgBouncer to Postgres)
listen_addresses = '127.0.0.1'
port = 5432

# ---- Authentication
password_encryption = scram-sha-256

# ---- Connections (PgBouncer is the pool; keep modest)
max_connections = 200
superuser_reserved_connections = 5

# ---- Memory (tuned for 8GB allocation)
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 1GB
huge_pages = try

# ---- WAL / Checkpoints (NVMe, reduce checkpoint spikes)
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB
wal_compression = on
wal_buffers = 64MB

# ---- Planner / IO (NVMe SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# ---- Parallelism
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# ---- Autovacuum (aggressive — production workloads)
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms

# ---- Logging
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
log_min_duration_statement = 200ms
log_checkpoints = on
log_autovacuum_min_duration = 0
log_lock_waits = on
log_temp_files = 0

# ---- Statement stats (pg_stat_statements)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
