# ========================================================
# athyper Production pg_hba.conf
# Principle: deny by default, allow only known paths
# ========================================================

# Database administrative login by Unix domain socket
local   all             postgres                                peer

# Local Unix socket connections
local   all             all                                     peer

# PgBouncer auth lookup user (localhost only)
host    all     pgbouncer_auth_user    127.0.0.1/32    scram-sha-256
host    all     pgbouncer_auth_user    ::1/128         scram-sha-256

# PgBouncer apps pool (localhost only, SCRAM)
host    all     athyper_user           127.0.0.1/32    scram-sha-256

# PgBouncer auth pool (localhost only, SCRAM)
host    all     athyperauthdb_user     127.0.0.1/32    scram-sha-256

# IPv4 localhost connections (admin/migrations)
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 localhost connections
host    all             all             ::1/128                 scram-sha-256

# Replication (uncomment when replica is configured)
# host    replication     repl_user       <REPLICA_IP>/32       scram-sha-256

# Reject everything else
host    all     all     0.0.0.0/0     reject
host    all     all     ::/0          reject
