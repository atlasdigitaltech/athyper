# ========================================================
# Athyper Staging pg_hba.conf
# PostgreSQL accessed exclusively via Docker internal network
# (athyper-internal: internal=true — no external reachability)
#
# Why 10.0.0.0/8 instead of a pinned subnet:
#   Docker assigns the athyper-internal subnet dynamically (observed:
#   10.200.0.0/24). Using /8 avoids breakage if Docker picks a
#   different address on network recreation. The network's
#   internal:true flag already blocks external traffic; scram-sha-256
#   requires a valid password for every TCP connection.
# ========================================================

# Unix socket — postgres admin + docker exec access
local   all             postgres                                 peer
local   all             all                                      peer

# Docker internal network (athyper-internal) — pgbouncer → postgres
# DBPOOL_APPS_USER and DBPOOL_SESSION_USER both resolve to the postgres
# superuser (set in secrets/.env). pgbouncer_auth_user retained for
# future auth_query mode.
host    all   postgres              10.0.0.0/8      scram-sha-256
host    all   pgbouncer_auth_user   10.0.0.0/8      scram-sha-256
host    all   athyper_user          10.0.0.0/8      scram-sha-256

# Deny everything else
host    all   all                   0.0.0.0/0       reject
host    all   all                   ::0/0           reject
