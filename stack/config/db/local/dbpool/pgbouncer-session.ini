[databases]
; Frozen topology — dbpool_session / session / port 6433
; Budget: iam=10, analytics=5 → total=15 server conns
; Session mode required: Keycloak (prepared statements + advisory locks),
; Metabase (JDBC prepared statements via HikariCP).
athyper_iam       = host=db port=5432 dbname=athyper_iam       pool_size=10
athyper_analytics = host=db port=5432 dbname=athyper_analytics pool_size=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = session

max_client_conn = 100
default_pool_size = 10
reserve_pool_size = 3
reserve_pool_timeout = 5
max_db_connections = 15

server_connect_timeout = 15
server_login_retry = 2
server_idle_timeout = 300
client_idle_timeout = 600
server_lifetime = 7200

server_reset_query = DISCARD ALL
server_reset_query_always = 1

ignore_startup_parameters = extra_float_digits, options

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

admin_users = athyperadmin
stats_users = athyperadmin
