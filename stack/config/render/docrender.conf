############################################
# docrender tuning — athyper render pipeline
# Environment: LOCAL
#
# Per-environment variants:
#   Local (this file):  render/docrender.conf
#   Staging:            render/environments/docrender.staging.conf
#   Production:         render/environments/docrender.production.conf
#
# NOTE: Gotenberg does NOT read this file. Gotenberg 8.x is CLI-flag
# driven only. This file is the canonical reference of tuning decisions
# and is mounted read-only into the container at
# /etc/athyper/render/docrender.conf for operator visibility
# (docker exec docrender cat /etc/athyper/render/docrender.conf).
#
# To actually change a knob:
#   1. Edit this file (per-env variant).
#   2. Copy the same KEY=VALUE into stack/env/.env (and the env.example
#      under stack/env/).
#   3. `docker compose up -d docrender` — compose bakes the value into
#      the CLI flag at parse time via ${VAR} interpolation.
############################################

# --- HTTP API timeout ---
# Upper bound on a single Gotenberg HTTP request. Must exceed the worst
# realistic conversion time (typically dominated by LibreOffice cold
# start + large Office documents). Tune up if you see 504s under load.
DOCRENDER_API_TIMEOUT=120s

# --- LibreOffice restart cadence ---
# LibreOffice leaks memory over long-running pools. Restart after N
# conversions trades a cold-start (~2s) for bounded memory growth.
# Smaller N = tighter memory, more cold starts. Larger N = higher
# throughput, higher memory ceiling. 50 is the upstream-recommended
# local default.
DOCRENDER_LIBREOFFICE_RESTART_AFTER=50

# --- Chromium allow-list ---
# Regex of URL schemes Chromium will load for HTML→PDF. `file:///tmp.*`
# restricts Chromium to files under /tmp (where Gotenberg writes its
# ephemeral request scratch). Widening this is a SECURITY decision:
# `http://.*` would let a malicious template exfiltrate via embedded
# requests. Do not widen without a concrete ops-approved reason.
DOCRENDER_CHROMIUM_ALLOW_LIST=file:///tmp.*

# --- Resource limits (Docker-level, set on compose service) ---
# These are here for discoverability; the actual enforcement happens in
# stack/compose/render/athyper-docrender.yml via `deploy.resources.limits`
# and in the per-env override (athyper.override.<env>.yml).
DOCRENDER_REPLICAS=1
DOCRENDER_MEMORY_LIMIT=1g
# CPU limit per replica. LibreOffice is CPU-intensive; without this a
# single replica can saturate a host core during batch conversions, and
# multiple scaled replicas (--scale docrender=N) will each inherit the
# limit — preventing them from collectively starving the host.
DOCRENDER_CPU_LIMIT=1.0

# --- App-side consumer URL ---
# Resolved by api and worker from inside the internal
# network. Do not expose publicly; Gotenberg has no auth.
DOCRENDER_BASE_URL=http://docrender:3000
