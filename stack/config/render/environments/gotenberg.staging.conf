############################################
# Gotenberg tuning — athyper render pipeline
# Environment: STAGING
#
# Diff against ../gotenberg.conf (local) to see the staging-specific
# knobs. Copy the KEY=VALUE lines below into
# stack/env/staging.env.example and the deployed stack/env/.env on the
# staging host to actually take effect.
#
# See ../README.md for the full contract + operator workflow.
############################################

# --- HTTP API timeout ---
# Staging mirrors production; larger ceiling than local since real
# workloads hit this surface.
GOTENBERG_API_TIMEOUT=180s

# --- LibreOffice restart cadence ---
# Stage parity with production.
GOTENBERG_LIBREOFFICE_RESTART_AFTER=100

# --- Chromium allow-list ---
# Same lockdown as local; widening is a security decision.
GOTENBERG_CHROMIUM_ALLOW_LIST=file:///tmp.*

# --- Resource limits ---
# 2 replicas behind the LB to validate multi-instance routing before
# production. Memory slightly above local to absorb OCR-adjacent peaks.
# CPU cap: 1.0 per replica keeps 2 replicas within a 2-core budget and
# leaves headroom for other services on the staging host.
GOTENBERG_REPLICAS=2
GOTENBERG_MEMORY_LIMIT=1500m
GOTENBERG_CPU_LIMIT=1.0

# --- App-side consumer URL ---
GOTENBERG_BASE_URL=http://gotenberg:3000
