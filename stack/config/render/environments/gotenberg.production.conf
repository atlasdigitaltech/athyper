############################################
# Gotenberg tuning — athyper render pipeline
# Environment: PRODUCTION
#
# Diff against ../gotenberg.conf (local) and ./gotenberg.staging.conf
# to see production-specific knobs. Copy the KEY=VALUE lines below into
# stack/env/production.env.example and the deployed stack/env/.env on
# the production host to actually take effect.
#
# See ../README.md for the full contract + operator workflow.
############################################

# --- HTTP API timeout ---
# Production timeout ceiling. Keep in line with the GotenbergClient
# timeout in server/src/foundation/render/gotenberg-client.ts — if the
# app-side client gives up sooner, this value is cosmetic.
GOTENBERG_API_TIMEOUT=180s

# --- LibreOffice restart cadence ---
# Beefier prod hosts can carry a longer LibreOffice pool before the
# memory-leak cost outweighs the cold-start cost. Revisit if grafana
# shows gotenberg_rss climbing after large Office batches.
GOTENBERG_LIBREOFFICE_RESTART_AFTER=100

# --- Chromium allow-list ---
# DO NOT widen without a documented ops-approved reason. Widening to
# `http://.*` lets a malicious template make arbitrary outbound
# requests from Chromium — effectively SSRF via render job.
GOTENBERG_CHROMIUM_ALLOW_LIST=file:///tmp.*

# --- Resource limits ---
# Two replicas behind Traefik. Memory ceiling bumped to carry large
# PDFs + concurrent LibreOffice jobs without OOM-killing mid-convert.
# CPU cap: 1.5 per replica on beefier production hosts. Two replicas at
# 1.5 CPUs = 3 cores total; review if grafana shows sustained throttling
# during heavy Office batch runs and bump to 2.0 as needed.
GOTENBERG_REPLICAS=2
GOTENBERG_MEMORY_LIMIT=2g
GOTENBERG_CPU_LIMIT=1.5

# --- App-side consumer URL ---
GOTENBERG_BASE_URL=http://gotenberg:3000
