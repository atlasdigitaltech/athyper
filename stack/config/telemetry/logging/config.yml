# Storage backend is parameterised via env expansion — the compose command
# passes `-config.expand-env=true`, so ${VAR} references below are
# substituted from the container environment at start. Local dev defaults
# to backend=filesystem (bind-mounted to ${ATHYPER_DATA}/telemetry/logging);
# staging/production set LOKI_STORAGE_BACKEND=s3 against the stack's MinIO
# (objectstorage service). Both `filesystem` and `aws` sub-blocks are always
# parsed; only the one selected by `object_store:` in schema_config is activated.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: ${LOKI_STORAGE_BACKEND}
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  aws:
    bucketnames: ${LOKI_S3_BUCKET}
    endpoint: ${LOKI_S3_ENDPOINT}
    access_key_id: ${LOKI_S3_ACCESS_KEY}
    secret_access_key: ${LOKI_S3_SECRET_KEY}
    # MinIO requires path-style addressing (bucket in URL, not subdomain).
    s3forcepathstyle: true
    insecure: ${LOKI_S3_INSECURE}

ingester:
  wal:
    enabled: true
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: ${LOKI_STORAGE_BACKEND}

limits_config:
  allow_structured_metadata: true
  retention_period: 168h
