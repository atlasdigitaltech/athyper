# ============================================================================
# Athyper Document Registry Alert Rules
# Prometheus alerting rules for the financial document registry.
#
# Targets: posting inconsistencies, bridge completeness, status mapping,
#          closed-period violations, approval evidence gaps
# Grafana datasource: Prometheus (default)
# ============================================================================

groups:
  - name: document_registry_compliance
    interval: 60s
    rules:
      - alert: PostingInconsistencyHigh
        expr: fin_doc_registry_compliance_posting_inconsistency > 5
        for: 10m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Posting inconsistencies detected ({{ $value }} documents)"
          description: "More than 5 documents have posting/JE inconsistencies for 10+ minutes. Check finance document JE links and journal_entry source metadata."

      - alert: PostingInconsistencyCritical
        expr: fin_doc_registry_compliance_posting_inconsistency > 100
        for: 2m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Critical posting inconsistency count ({{ $value }})"
          description: "Over 100 posting inconsistencies detected. Immediate investigation required."

      - alert: ApprovedNotPostedBacklog
        expr: fin_doc_registry_compliance_approved_not_posted > 50
        for: 10m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Approved-but-unposted document backlog ({{ $value }})"
          description: "More than 50 approved documents pending posting. May indicate posting pipeline issues."

      - alert: ClosedPeriodPostingViolation
        expr: fin_doc_registry_compliance_closed_period_violation > 0
        for: 1m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Documents posted in closed period ({{ $value }})"
          description: "Documents detected with posting_date in a closed fiscal period. Audit investigation required."

      - alert: EntityMismatchDetected
        expr: fin_doc_registry_compliance_entity_mismatch > 0
        for: 5m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Entity code mismatch between registry and JE ({{ $value }})"
          description: "Documents found where registry entity_code differs from journal entry entity_code."

  - name: document_registry_bridge
    interval: 60s
    rules:
      - alert: MultibookBridgeIncomplete
        expr: fin_doc_registry_bridge_incomplete > 5
        for: 5m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Incomplete multi-book postings ({{ $value }} documents)"
          description: "Documents with failed or partially completed multi-book postings detected."

  - name: document_registry_sync
    interval: 30s
    rules:
      - alert: TriggerSyncFailureRate
        expr: clamp_min(delta(fin_doc_registry_trigger_sync_failed_count[5m]), 0) > 5
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Document registry trigger sync failures elevated"
          description: "More than 5 registry trigger sync failures appeared in the last 5 minutes."

      - alert: StatusMappingFallback
        expr: fin_doc_registry_status_mapping_fallbacks > 0
        for: 5m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Status mapping fallbacks elevated (unmapped statuses)"
          description: "Unknown source statuses falling back to DRAFT at elevated rate. May indicate missing canonical_status_mapping entries."

      - alert: StatusMappingFastBurn
        expr: tenant:fin_doc_registry_status_mapping_burn_rate:5m > 14.4
        for: 5m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Status mapping SLO fast burn ({{ $labels.tenant }})"
          description: "Status mapping success is consuming the 99.9% SLO error budget faster than the 5m burn threshold."

      - alert: StatusMappingSlowBurn
        expr: tenant:fin_doc_registry_status_mapping_burn_rate:6h > 6
        for: 15m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Status mapping SLO slow burn ({{ $labels.tenant }})"
          description: "Status mapping success is consuming the 99.9% SLO error budget faster than the 6h burn threshold."

  - name: document_registry_approval
    interval: 60s
    rules:
      - alert: ApprovedWithoutScoring
        expr: fin_doc_registry_compliance_approved_without_scoring > 20
        for: 10m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "Documents approved without decision grid scoring ({{ $value }})"
          description: "Documents in APPROVED/POSTED state without decision_score evidence. May indicate Decision Grid bypass."
