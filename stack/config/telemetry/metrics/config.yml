# Prometheus scrape configuration (single-host compose).
#
# Timing:
#   scrape_interval 15s + scrape_timeout 10s gives the /metrics handler
#   room to compute BullMQ queue histograms under load while still
#   leaving a 5s headroom buffer. Prometheus requires
#   scrape_timeout <= scrape_interval. Rule windows below use [5m]
#   (~20 samples) and alert `for:` clauses are >= 30s, so this pacing
#   does not affect alerting fidelity.
#
# Target discovery:
#   All scrape targets are static DNS names resolved on the internal
#   Docker network (athyper-api:3000, memorycache_exporter:9121, etc.).
#   This is correct for the single-host compose topology. Multi-host,
#   Swarm, or Kubernetes deployments must replace these blocks with
#   service discovery (dns_sd_configs, kubernetes_sd_configs, or an
#   external Prometheus with federation). See
#   docs/guides/stack-container.md §5 "Observability constraints".
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - governance-alerts.yml
  - redis-alerts.yml
  - document-registry-alerts.yml
  # NOTE: document-registry-slo.yml is a specification document, not Prometheus-native.
  # It uses a custom recording_rules/slos YAML format. Do not add it to rule_files.

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["metrics:9090"]
        labels:
          service: prometheus
          component: prometheus
          env: local
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
          component: alertmanager
          env: local
  - job_name: redis_exporter
    static_configs:
      - targets: ["memorycache_exporter:9121"]
        labels:
          service: memorycache
          role: primary
          component: redis_exporter
          env: local

  # Application-level cache metrics (tenant-scoped hit/miss/write/invalidated).
  # Complements redis_exporter which only provides Redis-server-wide stats.
  # Endpoint: GET athyper-api:3000/metrics  (internal network only — not via Traefik edge)
  # Metrics: athyper_cache_operations_total, athyper_cache_invalidated_keys_total
  - job_name: athyper_api
    metrics_path: /metrics
    static_configs:
      - targets: ["athyper-api:3000"]
        labels:
          service: athyper-api
          component: cache_metrics
          env: local
  - job_name: loki
    static_configs:
      - targets: ["logging:3100"]
        labels:
          service: logging
          component: loki
          env: local
  - job_name: alloy
    static_configs:
      - targets: ["logshipper:12345"]
        labels:
          service: logging
          component: alloy
          env: local
  - job_name: tempo
    static_configs:
      - targets: ["tracing:3200"]
        labels:
          service: tracing
          component: tempo
          env: local
