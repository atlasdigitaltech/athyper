# ============================================================================
# Athyper Governance Alert Rules
# Prometheus alerting rules for the governance subsystem.
#
# Targets: archive backlog, legal holds, quotas, and privacy
# Grafana datasource: Prometheus (default)
# ============================================================================

groups:
  - name: governance_archive
    interval: 30s
    rules:
      - alert: ArchiveJobBacklogHigh
        expr: gov_archive_job_backlog > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Archive job backlog is high ({{ $value }} pending)"
          description: "The archive job queue has exceeded 100 pending jobs for 5+ minutes. Check archiver worker health."

      - alert: ArchiveJobBacklogCritical
        expr: gov_archive_job_backlog > 500
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Archive job backlog is critical ({{ $value }} pending)"
          description: "The archive job queue has exceeded 500 pending jobs. Immediate investigation required."

      - alert: ArchiveJobFailuresHigh
        expr: gov_archive_jobs_failed > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Archive job failures are elevated"
          description: "More than 10 partition archive jobs failed in the recent monitoring window."

  - name: governance_legal_holds
    interval: 30s
    rules:
      - alert: LegalHoldCreated
        expr: clamp_min(delta(gov_legal_holds_created[5m]), 0) > 0
        labels:
          severity: info
          team: compliance
        annotations:
          summary: "New legal hold created"
          description: "A new legal hold was issued (source={{ $labels.source }}, scope={{ $labels.scope }}). Retention/tiering frozen for affected scope."

      - alert: LegalHoldReleased
        expr: clamp_min(delta(gov_legal_holds_released[5m]), 0) > 0
        labels:
          severity: info
          team: compliance
        annotations:
          summary: "Legal hold released"
          description: "A legal hold was released (source={{ $labels.source }}). Affected manifests may now be eligible for lifecycle transitions."

      - alert: HighHeldManifestCount
        expr: gov_manifests_held > 100
        for: 10m
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "Large number of held manifests ({{ $value }})"
          description: "Over 100 archive manifests are under legal hold. Review hold scopes for potential over-retention."

      - alert: LegalHoldOverlapDetected
        expr: gov_legal_hold_overlaps > 5
        labels:
          severity: warning
          team: compliance
        annotations:
          summary: "Frequent legal hold overlaps detected"
          description: "Multiple holds covering the same scope detected. Review hold management for conflicts."

  - name: governance_quotas
    interval: 15s
    rules:
      - alert: QuotaBreached
        expr: gov_quota_breaches > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Quota breach detected ({{ $labels.quota_key }})"
          description: "Tenant {{ $labels.tenant }} has breached quota {{ $labels.quota_key }}."

      - alert: QuotaUtilizationHigh
        expr: gov_quota_utilization_pct > 90
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Quota utilization >90% ({{ $labels.quota_key }})"
          description: "Tenant {{ $labels.tenant }} quota {{ $labels.quota_key }} at {{ $value }}%. Consider limit increase or usage review."

  - name: governance_privacy
    interval: 30s
    rules:
      - alert: PrivacyGuardPiiDetectionSpike
        expr: clamp_min(delta(gov_privacy_guard_warned[5m]), 0) > 300
        for: 3m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Privacy guard detecting PII at high rate"
          description: "The attachment extraction worker detected more than 300 PII-positive attachments in 5 minutes. Check upload sources for PII exposure."

      - alert: PrivacyGuardDetectionRate
        expr: clamp_min(delta(gov_privacy_guard_warned[5m]), 0) / clamp_min(delta(gov_privacy_guard_inspected[5m]), 1) > 0.5 and delta(gov_privacy_guard_inspected[5m]) >= 10
        for: 10m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Over 50% of inspected attachments contain PII"
          description: "High PII detection rate may indicate missing privacy controls at the source."

  - name: governance_purge
    interval: 60s
    rules:
      - alert: PurgeReadyManifestsStale
        expr: gov_manifests_purge_ready > 20
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "{{ $value }} manifests are purge-ready but not purged"
          description: "Archive manifests have been eligible for purge for >1h. Check purge worker health or approval queues."

  - name: telemetry_metric_collectors
    interval: 30s
    rules:
      - alert: PlatformMetricCollectorDown
        expr: athyper_metric_collector_up{name="platform"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Platform metric collector is failing"
          description: "The /metrics live platform collector failed for 2+ minutes. Governance and document-registry alert inputs may be stale or absent."

      - alert: PlatformMetricCollectorMissing
        expr: absent(athyper_metric_collector_up{name="platform"})
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Platform metric collector is missing"
          description: "Prometheus is not receiving athyper_metric_collector_up{name=\"platform\"}. Check api /metrics registration and scrape health."

      - alert: PlatformMetricCollectorStale
        expr: time() - athyper_metric_collector_last_success_timestamp_seconds{name="platform"} > 120
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Platform metric collector success timestamp is stale"
          description: "The platform collector has not completed successfully for more than 2 minutes."

      - alert: PlatformMetricSectionDown
        expr: athyper_studio_metric_section_up == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Platform metric section is failing ({{ $labels.section }})"
          description: "A platform metric sub-collector failed for 5+ minutes while other sections may still be scraping."
