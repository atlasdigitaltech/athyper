# ============================================================================
# Athyper Recording Rules
#
# Pre-aggregates common dashboard and SLO inputs so Grafana panels do not need
# to recompute high-cardinality rate/histogram queries on every refresh.
# ============================================================================

groups:
  - name: athyper_http_aggregates
    interval: 30s
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job, service, tenant_id, method, route, status) (rate(athyper_http_requests_total[5m]))

      - record: job:http_errors:rate5m
        expr: sum by (job, service, tenant_id, method, route) (rate(athyper_http_requests_total{status=~"5.."}[5m]))

      - record: job:http_error_ratio:rate5m
        expr: |
          sum by (job, service, tenant_id, method, route) (rate(athyper_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job, service, tenant_id, method, route) (rate(athyper_http_requests_total[5m])), 0.001)

      - record: job:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, service, tenant_id, method, route, le) (
              rate(athyper_http_request_duration_seconds_bucket[5m])
            )
          )

  - name: athyper_queue_aggregates
    interval: 30s
    rules:
      - record: job:queue_depth:sum
        expr: sum by (job, service, queue, state) (athyper_queue_jobs)

  - name: athyper_document_registry_aggregates
    interval: 60s
    rules:
      - record: tenant:fin_doc_registry_posting_inconsistency:sum
        expr: sum by (tenant, tenant_id) (fin_doc_registry_compliance_posting_inconsistency)

      - record: tenant:fin_doc_registry_bridge_incomplete:sum
        expr: sum by (tenant, tenant_id) (fin_doc_registry_bridge_incomplete)

      - record: tenant:fin_doc_registry_approved_not_posted:sum
        expr: sum by (tenant, tenant_id) (fin_doc_registry_compliance_approved_not_posted)

      - record: tenant:fin_doc_registry_closed_period_violation:sum
        expr: sum by (tenant, tenant_id) (fin_doc_registry_compliance_closed_period_violation)

      # Proxy SLO: these source metrics are DB snapshot gauges. Positive deltas
      # approximate newly observed fallback statuses and completed sync rows.
      - record: tenant:fin_doc_registry_status_mapping_error_ratio:5m
        expr: |
          sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_status_mapping_fallbacks[5m]), 0))
          /
          clamp_min(
            sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_status_mapping_fallbacks[5m]), 0))
            +
            sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_trigger_sync_count[5m]), 0)),
            1
          )

      - record: tenant:fin_doc_registry_status_mapping_burn_rate:5m
        expr: tenant:fin_doc_registry_status_mapping_error_ratio:5m / 0.001

      - record: tenant:fin_doc_registry_status_mapping_error_ratio:6h
        expr: |
          sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_status_mapping_fallbacks[6h]), 0))
          /
          clamp_min(
            sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_status_mapping_fallbacks[6h]), 0))
            +
            sum by (tenant, tenant_id) (clamp_min(delta(fin_doc_registry_trigger_sync_count[6h]), 0)),
            1
          )

      - record: tenant:fin_doc_registry_status_mapping_burn_rate:6h
        expr: tenant:fin_doc_registry_status_mapping_error_ratio:6h / 0.001
