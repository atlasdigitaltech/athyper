apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://metrics:9090
    isDefault: true
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tracing:3200
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://logging:3100
