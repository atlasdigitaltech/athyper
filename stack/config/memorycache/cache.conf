############################################
# Cache-only Redis for athyper framework
# Environment: LOCAL (128MB container)
#
# Per-environment variants:
#   Local (this file): memorycache/cache.conf
#   Staging:           memorycache/environments/cache.staging.conf
#   Production:        memorycache/environments/cache.production.conf
#
# Deploy: copy the right variant to cache.conf on target host.
############################################

# Network
port 6379
bind 0.0.0.0
protected-mode yes

# Memory + Eviction (CRITICAL)
# maxmemory must stay below the Docker mem_limit (MEMORYCACHE_MEMORY_LIMIT=128m).
# 100mb leaves ~28m headroom for Redis internal overhead (zmalloc, client buffers, etc.)
# so the kernel OOM killer never fires before noeviction can reject writes cleanly.
maxmemory 100mb
maxmemory-policy noeviction
maxmemory-samples 10

# Performance / housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Durability OFF (cache-only)
appendonly no
save ""

# Safety limits (avoid client runaway)
timeout 300
tcp-keepalive 300

# Performance (Enable based on performance; tune if needed)
databases 3
maxclients 5000
# io-threads 2
# io-threads-do-reads yes

# Optional (reduce huge value risk; tune if needed)
proto-max-bulk-len 8mb
activedefrag yes
logfile ""

# Logging
loglevel notice

# ACL file is injected at startup via --aclfile /tmp/redis-acl.conf (see compose entrypoint)
# so it is NOT declared here — declaring it here would load the unprocessed template.
