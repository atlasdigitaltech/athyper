############################################
# Cache-only Redis for athyper framework
# Environment: PRODUCTION (512MB container)
############################################

# Network
port 6379
# The container is reachable only on Compose networks; ACLs provide client auth.
bind 0.0.0.0
protected-mode yes

# Memory + Eviction
# Container limit: MEMORYCACHE_MEMORY_LIMIT=512m
# 400mb leaves ~112m headroom for Redis internal overhead
maxmemory 400mb
maxmemory-policy noeviction
maxmemory-samples 10

# Performance / housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Session revocation and refresh state must survive a container restart.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save ""

# Safety limits
timeout 300
tcp-keepalive 300

# Performance
# DB index assignments (never overlap these):
#   DB 0 — app (bull:*, session:*, jwks:*, bootstrap:*, etc.)
#   DB 1 — glitchtip (Celery tasks + Django cache; REDIS_GLITCHTIP_DB=1)
#   DB 2 — infisical (session cache + rate limiting)
#   DB 3 — healthchecks (Celery; reserved — REDIS_HEALTHCHECKS_DB=3)
databases 4
maxclients 10000
io-threads 2
io-threads-do-reads yes

# Optional
proto-max-bulk-len 8mb
activedefrag yes
logfile ""

# Logging (warn in production — reduce noise)
loglevel warning

# ACL is injected at startup via --aclfile in the Compose entrypoint.
