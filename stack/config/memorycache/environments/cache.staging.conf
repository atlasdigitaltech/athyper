############################################
# Cache-only Redis for athyper framework
# Environment: STAGING (256MB container)
############################################

# Network
port 6379
bind 0.0.0.0
protected-mode yes

# Memory + Eviction
# Container limit: MEMORYCACHE_MEMORY_LIMIT=256m
# 200mb leaves ~56m headroom for Redis internal overhead
maxmemory 200mb
maxmemory-policy noeviction
maxmemory-samples 10

# Performance / housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Durability OFF (cache-only)
appendonly no
save ""

# Safety limits
timeout 300
tcp-keepalive 300

# Threading — match production so threading issues surface pre-prod
io-threads 2
io-threads-do-reads yes

# Performance
# DB index assignments (never overlap these):
#   DB 0 — app (bull:*, session:*, jwks:*, bootstrap:*, etc.)
#   DB 1 — glitchtip (Celery tasks + Django cache; REDIS_GLITCHTIP_DB=1)
#   DB 2 — infisical (session cache + rate limiting)
#   DB 3 — healthchecks (Celery; reserved — REDIS_HEALTHCHECKS_DB=3)
databases 4
maxclients 5000

# Optional
proto-max-bulk-len 8mb
activedefrag yes
logfile ""

# Logging
loglevel notice

# ACL is injected at startup via --aclfile in the Compose entrypoint.
