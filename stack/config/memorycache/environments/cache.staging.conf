############################################
# Cache-only Redis for athyper framework
# Environment: STAGING (256MB container)
############################################

# Network
port 6379
bind 127.0.0.1
protected-mode yes

# Memory + Eviction
# Container limit: MEMORYCACHE_MEMORY_LIMIT=256m
# 200mb leaves ~56m headroom for Redis internal overhead
maxmemory 200mb
maxmemory-policy noeviction
maxmemory-samples 10

# Performance / housekeeping
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Durability OFF (cache-only)
appendonly no
save ""

# Safety limits
timeout 300
tcp-keepalive 300

# Threading — match production so threading issues surface pre-prod
io-threads 2
io-threads-do-reads yes

# Performance
databases 3
maxclients 5000

# Optional
proto-max-bulk-len 8mb
activedefrag yes
logfile ""

# Logging
loglevel notice

# ACL
aclfile /usr/local/etc/redis/redis-acl.conf
