# =======================================================================
# Stack       : athyper Stack – TLS Configuration
# Environment : PRODUCTION
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
#
# Deploy: copy this file to stack/config/gateway/dynamic/athyper.tls.yml
#         on the production host, replacing the local variant.
#
# Differences from local:
#   - TLS 1.3 minimum (stricter than staging/local TLS 1.2)
#   - Restricted curve preferences (X25519, CurveP256)
#   - Certificates sourced from production-specific paths
# =======================================================================

http:
  middlewares:
    athyper-dashboard-auth:
      basicAuth:
        users:
          - "{{ env "GATEWAY_DASHBOARD_HTPASSWD" }}"

tls:
  options:
    # Default TLS options — referenced by routers via athyper-tls-default@file.
    # Production enforces TLS 1.3 minimum + restricted curves.
    athyper-tls-default:
      minVersion: VersionTLS13
      curvePreferences:
        - X25519
        - CurveP256

  stores:
    default:
      defaultCertificate:
        certFile: /certs/athyper.tls.crt
        keyFile: /certs/athyper.tls.key

  certificates:
    - certFile: /certs/athyper.tls.crt
      keyFile: /certs/athyper.tls.key
