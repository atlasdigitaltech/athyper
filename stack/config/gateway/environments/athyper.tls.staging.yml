# =======================================================================
# Stack       : athyper Stack – TLS Configuration
# Environment : STAGING
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
#
# Deploy: copy this file to stack/config/gateway/dynamic/athyper.tls.yml
#         on the staging host, replacing the local variant.
#
# Differences from local:
#   - No static cert store — certs are issued and managed by Traefik ACME
#     (letsencrypt-staging resolver). Routers reference certResolver directly.
#   - TLS 1.2 minimum (same as local, broader tool compatibility)
# =======================================================================

http:
  middlewares:
    athyper-dashboard-auth:
      basicAuth:
        users:
          - "{{ env "GATEWAY_DASHBOARD_HTPASSWD" }}"

tls:
  options:
    # Default TLS options — referenced by routers via athyper-tls-default@file.
    # Staging enforces TLS 1.2 minimum (broader tool compatibility than prod).
    athyper-tls-default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

  # No static store or certificates block needed for ACME — Traefik manages
  # the Let's Encrypt cert in acme.json and serves it per-router via certResolver.
  # Routers in neon-workbench-routes.staging.yml all specify:
  #   tls:
  #     certResolver: letsencrypt-staging
  #     options: athyper-tls-default@file
  #
  # The local variant (athyper.tls.yml) has a static stores:/certificates: block
  # for mkcert-generated files. Do NOT copy that block here — ACME does not use it
  # and a missing cert file will prevent Traefik from starting.
