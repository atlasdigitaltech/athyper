# =======================================================================
# Stack       : athyper Stack - Workbench Routes (Phase 1)
# Environment : PRODUCTION (default: neon.athyper.com, via APPS_ATHYPER_WEB_HOST env var)
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
#
# Deploy: copy this file to stack/config/gateway/dynamic/athyper.workbench.yml
#         on the production host, replacing the local variant.
#
# IMPORTANT: workbench-ip-restrict.sourceRange is EMPTY by default.
#   This means admin/ and ops/ routes will reject ALL traffic until you
#   add your corporate VPN CIDR blocks. This is intentional fail-closed
#   behavior — never deploy to production without configuring real CIDRs.
#
# Prerequisites:
#   - Traefik certificatesResolvers.letsencrypt must be configured
#     in the static config (athyper-gateway.yml command args).
#   - The `athyper-neon-web` upstream below resolves to the containerised
#     Next.js service defined in stack/compose/apps/athyper-apps.yml (profile
#     `apps`, F8 Phase 3, landed 2026-04-18). Bring the stack up with the
#     `apps` profile before the first gateway hit — otherwise Traefik returns
#     502 because the upstream is absent.
# =======================================================================

http:
  middlewares:
    workbench-strip-user:
      stripPrefix:
        prefixes: ["/user"]

    workbench-strip-admin:
      stripPrefix:
        prefixes: ["/admin"]

    workbench-strip-ops:
      stripPrefix:
        prefixes: ["/ops"]

    workbench-headers-user:
      headers:
        customRequestHeaders:
          X-Workbench-Context: "user"

    workbench-headers-admin:
      headers:
        customRequestHeaders:
          X-Workbench-Context: "admin"

    workbench-headers-ops:
      headers:
        customRequestHeaders:
          X-Workbench-Context: "ops"

    # !! DEPLOY-BLOCKER !! — replace before ANY production deployment.
    # The default 203.0.113.0/24 is TEST-NET-3 (RFC 5737) and will block ALL
    # real traffic to /admin and /ops routes. This is an intentional fail-safe.
    #
    # Replace with your corporate VPN CIDR(s):
    #   Tailscale example: "100.64.0.0/10"
    #   WireGuard example: "10.8.0.0/24"
    workbench-ip-restrict:
      ipAllowList:
        sourceRange:
          - "203.0.113.0/24"  # !! REPLACE — TEST-NET-3 (RFC 5737) fail-safe

    # ── Production-grade reliability + security ────────────────────────────────

    athyper-ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    athyper-inflight:
      inFlightReq:
        amount: 200
        sourceCriterion:
          requestHeaderName: "X-Forwarded-For"

    athyper-circuit-breaker:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.30 || NetworkErrorRatio() > 0.10"
        checkPeriod: 10s
        fallbackDuration: 10s
        recoveryDuration: 10s

    # Do not attach retry to the workbench routers below: they carry both page
    # loads and mutating BFF/API calls, so automatic retries can duplicate writes.
    # Keep this middleware only for future method-scoped idempotent routers.
    athyper-retry:
      retry:
        attempts: 2
        initialInterval: 50ms

    athyper-security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          X-XSS-Protection: "0"

    athyper-compress:
      compress:
        minResponseBodyBytes: 1024
        encodings: ["br", "gzip"]

  routers:
    neon-workbench-admin:
      rule: "Host(`{{ env "APPS_ATHYPER_WEB_HOST" }}`) && PathPrefix(`/admin`)"
      entryPoints: [websecure]
      service: athyper-neon-web@docker
      priority: 110
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - workbench-ip-restrict
        - workbench-strip-admin
        - workbench-headers-admin
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    neon-workbench-ops:
      rule: "Host(`{{ env "APPS_ATHYPER_WEB_HOST" }}`) && PathPrefix(`/ops`)"
      entryPoints: [websecure]
      service: athyper-neon-web@docker
      priority: 110
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - workbench-ip-restrict
        - workbench-strip-ops
        - workbench-headers-ops
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    neon-workbench-user:
      rule: "Host(`{{ env "APPS_ATHYPER_WEB_HOST" }}`) && PathPrefix(`/user`)"
      entryPoints: [websecure]
      service: athyper-neon-web@docker
      priority: 100
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - workbench-strip-user
        - workbench-headers-user
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    neon-default:
      rule: "Host(`{{ env "APPS_ATHYPER_WEB_HOST" }}`)"
      entryPoints: [websecure]
      service: athyper-neon-web@docker
      priority: 1
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - workbench-headers-user
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

  # No file-provider service definition: athyper-neon-web@docker is auto-discovered
  # from the container's Traefik labels (traefik.http.services.athyper-neon-web.
  # loadbalancer.server.port=3000 in athyper-apps.yml). APPS_ATHYPER_WEB_UPSTREAM_URL
  # is not used in staging/prod — the Docker provider resolves the container IP:port.
