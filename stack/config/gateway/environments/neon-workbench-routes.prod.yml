# =======================================================================
# Stack       : athyper Stack - Plane Routes
# Environment : PRODUCTION
#
# Deploy: copy this file to stack/config/gateway/dynamic/athyper.workbench.yml
# on the production host.
#
# The studio-plane allowlist intentionally starts with TEST-NET-3 and blocks
# all real traffic until replaced with the production VPN or office CIDR.
# =======================================================================

http:
  middlewares:
    plane-neon-headers:
      headers:
        customRequestHeaders:
          X-Athyper-Plane: "neon"
          X-Athyper-Trust-Level: "tenant"

    plane-mesh-headers:
      headers:
        customRequestHeaders:
          X-Athyper-Plane: "mesh"
          X-Athyper-Trust-Level: "partner"

    plane-studio-headers:
      headers:
        customRequestHeaders:
          X-Athyper-Plane: "studio"
          X-Athyper-Trust-Level: "internal"

    admin-ip-restrict:
      ipAllowList:
        sourceRange:
          - "203.0.113.0/24"  # Replace before deployment; TEST-NET-3 fail-safe.

    athyper-ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

    athyper-inflight:
      inFlightReq:
        amount: 200
        sourceCriterion:
          requestHeaderName: "X-Forwarded-For"

    athyper-circuit-breaker:
      circuitBreaker:
        expression: "ResponseCodeRatio(500, 600, 0, 600) > 0.30 || NetworkErrorRatio() > 0.10"
        checkPeriod: 10s
        fallbackDuration: 10s
        recoveryDuration: 10s

    athyper-security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          X-XSS-Protection: "0"

    athyper-compress:
      compress:
        minResponseBodyBytes: 1024
        encodings: ["br", "gzip"]

  routers:
    neon-plane-api:
      rule: "Host(`{{ env "APPS_ATHYPER_NEON_HOST" }}`) && PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: neon-web@docker
      priority: 110
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - plane-neon-headers
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    neon-plane:
      rule: "Host(`{{ env "APPS_ATHYPER_NEON_HOST" }}`)"
      entryPoints: [websecure]
      service: neon-web-failover
      priority: 10
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - plane-neon-headers
        - athyper-security-headers
        - athyper-compress

    mesh-plane-api:
      rule: "Host(`{{ env "APPS_ATHYPER_MESH_HOST" }}`) && PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: mesh-web@docker
      priority: 110
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - plane-mesh-headers
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    mesh-plane:
      rule: "Host(`{{ env "APPS_ATHYPER_MESH_HOST" }}`)"
      entryPoints: [websecure]
      service: mesh-web-failover
      priority: 10
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - plane-mesh-headers
        - athyper-security-headers
        - athyper-compress

    studio-plane-api:
      rule: "Host(`{{ env "APPS_ATHYPER_STUDIO_HOST" }}`) && PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: studio-web@docker
      priority: 120
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - admin-ip-restrict
        - plane-studio-headers
        - athyper-security-headers
        - athyper-compress
        - athyper-circuit-breaker

    studio-plane:
      rule: "Host(`{{ env "APPS_ATHYPER_STUDIO_HOST" }}`)"
      entryPoints: [websecure]
      service: studio-web-failover
      priority: 20
      tls:
        certResolver: letsencrypt
        options: athyper-tls-default@file
      middlewares:
        - athyper-ratelimit
        - athyper-inflight
        - admin-ip-restrict
        - plane-studio-headers
        - athyper-security-headers
        - athyper-compress

  services:
    neon-web-failover:
      failover:
        service: neon-web
        fallback: athyper-outage-page

    mesh-web-failover:
      failover:
        service: mesh-web
        fallback: athyper-outage-page

    studio-web-failover:
      failover:
        service: studio-web
        fallback: athyper-outage-page

    athyper-outage-page:
      loadBalancer:
        servers:
          - url: "http://gateway-outage:8080"

    neon-web:
      loadBalancer:
        healthCheck:
          path: /livez
          interval: 15s
          timeout: 5s
        servers:
          - url: "http://neon-web:3000"

    mesh-web:
      loadBalancer:
        healthCheck:
          path: /livez
          interval: 15s
          timeout: 5s
        servers:
          - url: "http://mesh-web:3000"

    studio-web:
      loadBalancer:
        healthCheck:
          path: /livez
          interval: 15s
          timeout: 5s
        servers:
          - url: "http://studio-web:3000"
