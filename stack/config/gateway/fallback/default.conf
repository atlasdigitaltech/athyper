server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;

    error_page 503 /status.html;
    sub_filter_once on;
    sub_filter '__STATUS_MODE__' 'outage';

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    location = /status.html {
        internal;
    }

    location /brand/ {
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}

# Planned maintenance is deliberately isolated from the automatic outage
# endpoint. Traefik sends traffic here only while an operator enables a
# maintenance router.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;

    error_page 503 /status.html;
    sub_filter_once on;
    sub_filter '__STATUS_MODE__' 'maintenance';

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    location = /status.html {
        internal;
    }

    location = /maintenance-config.json {
        try_files $uri =404;
    }

    location /brand/ {
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
