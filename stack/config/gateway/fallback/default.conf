server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;

    error_page 503 /index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "ok\n";
    }

    location = /index.html {
        internal;
    }

    location / {
        return 503;
    }
}
