<!doctype html>
<html lang="en" data-theme-family="atlas-modern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#234B84">
  <link rel="icon" type="image/png" sizes="64x64" href="/brand/athyper-favicon.png">
  <title>Service status</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #171717;
      background: #f7f7f7;
      --accent: #234B84;
      --accent-dark: #1B3C6A;
      --accent-soft: #EEF3F9;
      --accent-ring: rgba(35,75,132,.13);
      --route-ok: #0a9145;
    }
    body[data-mode="maintenance"] {
      --accent: #234B84;
      --accent-dark: #1B3C6A;
      --accent-soft: #EEF3F9;
      --accent-ring: rgba(35,75,132,.13);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 18% 8%, #fff 0, #f7f7f7 50%, #f0f0f0 100%); }
    .shell { width: min(1180px, 100%); height: auto; display: grid; grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; background: #fff; border: 1px solid #dcdcdc; border-radius: 18px; box-shadow: 0 14px 42px rgba(0,0,0,.11); }
    main { padding: 24px 30px 22px; display: flex; min-width: 0; flex-direction: column; }
    aside { padding: 26px 26px; display: flex; flex-direction: column; gap: 20px; background: #f5f6f8; border-left: 1px solid #ddd; }
    .wordmark { width: auto; height: 48px; max-width: 220px; object-fit: contain; object-position: left center; }
    .flow { width: min(620px, 92%); margin: 20px auto 22px; display: flex; align-items: center; justify-content: center; }
    .node { position: relative; z-index: 2; flex: 0 0 80px; min-height: 80px; display: grid; align-content: center; justify-items: center; gap: 3px; padding: 8px; border: 1px solid #bdc3ca; border-radius: 15px; background: #fff; text-align: center; font-size: 15px; font-weight: 680; }
    .node.gateway { border-color: #16914e; background: #ebf8f0; box-shadow: 0 0 0 10px rgba(10,145,69,.11); }
    .node.application { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 10px var(--accent-ring); }
    .node-icon { width: 30px; height: 30px; object-fit: contain; }
    .device-icon { width: 30px; height: 30px; color: #181818; }
    .route { position: relative; z-index: 1; flex: 1 1 120px; min-width: 54px; height: 3px; overflow: visible; background-image: linear-gradient(to right, var(--route-color) 55%, transparent 0); background-position: bottom; background-size: 12px 3px; background-repeat: repeat-x; --route-color: var(--route-ok); }
    .route.to-app { --route-color: var(--accent); }
    .route-dot { position: absolute; top: 50%; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--route-color); box-shadow: 0 0 0 6px color-mix(in srgb, var(--route-color) 16%, transparent); transform: translate(-50%,-50%); animation: travel 2.4s linear infinite; }
    .route.to-app .route-dot { animation-delay: 1.2s; }
    body[data-mode="outage"] .route.to-app::after { content: "×"; position: absolute; z-index: 3; top: 50%; left: 50%; width: 25px; height: 25px; display: grid; place-items: center; transform: translate(-50%,-50%); border: 1px solid var(--accent); border-radius: 50%; color: var(--accent-dark); background: #fff; font-size: 19px; line-height: 1; }
    body[data-mode="maintenance"] .route.to-app::after { content: "‖"; position: absolute; z-index: 3; top: 50%; left: 50%; width: 25px; height: 25px; display: grid; place-items: center; transform: translate(-50%,-50%); border: 1px solid var(--accent); border-radius: 50%; color: var(--accent-dark); background: #fff; font-size: 14px; font-weight: 800; line-height: 1; }
    body[data-mode="outage"] .route.to-app .route-dot { animation: outage-travel 2.4s ease-in-out infinite; }
    body[data-mode="maintenance"] .route.to-app .route-dot { animation: maintenance-travel 2.8s ease-in-out infinite; }
    .node.device { animation: device-breathe 2.8s ease-in-out infinite; }
    .node.gateway { animation: gateway-breathe 2.6s ease-in-out infinite; }
    .node.application { animation: application-breathe 2.6s ease-in-out infinite; }
    @keyframes travel { from { left: 0; opacity: .15; } 15%,85% { opacity: 1; } to { left: 100%; opacity: .15; } }
    @keyframes outage-travel { 0% { left: 0; opacity: .2; } 55% { left: 46%; opacity: 1; } 70%,100% { left: 46%; opacity: 0; } }
    @keyframes maintenance-travel { 0% { left: 0; opacity: .2; } 55% { left: 46%; opacity: 1; } 72%,100% { left: 46%; opacity: 0; } }
    @keyframes device-breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(76,120,184,0); } 50% { box-shadow: 0 0 0 7px rgba(76,120,184,.08); } }
    @keyframes gateway-breathe { 0%,100% { box-shadow: 0 0 0 8px rgba(10,145,69,.09); } 50% { box-shadow: 0 0 0 13px rgba(10,145,69,.14); } }
    @keyframes application-breathe { 0%,100% { box-shadow: 0 0 0 8px var(--accent-ring); } 50% { box-shadow: 0 0 0 13px var(--accent-ring); } }
    h1 { margin: 10px 0 9px; font-size: clamp(28px, 2.7vw, 38px); line-height: 1.12; letter-spacing: -.02em; }
    .message { max-width: 760px; margin: 0; color: #343434; font-size: 17px; line-height: 1.45; }
    .notice { margin-top: 20px; padding: 15px 18px; border: 1px solid #dce0e5; border-radius: 13px; background: #f7f8fa; }
    .notice-row { display: flex; align-items: center; gap: 15px; }
    .retry-ring { flex: 0 0 34px; width: 34px; height: 34px; border: 4px solid #e3e6e9; border-top-color: var(--route-ok); border-radius: 50%; animation: rotate 1.4s linear infinite; }
    body[data-mode="maintenance"] .retry-ring { animation-duration: 5s; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .notice strong { display: block; margin-bottom: 4px; font-size: 18px; }
    .notice span { color: #68707b; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }
    button, a.button { padding: 10px 17px; border: 1px solid #d3d3d3; border-radius: 10px; background: #fff; color: #171717; font: inherit; font-weight: 680; text-decoration: none; cursor: pointer; }
    button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .metric { padding-bottom: 17px; border-bottom: 1px solid #dde1e5; }
    .label { color: #68717d; font-size: 14px; font-weight: 760; text-transform: uppercase; }
    .value { margin-top: 4px; font-size: 19px; font-weight: 720; }
    .status { margin-top: 8px; display: grid; gap: 15px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .status-dot { width: 11px; height: 11px; border-radius: 50%; background: #07863f; }
    .status-dot.application { background: var(--accent); }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
    @media (max-width: 820px) { body { padding: 0; } .shell { width: 100%; height: auto; min-height: 100vh; grid-template-columns: 1fr; border: 0; border-radius: 0; } main { padding: 25px 22px; } aside { padding: 24px 22px; border: 0; border-top: 1px solid #ddd; } .wordmark { width: auto; height: 42px; max-width: 190px; } .flow { margin-block: 30px 26px; width: 100%; } .node { flex-basis: 76px; min-height: 76px; font-size: 14px; } .route { min-width: 28px; } .notice { margin-top: 30px; } .status { margin-top: 10px; } }
  </style>
</head>
<body data-mode="__STATUS_MODE__">
  <section class="shell" aria-labelledby="page-title">
    <main>
      <img id="wordmark" class="wordmark" alt="Application">
      <div class="flow" id="flow" aria-label="Connection status">
        <div class="node device">
          <svg class="device-icon" viewBox="0 0 36 36" aria-hidden="true"><rect x="7" y="5" width="22" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 24.5h27M13 24.5l-1.4 3h12.8l-1.4-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="15" y="10" width="6" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>You</span>
        </div>
        <div class="route"><span class="route-dot"></span></div>
        <div class="node gateway"><img class="node-icon" src="/brand/neon-favicon.png" alt=""><span>Gateway</span></div>
        <div class="route to-app"><span class="route-dot"></span></div>
        <div class="node application"><img id="app-icon" class="node-icon" alt=""><span id="app-node-name">Application</span></div>
      </div>
      <h1 id="page-title">Application temporarily unavailable.</h1>
      <p id="message" class="message"></p>
      <div class="notice" aria-live="polite"><div class="notice-row"><span class="retry-ring" aria-hidden="true"></span><div><strong id="notice-title">Checking service status</strong><span id="notice-detail">No action is needed.</span></div></div></div>
      <div class="actions"><button id="primary-action" class="primary" type="button">Check again</button><a id="status-link" class="button" href="#" hidden>View status page</a><button id="copy-reference" type="button" hidden>Copy incident</button></div>
    </main>
    <aside>
      <div class="metric"><div id="reference-label" class="label">Reference</div><div id="reference" class="value">Preparing status</div></div>
      <div class="metric"><div id="time-label" class="label">Started</div><div id="time-value" class="value">Just now</div></div>
      <div class="status">
        <div class="status-row"><div><div class="label">Athyper Gateway</div><div class="value">Online</div></div><span class="status-dot"></span></div>
        <div class="status-row"><div><div id="application-label" class="label">Application</div><div id="application-state" class="value">Unavailable</div></div><span class="status-dot application"></span></div>
        <div class="status-row"><div><div class="label">Athyper IAM Session</div><div class="value">Protected</div></div><span class="status-dot"></span></div>
      </div>
    </aside>
  </section>
  <script>
    const products = {
      neon: { name: "Neon", wordmark: "/brand/neon-advertising.svg", icon: "/brand/neon-favicon.png", audience: "tenant" },
      mesh: { name: "Mesh", wordmark: "/brand/mesh-advertising.svg", icon: "/brand/mesh-favicon.png", audience: "partner" },
      studio: { name: "Studio", wordmark: "/brand/studio-advertising.svg", icon: "/brand/studio-favicon.png", audience: "platform" }
    };
    const mode = document.body.dataset.mode === "maintenance" ? "maintenance" : "outage";
    const key = Object.keys(products).find(name => location.hostname.toLowerCase().startsWith(name + ".")) || "neon";
    const product = products[key];
    const byId = id => document.getElementById(id);
    const setText = (id, value) => { byId(id).textContent = value; };
    const now = new Date();
    const incident = "INC-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + "-" + String(Math.floor(1000 + Math.random()*9000));
    const dateTime = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
    byId("wordmark").src = product.wordmark; byId("wordmark").alt = product.name;
    byId("app-icon").src = product.icon; byId("app-icon").alt = product.name;
    setText("app-node-name", product.name); setText("application-label", product.name + " Application");
    byId("primary-action").addEventListener("click", () => location.reload());

    if (mode === "maintenance") {
      document.title = "Maintenance — " + product.name;
      setText("page-title", "Planned maintenance in progress.");
      setText("message", product.name + " application is temporarily unavailable while planned maintenance is completed. " + product.audience[0].toUpperCase() + product.audience.slice(1) + " access will resume after final health checks.");
      setText("reference-label", "Maintenance reference"); setText("reference", "Scheduled maintenance");
      setText("time-label", "Expected completion"); setText("time-value", "To be confirmed");
      setText("application-state", "Maintenance");
      setText("notice-title", "Expected completion time is being confirmed"); setText("notice-detail", "Please check the status page for updates.");
      fetch("/maintenance-config.json", { cache: "no-store" }).then(response => response.json()).then(config => {
        const item = config.applications && config.applications[key]; if (!item) return;
        if (item.reference) setText("reference", item.reference);
        const start = item.startsAt ? new Date(item.startsAt) : null; const end = item.endsAt ? new Date(item.endsAt) : null;
        if (end && !Number.isNaN(end.getTime())) {
          setText("time-value", dateTime.format(end));
          const update = () => { const minutes = Math.ceil((end - Date.now()) / 60000); if (minutes <= 0) { setText("notice-title", "Maintenance is taking longer than expected"); setText("notice-detail", "Final health checks are still in progress."); return; } const hours = Math.floor(minutes/60); setText("notice-title", "Expected back in " + (hours ? hours + "h " : "") + (minutes%60) + "m"); setText("notice-detail", start ? dateTime.format(start) + " – " + dateTime.format(end) : "Expected completion: " + dateTime.format(end)); };
          update(); setInterval(update, 30000);
        }
        if (item.statusUrl) { byId("status-link").href = item.statusUrl; byId("status-link").hidden = false; }
      }).catch(() => {});
    } else {
      document.title = "Service unavailable — " + product.name;
      setText("page-title", "Service temporarily unavailable.");
      setText("message", product.name + " application is not responding yet. The gateway is online, and " + product.audience + " access will resume when the application is healthy.");
      setText("reference-label", "Incident"); setText("reference", incident); setText("time-label", "Started"); setText("time-value", dateTime.format(now));
      setText("application-state", "Unavailable"); setText("notice-detail", "Based on gateway health checks · no action needed");
      setText("primary-action", "Retry now"); byId("copy-reference").hidden = false;
      let retry = 10; const updateRetry = () => { setText("notice-title", "Auto-retrying in " + retry + "s"); if (retry === 0) location.reload(); retry -= 1; }; updateRetry(); setInterval(updateRetry, 1000);
      byId("copy-reference").addEventListener("click", async () => { try { await navigator.clipboard.writeText(incident); setText("copy-reference", "Copied"); } catch { setText("copy-reference", "Copy unavailable"); } });
    }
  </script>
</body>
</html>
