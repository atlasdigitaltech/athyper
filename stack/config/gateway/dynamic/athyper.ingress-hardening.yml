# =======================================================================
# Stack       : athyper Stack – Ingress Hardening (Phase 6)
# Environment : staging, production
#
# Purpose:
#   Strip identity-selecting headers at the public edge so a client cannot
#   forge tenant/realm/plane context. Re-emit them only on trusted internal
#   hops via a signed marker (x-internal-hop) that the app middleware can
#   verify.
#
#   Headers stripped from inbound public traffic:
#     - x-org, x-realm, x-realm-key       (tenant/realm selectors)
#     - x-plane, x-plane-key              (plane selector)
#     - x-workbenches                     (workbench scope)
#     - x-user-id, x-user-roles           (forward-auth output headers —
#                                          a public client must not assert
#                                          identity by forging these)
#     - x-tenant-id, x-realm-roles,       (forward-auth output headers)
#       x-client-roles-*, x-verify-plane
#     - x-internal-hop                    (HMAC marker — only set by us)
#
#   Headers retained from public traffic:
#     - x-request-id (observability primitive; we override it server-side
#       if absent or untrusted)
#     - Authorization (the bearer is the auth assertion)
#     - x-csrf-token (BFF anti-CSRF; verified server-side)
#
#   Routers in athyper.api.yml / athyper.workbench.yml must include
#   `middlewares: [ingress-strip-identity@file]` on every entryPoint that
#   serves public traffic.
#
#   Trusted internal hops (svc-jobs → svc-api, etc.) bypass this strip by
#   targeting the internal service hostname (not the public router) and
#   carrying x-internal-hop = HMAC(ATHYPER_INTERNAL_HOP_SECRET, request-id).
#   App middleware verifies x-internal-hop before honoring x-tenant-id et al.
# =======================================================================

http:
  middlewares:
    ingress-strip-identity:
      headers:
        customRequestHeaders:
          # Set to empty → Traefik strips the inbound value before proxying.
          X-Org: ""
          X-Realm: ""
          X-Realm-Key: ""
          X-Plane: ""
          X-Plane-Key: ""
          X-Workbenches: ""
          X-User-Id: ""
          X-User-Roles: ""
          X-Tenant-Id: ""
          X-Realm-Roles: ""
          X-Verify-Plane: ""
          X-Internal-Hop: ""
        # Defense-in-depth: scoped-roles headers follow X-Client-Roles-{client}
        # naming. Traefik 3.x can't wildcard-strip; the app middleware rejects
        # any X-Client-Roles-* it didn't emit itself by checking the marker.

    # Apply to /api/auth/verify specifically to allow upstream gateway tooling
    # to pass x-plane / x-org (those are SELECTORS, not assertions) while
    # still scrubbing everything else.
    ingress-verify-endpoint:
      headers:
        customRequestHeaders:
          X-User-Id: ""
          X-User-Roles: ""
          X-Tenant-Id: ""
          X-Realm-Roles: ""
          X-Verify-Plane: ""
          X-Internal-Hop: ""

    # Outbound: ensure forward-auth output headers from /api/auth/verify reach
    # only the next hop, not the original client. Bind to routers that consume
    # forward-auth (e.g. partner-gateway-protected@docker).
    strip-forwardauth-output-from-response:
      headers:
        customResponseHeaders:
          X-User-Id: ""
          X-User-Roles: ""
          X-Tenant-Id: ""
          X-Realm-Roles: ""
          X-Verify-Plane: ""
