# =======================================================================
# Stack       : athyper Stack – Document Rendering
# Service     : Gotenberg — HTML/Office → PDF conversion
#
# Description :
#   Gotenberg replaces the planned athyper-renderer stub. HTML→PDF via
#   Chromium, Office→PDF via LibreOffice. Stateless HTTP service.
#
#   Tuning knobs (timeouts, LibreOffice restart cadence, Chromium
#   allow-list) are the canonical property of
#   stack/config/render/gotenberg.conf and its per-env variants under
#   stack/config/render/environments/. Gotenberg itself is CLI-flag
#   driven — the .conf file is an operator reference, mounted read-only
#   into the container purely for `docker exec` visibility. The values
#   below are interpolated at compose parse time from stack/env/.env;
#   operators must propagate changes from the .conf file into the env
#   file.
#
#   The runtime's document.render_output lifecycle drives jobs through
#   this service. See stack/config/render/README.md for the canonical
#   mapping between Gotenberg HTTP responses and
#   log.render_dlq.error_category — any GotenbergAdapter implementation
#   MUST honour that contract.
#
# Notes :
#   - Internal only (no edge). Reached at http://gotenberg:3000 from
#     athyper-api / athyper-worker.
#   - LibreOffice path is per-process-serialised; scale via replicas,
#     not in-process concurrency.
#   - No DB, no Redis, no persistence. Safe to hard-kill.
# =======================================================================

services:
  gotenberg:
    image: gotenberg/gotenberg:8.31.0
    profiles: ["render"]
    command:
      - "gotenberg"
      - "--api-timeout=${GOTENBERG_API_TIMEOUT:-120s}"
      - "--libreoffice-auto-start"
      - "--libreoffice-restart-after=${GOTENBERG_LIBREOFFICE_RESTART_AFTER:-50}"
      - "--chromium-allow-list=${GOTENBERG_CHROMIUM_ALLOW_LIST:-file:///tmp.*}"
    volumes:
      # Operator reference copy of the tuning decisions — NOT read by
      # Gotenberg. Surfaces via `docker exec gotenberg cat
      # /etc/athyper/render/gotenberg.conf`. Keep read-only.
      - ${ATHYPER_CONFIG}/render/gotenberg.conf:/etc/athyper/render/gotenberg.conf:ro
    networks: [internal]
    deploy:
      # NOTE: `replicas:` under `deploy:` is honored only by Docker Swarm
      # and Kubernetes. Plain `docker compose up` IGNORES it silently —
      # you will end up with a single gotenberg instance regardless of
      # GOTENBERG_REPLICAS. For compose-only scaling, use:
      #   docker compose up --scale gotenberg=${GOTENBERG_REPLICAS}
      # or define named services (gotenberg-1, gotenberg-2) behind a
      # load balancer. The production/staging overrides assume Swarm/K8s.
      replicas: ${GOTENBERG_REPLICAS:-1}
      resources:
        limits:
          memory: "${GOTENBERG_MEMORY_LIMIT}"
          cpus: "${GOTENBERG_CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Shutdown: 15s — allows in-flight LibreOffice conversions to drain
    stop_grace_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      athyper.service: "gotenberg"
