# =======================================================================
# Stack       : athyper Stack – Content Extraction
# Service     : Apache Tika — text + metadata extraction from 1000+ formats
#
# Description :
#   Tika extracts text from binary attachments (PDF, Office, images via
#   OCR). Feeds the CMS FTS index on master.content_item (preview_text,
#   Sprint 30 / 36) and downstream PII classification.
#
#   The attachment-text-extract BullMQ worker (Track B) fetches blobs
#   from object storage, POSTs to http://tika:9998/tika, and writes
#   extracted text back to Postgres.
#
#   Tuning (parsers, OCR, timeouts) lives in
#   stack/config/render/tika-config.xml and its per-env variants. Tika
#   reads it via the --config CLI flag; edits take effect on container
#   restart. See stack/config/render/README.md for the canonical
#   contract.
#
# Notes :
#   - Internal only (no edge).
#   - Stateless; no DB or persistence.
#   - CPU-heavy under OCR loads — keep the memory limit honest.
# =======================================================================

services:
  tika:
    # Pin explicitly — `:latest` drifts across unrelated deploys. Verify the
    # tag on https://hub.docker.com/r/apache/tika/tags and bump deliberately.
    image: apache/tika:3.0.0.0-full
    profiles: ["render"]
    command:
      - "-c"
      - "/config/tika-config.xml"
    volumes:
      - ${ATHYPER_CONFIG}/render/tika-config.xml:/config/tika-config.xml:ro
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: "${TIKA_MEMORY_LIMIT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      athyper.service: "tika"
