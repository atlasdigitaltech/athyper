# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-base-config
#
# Description :
#   Shared base for the athyper Stack.
#   Defines name and common networks only.
#
# Notes :
#   - No services should be defined here.
#   - Safe to reuse across all environments.
#   - Changes to this file affect the entire stack.
#
# =======================================================================

include:
  - athyper.base.yml
  - db/athyper-db.yml
  - db/athyper-dbpool-apps.yml
  - db/athyper-dbpool-session.yml
  - gateway/athyper-gateway.yml
  - iam/athyper-iam.yml
  - mail/athyper-mailhog.yml
  - memorycache/athyper-memorycache.yml
  - memorycache/athyper-memorycache-exporter.yml
  # Opt-in dedicated Redis for BullMQ (profile `memorycache-jobs`, not in
  # any preset). Enable in staging/production when isolating job
  # coordination from cache reads is required — see rb-09-redis-failover.md.
  - memorycache/athyper-memorycache-jobs.yml
  - objectstorage/athyper-objectstorage.yml
  - telemetry/athyper-logging.yml
  - telemetry/athyper-logshipper.yml
  - telemetry/athyper-alertmanager.yml
  - telemetry/athyper-metrics.yml
  - telemetry/athyper-tracing.yml
  - telemetry/athyper-telemetry.yml
  - security/athyper-clamav.yml
  # Track B3.1 — Infisical platform secret manager. Profile
  # `security-infisical` is distinct from `security` (ClamAV is core-path;
  # Infisical is opt-in until B3.2 config-loader integration lands).
  - security/athyper-infisical.yml
  - apps/athyper-apps.yml
  # Track A — Phase 5.1 replacement: Gotenberg supersedes the planned
  # athyper-renderer. See stack/compose/render/README.md for the
  # render_dlq error-category contract that binds the GotenbergAdapter.
  - render/athyper-gotenberg.yml
  - render/athyper-tika.yml
  # Monitoring profile — off by default on `up.sh core`; enable with
  # `up.sh core,monitoring` locally or via the staging/production override.
  - monitoring/athyper-uptime-kuma.yml
  - monitoring/athyper-healthchecks.yml
  - monitoring/athyper-glitchtip.yml
  # Admin profile — BullBoard + pgweb. Never activate in production
  # without DASHBOARD_AUTH_MW; pgweb is dev-only.
  - admin/athyper-bullboard.yml
  - admin/athyper-pgweb.yml
  # Search profile (Track B2.1) — Meilisearch. Indexing worker and search
  # API arrive in B2.2; compose service is inert until then.
  - search/athyper-meilisearch.yml
  # Analytics profile (Track B4) — Metabase, DEFERRED / hedge stage.
  # Profile is OFF by default and not in any preset profile set. Do NOT
  # enable in staging/production without read replica + governance
  # sign-off. See analytics/README.md for the gating contract.
  - analytics/athyper-metabase.yml
