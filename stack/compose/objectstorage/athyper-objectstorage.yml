# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-objectstorage-config
#
# Description :
#
# =======================================================================

services:
  # One-shot sidecar: provisions MinIO service accounts, IAM policies, and
  # application buckets. Runs after objectstorage is healthy. No-ops in local
  # dev (all services share root credentials). Idempotent: safe to run on
  # every stack restart — policies are deleted and recreated, users are
  # created only if they do not already exist.
  objectstorage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["core", "objectstorage"]
    environment:
      ENVIRONMENT:            ${ENVIRONMENT}
      MC_CONFIG_DIR:          /tmp/.mc
      S3_ENDPOINT:            ${S3_ENDPOINT}
      S3_ACCESS_KEY:          ${S3_ACCESS_KEY}
      S3_SECRET_KEY:          ${S3_SECRET_KEY}
      S3_BUCKET:              ${S3_BUCKET}
      APP_S3_ACCESS_KEY:      ${APP_S3_ACCESS_KEY}
      APP_S3_SECRET_KEY:      ${APP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET:       ${BACKUP_S3_BUCKET:-athyper-backups}
      BACKUP_S3_ACCESS_KEY:   ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY:   ${BACKUP_S3_SECRET_KEY}
      TEMPO_S3_BUCKET:        ${TEMPO_S3_BUCKET}
      TEMPO_S3_ACCESS_KEY:    ${TEMPO_S3_ACCESS_KEY}
      TEMPO_S3_SECRET_KEY:    ${TEMPO_S3_SECRET_KEY}
    depends_on:
      objectstorage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        # Local dev: root credentials are reused by all services — no scoped accounts needed.
        if [ "$${ENVIRONMENT}" = "local" ]; then
          echo "[objectstorage-init] ENVIRONMENT=local — skipping account provisioning"
          exit 0
        fi

        echo "[objectstorage-init] provisioning MinIO service accounts for $${ENVIRONMENT}..."

        # Connect as root. Retry up to 6×5 s to tolerate slow MinIO startup.
        for i in 1 2 3 4 5 6; do
          if mc alias set storage "$${S3_ENDPOINT}" "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" >/dev/null 2>&1; then
            break
          fi
          echo "[objectstorage-init] MinIO not reachable, retry $${i}/6 in 5s..."
          sleep 5
        done
        mc alias ls storage >/dev/null

        # ── Policies ──────────────────────────────────────────────────────────
        # Scoped to specific buckets only. Recreated on each run so bucket-name
        # changes (e.g. athyper-staging → athyper-prod) are picked up.

        cat > /tmp/athyper-app-policy.json << EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                "s3:GetObjectTagging", "s3:PutObjectTagging",
                "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket", "s3:GetBucketLocation",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}"]
            }
          ]
        }
        EOF

        cat > /tmp/athyper-backup-policy.json << EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${BACKUP_S3_BUCKET}/*"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${BACKUP_S3_BUCKET}"]
            }
          ]
        }
        EOF

        cat > /tmp/athyper-tempo-policy.json << EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject", "s3:PutObject", "s3:DeleteObject",
                "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::$${TEMPO_S3_BUCKET}/*"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket", "s3:GetBucketLocation",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": ["arn:aws:s3:::$${TEMPO_S3_BUCKET}"]
            }
          ]
        }
        EOF

        mc admin policy rm storage athyper-app-policy    2>/dev/null || true
        mc admin policy rm storage athyper-backup-policy 2>/dev/null || true
        mc admin policy rm storage athyper-tempo-policy  2>/dev/null || true
        mc admin policy create storage athyper-app-policy    /tmp/athyper-app-policy.json
        mc admin policy create storage athyper-backup-policy /tmp/athyper-backup-policy.json
        mc admin policy create storage athyper-tempo-policy  /tmp/athyper-tempo-policy.json
        echo "[objectstorage-init] policies created"

        # ── Users (idempotent — skip if access key already registered) ─────────
        mc admin user info storage "$${APP_S3_ACCESS_KEY}"    >/dev/null 2>&1 \
          || mc admin user add storage "$${APP_S3_ACCESS_KEY}"    "$${APP_S3_SECRET_KEY}"
        mc admin user info storage "$${BACKUP_S3_ACCESS_KEY}" >/dev/null 2>&1 \
          || mc admin user add storage "$${BACKUP_S3_ACCESS_KEY}" "$${BACKUP_S3_SECRET_KEY}"
        mc admin user info storage "$${TEMPO_S3_ACCESS_KEY}"  >/dev/null 2>&1 \
          || mc admin user add storage "$${TEMPO_S3_ACCESS_KEY}"  "$${TEMPO_S3_SECRET_KEY}"
        echo "[objectstorage-init] users ready"

        # ── Policy attachments (idempotent) ────────────────────────────────────
        mc admin policy attach storage athyper-app-policy    --user "$${APP_S3_ACCESS_KEY}"
        mc admin policy attach storage athyper-backup-policy --user "$${BACKUP_S3_ACCESS_KEY}"
        mc admin policy attach storage athyper-tempo-policy  --user "$${TEMPO_S3_ACCESS_KEY}"
        echo "[objectstorage-init] policies attached"

        # ── Buckets ────────────────────────────────────────────────────────────
        mc mb --ignore-existing "storage/$${S3_BUCKET}"
        mc mb --ignore-existing "storage/$${BACKUP_S3_BUCKET}"
        mc mb --ignore-existing "storage/$${TEMPO_S3_BUCKET}"
        echo "[objectstorage-init] buckets ready: $${S3_BUCKET}, $${BACKUP_S3_BUCKET}, $${TEMPO_S3_BUCKET}"

        echo "[objectstorage-init] provisioning complete"
    networks: [edge]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  objectstorage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core", "objectstorage"]
    deploy:
      resources:
        limits:
          memory: "${OBJECTSTORAGE_MEMORY_LIMIT}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER: "on"
      MINIO_BROWSER_REDIRECT: "true"
    volumes:
      - ${ATHYPER_DATA}/objectstorage:/data
    networks: [edge]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Shutdown: 10s — MinIO drains in-flight I/O quickly
    stop_grace_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.objectstorage-s3.rule=Host(`${OBJECTSTORAGE_HOST}`)
      - traefik.http.routers.objectstorage-s3.entrypoints=websecure
      - traefik.http.routers.objectstorage-s3.service=objectstorage-s3
      - traefik.http.routers.objectstorage-s3.tls=true
      - traefik.http.routers.objectstorage-s3.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.objectstorage-s3.middlewares=objectstorage-cors
      - traefik.http.services.objectstorage-s3.loadbalancer.server.port=9000
      # CORS middleware — allows browser presigned-URL uploads from the web app
      - traefik.http.middlewares.objectstorage-cors.headers.accessControlAllowOriginList=${CORS_ALLOWED_ORIGINS:-http://localhost:3001,https://neon.athyper.local}
      - traefik.http.middlewares.objectstorage-cors.headers.accessControlAllowMethods=GET,PUT,POST,DELETE,OPTIONS,HEAD
      - traefik.http.middlewares.objectstorage-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Amz-Date,X-Amz-Content-Sha256,X-Amz-Security-Token
      - traefik.http.middlewares.objectstorage-cors.headers.accessControlExposeHeaders=ETag,Content-Length
      - traefik.http.middlewares.objectstorage-cors.headers.accessControlMaxAge=3600
      - traefik.http.routers.objectstorage-console.rule=Host(`${OBJECTSTORAGE_CONSOLE_HOST}`)
      - traefik.http.routers.objectstorage-console.entrypoints=websecure
      - traefik.http.routers.objectstorage-console.service=objectstorage-console
      - traefik.http.routers.objectstorage-console.tls=true
      - traefik.http.routers.objectstorage-console.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.services.objectstorage-console.loadbalancer.server.port=9001
