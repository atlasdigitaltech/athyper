# =======================================================================
# Stack       : athyper Stack - Alertmanager
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-alertmanager-config
#
# Description :
#   Routes Prometheus alerts to platform / finance / compliance / security
#   contact groups. Config is rendered from env at container startup so
#   staging/production can inject SMTP and recipient secrets without writing
#   them into the repo-managed config tree.
#
# =======================================================================

services:
  alertmanager:
    image: prom/alertmanager:v0.32.0
    profiles: ["telemetry"]
    user: "9104:9104"
    deploy:
      resources:
        limits:
          memory: "${ALERTMANAGER_MEMORY_LIMIT}"
    environment:
      ALERTMANAGER_SMTP_SMARTHOST: ${ALERTMANAGER_SMTP_SMARTHOST}
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM}
      ALERTMANAGER_SMTP_REQUIRE_TLS: ${ALERTMANAGER_SMTP_REQUIRE_TLS}
      ALERTMANAGER_SMTP_AUTH_USERNAME: ${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      ALERTMANAGER_SMTP_AUTH_PASSWORD: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
      ALERTMANAGER_PLATFORM_EMAIL: ${ALERTMANAGER_PLATFORM_EMAIL}
      ALERTMANAGER_CRITICAL_EMAIL: ${ALERTMANAGER_CRITICAL_EMAIL}
      ALERTMANAGER_FINANCE_EMAIL: ${ALERTMANAGER_FINANCE_EMAIL}
      ALERTMANAGER_COMPLIANCE_EMAIL: ${ALERTMANAGER_COMPLIANCE_EMAIL}
      ALERTMANAGER_SECURITY_EMAIL: ${ALERTMANAGER_SECURITY_EMAIL}
    volumes:
      - ${ATHYPER_CONFIG}/telemetry/alertmanager/config.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
      - ${ATHYPER_DATA}/telemetry/alertmanager:/alertmanager
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${ALERTMANAGER_SMTP_SMARTHOST:?ALERTMANAGER_SMTP_SMARTHOST is required}"
        : "$${ALERTMANAGER_SMTP_FROM:?ALERTMANAGER_SMTP_FROM is required}"
        : "$${ALERTMANAGER_SMTP_REQUIRE_TLS:?ALERTMANAGER_SMTP_REQUIRE_TLS is required}"
        : "$${ALERTMANAGER_PLATFORM_EMAIL:?ALERTMANAGER_PLATFORM_EMAIL is required}"
        : "$${ALERTMANAGER_CRITICAL_EMAIL:?ALERTMANAGER_CRITICAL_EMAIL is required}"
        : "$${ALERTMANAGER_FINANCE_EMAIL:?ALERTMANAGER_FINANCE_EMAIL is required}"
        : "$${ALERTMANAGER_COMPLIANCE_EMAIL:?ALERTMANAGER_COMPLIANCE_EMAIL is required}"
        : "$${ALERTMANAGER_SECURITY_EMAIL:?ALERTMANAGER_SECURITY_EMAIL is required}"
        escape_sed() {
          printf '%s' "$$1" | sed 's/[\/&]/\\&/g'
        }
        sed \
          -e "s/__ALERTMANAGER_SMTP_SMARTHOST__/$$(escape_sed "$$ALERTMANAGER_SMTP_SMARTHOST")/g" \
          -e "s/__ALERTMANAGER_SMTP_FROM__/$$(escape_sed "$$ALERTMANAGER_SMTP_FROM")/g" \
          -e "s/__ALERTMANAGER_SMTP_REQUIRE_TLS__/$$(escape_sed "$$ALERTMANAGER_SMTP_REQUIRE_TLS")/g" \
          -e "s/__ALERTMANAGER_SMTP_AUTH_USERNAME__/$$(escape_sed "$${ALERTMANAGER_SMTP_AUTH_USERNAME:-}")/g" \
          -e "s/__ALERTMANAGER_SMTP_AUTH_PASSWORD__/$$(escape_sed "$${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}")/g" \
          -e "s/__ALERTMANAGER_PLATFORM_EMAIL__/$$(escape_sed "$$ALERTMANAGER_PLATFORM_EMAIL")/g" \
          -e "s/__ALERTMANAGER_CRITICAL_EMAIL__/$$(escape_sed "$$ALERTMANAGER_CRITICAL_EMAIL")/g" \
          -e "s/__ALERTMANAGER_FINANCE_EMAIL__/$$(escape_sed "$$ALERTMANAGER_FINANCE_EMAIL")/g" \
          -e "s/__ALERTMANAGER_COMPLIANCE_EMAIL__/$$(escape_sed "$$ALERTMANAGER_COMPLIANCE_EMAIL")/g" \
          -e "s/__ALERTMANAGER_SECURITY_EMAIL__/$$(escape_sed "$$ALERTMANAGER_SECURITY_EMAIL")/g" \
          /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.listen-address=:9093 \
          --cluster.listen-address=
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.docker.network=athyper-edge
      - traefik.enable=true
      - traefik.http.routers.alertmanager.entrypoints=websecure
      - traefik.http.routers.alertmanager.middlewares=${DASHBOARD_AUTH_MW}
      - traefik.http.routers.alertmanager.rule=Host(`${ALERTMANAGER_HOST}`)
      - traefik.http.routers.alertmanager.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.alertmanager.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.routers.alertmanager.tls=true
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
