services:
  logshipper:
    image: grafana/alloy:v1.15.1
    profiles: ["core", "telemetry"]
    deploy:
      resources:
        limits:
          memory: "${LOGSHIPPER_MEMORY_LIMIT}"
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--disable-reporting",
        "/etc/alloy/config.alloy",
      ]
    environment:
      ATHYPER_ENV: "${ENVIRONMENT}"
      # Docker socket proxy — Alloy uses this instead of a direct docker.sock
      # bind mount. socket-proxy-logshipper exposes only CONTAINERS read access
      # (the minimum required for container log discovery).
      DOCKER_HOST: "tcp://socket-proxy-logshipper:2375"
    depends_on:
      logging:
        condition: service_started
      socket-proxy-logshipper:
        condition: service_healthy
    volumes:
      # No direct docker.sock mount — Alloy reaches Docker via socket-proxy-logshipper.
      # See compose/security/athyper-socket-proxy-logshipper.yml.
      - ${ATHYPER_CONFIG}/telemetry/logging/alloy.alloy:/etc/alloy/config.alloy:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12345/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s    # Alloy agent needs Docker socket discovery
    # Shutdown: 20s — drain log buffer to Loki
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
