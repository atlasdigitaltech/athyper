# =======================================================================
# Stack       : athyper Stack – Security
# Service     : secretstore — platform secret management (Track B3.1)
#
# Description :
#   Self-hosted Infisical instance for managing platform secrets (DB URLs,
#   Redis URL, IAM client secret, Meilisearch master, S3 keys, the
#   CREDENTIAL_MASTER_KEY itself, etc.). Resolves the F2 credential-key
#   finding by giving platform secrets an audited home with rotation
#   discipline, superseding the `${VAR}`-placeholder-in-env-file pattern.
#
#   B3.1 SCOPE (this file): infra only. Container + persistence + Traefik
#   route + env knobs. No application code consumes secretstore yet — the
#   SDK integration in config.ts is Track B3.2, and tenant-scoped
#   secret migration (webhook signing secrets, endpoint auth configs,
#   notification provider creds) is B3.3. Until B3.2 lands, secretstore
#   stores secrets for human-reference only.
#
# Notes :
#   - Profile `security-infisical` is DISTINCT from `security` (virusscan).
#     virusscan is core-path for upload scanning; secretstore is opt-in until
#     B3.2. Activate with: `up.sh core,security-infisical`.
#   - Stateless by design. All persistent state lives in:
#       * Postgres DB athyper_secrets via dbpool-apps:6432 (transaction pool)
#       * Redis DB index 2 (on memorycache, ACL user `infisical`)
#     No container volume is required. Backups flow through the existing
#     pg_dump runbook (rb-07) — athyper_secrets listed alongside
#     athyper_errors and athyper_health.
#   - ENCRYPTION_KEY and AUTH_SECRET are Infisical's OWN bootstrap
#     secrets (used to derive the per-workspace data keys). They are NOT
#     the athyper CREDENTIAL_MASTER_KEY — that key is a RESIDENT of
#     secretstore once B3.2 ships, not a replacement for Infisical's keys.
#   - Admin UI is protected by Infisical's own auth (email/password +
#     SSO). No Traefik middleware is applied to the public route.
# =======================================================================

services:
  secretstore:
    # Pin explicitly — `latest` drifts across unrelated deploys and has
    # caused sidecar-breakage incidents in the past. Verify the tag is
    # current on https://hub.docker.com/r/infisical/infisical/tags and
    # bump via a deliberate PR before each environment rollout.
    image: infisical/infisical:v0.159.16
    profiles: ["security-infisical"]
    networks: [edge, internal]
    environment:
      # --- Bootstrap secrets (Infisical-internal, NOT athyper CREDENTIAL_MASTER_KEY) ---
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      # --- Persistence backends ---
      DB_CONNECTION_URI: postgresql://${DB_ADMIN_USER}:${DB_ADMIN_PASSWORD}@dbpool-apps:6432/athyper_secrets
      REDIS_URL: redis://infisical:${REDIS_INFISICAL_PASSWORD}@memorycache:6379/2
      # --- Public surface ---
      SITE_URL: https://${SECRETSTORE_HOST}
      HTTPS_ENABLED: "true"
      # --- SMTP for invites + password reset (reuses KC SMTP) ---
      SMTP_HOST: ${KC_SMTP_HOST:-mailtrap}
      SMTP_PORT: ${KC_SMTP_PORT:-1025}
      SMTP_USERNAME: ${KC_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${KC_SMTP_FROM:-noreply@athyper.local}
      SMTP_FROM_NAME: Athyper Infisical
      # --- Telemetry / hardening ---
      TELEMETRY_ENABLED: "false"
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: "${SECRETSTORE_MEMORY_LIMIT}"
    depends_on:
      dbpool-apps:
        condition: service_healthy
      memorycache:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.secretstore.rule=Host(`${SECRETSTORE_HOST}`)
      - traefik.http.routers.secretstore.entrypoints=websecure
      - traefik.http.routers.secretstore.tls=true
      - traefik.http.routers.secretstore.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.secretstore.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.services.secretstore.loadbalancer.server.port=8080
