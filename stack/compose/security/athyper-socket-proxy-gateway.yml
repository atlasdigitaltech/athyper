# =======================================================================
# Stack       : athyper Stack – Security
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-socket-proxy-gateway
#
# Description :
#   Docker socket proxy for the Traefik gateway service.
#   Exposes only the read-only container/network/service discovery API
#   that Traefik needs. Traefik never touches /var/run/docker.sock directly.
#
#   Allowed:  CONTAINERS, NETWORKS, SERVICES, TASKS (read-only GET only)
#   Denied:   all write/mutate operations, exec, images, volumes, secrets
# =======================================================================
services:
  socket-proxy-gateway:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ["core", "gateway", "apps"]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      # All write/mutate categories explicitly denied (default is 0; listed
      # here for documentation clarity so a future reader cannot miss them).
      POST: 0
      DELETE: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
