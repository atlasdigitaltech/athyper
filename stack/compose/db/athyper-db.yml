# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-db-config
#
# Description :
#   PostgreSQL database server. All eight canonical databases are created
#   by init-databases.sh: athyper_studio, athyper_neon, athyper_mesh, athyper_iam,
#   athyper_health, athyper_errors, athyper_secrets, athyper_analytics.
#
# =======================================================================

services:
  db:
    image: postgres:16.13-bookworm
    profiles: ["core", "db"]
    deploy:
      resources:
        limits:
          memory: "${DB_MEMORY_LIMIT}"
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: athyper_neon
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${ATHYPER_CONFIG}/db/${ENVIRONMENT:-local}/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ${ATHYPER_CONFIG}/db/${ENVIRONMENT:-local}/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${ATHYPER_CONFIG}/db/${ENVIRONMENT:-local}/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - athyper-db-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # user 999:999 = postgres inside postgres:16-bookworm. Must be set explicitly
    # because cap_drop: ALL removes CAP_SETUID, which breaks the image entrypoint's
    # "exec gosu postgres …" user-switch. With user: set here, the container starts
    # directly as the postgres user and the setuid call is never attempted.
    # This is NOT a v12 legacy value — Postgres uses a named Docker volume
    # (athyper-stack-db-data), not a host bind mount, so there is no host UID
    # collision risk. The v13 decision table excludes Postgres from the 91XX
    # service identities; this is the correct container-default enforcement.
    user: "999:999"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d athyper_neon"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s    # PG starts fast; WAL replay on unclean shutdown may add seconds
    # Shutdown: 60s — allow checkpoint flush, WAL sync, and client disconnect.
    # 30s could be insufficient when a large checkpoint is in progress; SIGKILL
    # before smart-shutdown completes forces WAL replay on the next cold start.
    stop_grace_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  athyper-db-data:
    name: athyper-stack-db-data
