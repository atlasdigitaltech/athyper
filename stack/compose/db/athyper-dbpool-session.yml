# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-dbpool-session-config
#
# Description :
#   PgBouncer session-mode connection pool for services that require
#   persistent server connections (prepared statements, advisory locks):
#     - athyper_iam     (Keycloak — KC_DB_POOL_MAX sessions)
#     - athyper_analytics (Metabase — JDBC prepared statements)
#   Listens on port 6433. Replaces the former dbpool-auth service.
#
# Frozen topology: dbpool_session / port 6433 / session mode
# Budget: athyper_iam=10, athyper_analytics=5 server conns
# =======================================================================

services:
  dbpool-session:
    image: edoburu/pgbouncer:v1.25.1-p0
    profiles: ["core", "db"]
    deploy:
      resources:
        limits:
          memory: "${DBPOOL_SESSION_MEMORY_LIMIT}"
    command:
      - sh
      - -c
      - |
        printf '"%s" "%s"\n' "$$DBPOOL_SESSION_USER" "$$DBPOOL_SESSION_PASSWORD" > /etc/pgbouncer/userlist.txt
        sed -e "s/__DB_HOST__/$$DB_HOST/g" \
            -e "s/__DB_PORT__/$$DB_PORT/g" \
            /etc/pgbouncer/pgbouncer.ini.tpl > /tmp/pgbouncer.ini
        exec pgbouncer /tmp/pgbouncer.ini
    environment:
      DBPOOL_SESSION_USER: ${DBPOOL_SESSION_USER}
      DBPOOL_SESSION_PASSWORD: ${DBPOOL_SESSION_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
    volumes:
      - ${ATHYPER_CONFIG}/${DBPOOL_SESSION_CONFIG}:/etc/pgbouncer/pgbouncer.ini.tpl:ro
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6433"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
