# =======================================================================
# Stack       : athyper Stack – Application Plane Services
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 2.0.0
# Compose     : athyper-apps-config
#
# Description :
#   Three-plane architecture — one compose file, three isolated Next.js
#   services, each with a distinct session boundary and KC realm:
#
#   neon-web  → neon.athyper.com   (tenant users, realm: neon)
#   mesh-web  → mesh.athyper.com   (partners,     realm: mesh)
#   admin-web → admin.athyper.com  (platform ops, realm: admin)
#
#   Runtime API (api) serves the backend at api.athyper.local.
#   BullMQ worker and scheduler run as separate MODE= containers.
#
#   Local dev (Option B): all three web services are in profile `apps` only.
#   Run pnpm dev on host via stack/scripts/app/planes-up.bat|sh.
#   Staging/production: `up.sh apps` starts all three containers;
#   Traefik routes each host to its plane via file-provider workbench configs.
#
#   Plane routing configured in:
#     stack/config/gateway/dynamic/athyper.workbench.yml  (local)
#     stack/config/gateway/environments/neon-workbench-routes.staging.yml
#     stack/config/gateway/environments/neon-workbench-routes.prod.yml
#
# =======================================================================

# ---------------------------------------------------------------------------
# Shared fragments — anchored here, merged into each service via <<: *
# ---------------------------------------------------------------------------
x-athyper-shared-env: &athyper-shared-env
  PORT: "${API_PORT}"
  ENVIRONMENT: "${ENVIRONMENT}"
  SERVICE_NAME: "${SERVICE_NAME}"
  SERVICE_VERSION: "${SERVICE_VERSION}"
  LOG_LEVEL: "${LOG_LEVEL}"
  SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS}"
  MULTITENANT: "${MULTITENANT}"
  PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
  # Config
  ATHYPER_CONFIG: /config
  ATHYPER_KERNEL_CONFIG_PATH: "${ATHYPER_KERNEL_CONFIG_PATH}"
  # Database
  DATABASE_URL: "${DATABASE_URL}"
  DATABASE_ADMIN_URL: "${DATABASE_ADMIN_URL}"
  DB_POOL_MAX: "${DB_POOL_MAX}"
  # Cache
  REDIS_URL: "${REDIS_URL}"
  REDIS_CONNECT_TIMEOUT_MS: "${REDIS_CONNECT_TIMEOUT_MS:-5000}"
  REDIS_MAX_RETRIES: "${REDIS_MAX_RETRIES:-2}"
  REDIS_ERROR_LOG_COOLDOWN_MS: "${REDIS_ERROR_LOG_COOLDOWN_MS:-10000}"
  # Optional dedicated BullMQ Redis (memorycache-jobs profile)
  REDIS_BULLMQ_URL: "${REDIS_BULLMQ_URL:-${REDIS_URL}}"
  # Object Storage
  S3_ENDPOINT: "${S3_ENDPOINT}"
  # Root MinIO credentials — kept for compose (MINIO_ROOT_USER wiring); not
  # consumed by app code. App code uses APP_S3_ACCESS_KEY / APP_S3_SECRET_KEY.
  S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY}"
  S3_REGION: "${S3_REGION}"
  S3_BUCKET: "${S3_BUCKET}"
  S3_USE_SSL: "${S3_USE_SSL}"
  # Scoped credentials — created by objectstorage-init; falls back to
  # S3_ACCESS_KEY / S3_SECRET_KEY in local dev (both equal root).
  APP_S3_ACCESS_KEY: "${APP_S3_ACCESS_KEY}"
  APP_S3_SECRET_KEY: "${APP_S3_SECRET_KEY}"
  BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-athyper-backups}"
  BACKUP_S3_ACCESS_KEY: "${BACKUP_S3_ACCESS_KEY}"
  BACKUP_S3_SECRET_KEY: "${BACKUP_S3_SECRET_KEY}"
  # Virus scanning (virusscan)
  CLAMD_HOST: "${CLAMD_HOST:-virusscan}"
  CLAMD_PORT: "${CLAMD_PORT:-3310}"
  CLAMD_ON_UNAVAILABLE: "${CLAMD_ON_UNAVAILABLE:-fail-closed}"
  # IAM
  IAM_ISSUER_URL: "${IAM_ISSUER_URL}"
  IAM_CLIENT_ID: "${IAM_CLIENT_ID}"
  IAM_CLIENT_SECRET: "${IAM_CLIENT_SECRET}"
  IAM_DEFAULT_REALM: "${IAM_DEFAULT_REALM}"
  ATHYPER_SUPER__IAM_SECRET__IAM_ATHYPER_CLIENT_SECRET: "${ATHYPER_SUPER__IAM_SECRET__IAM_ATHYPER_CLIENT_SECRET}"
  AUTH_DISCOVERY_SHARED_SECRET: "${AUTH_DISCOVERY_SHARED_SECRET:-}"
  AUTH_DISCOVERY_USERNAME_EMAIL_DOMAINS: "${AUTH_DISCOVERY_USERNAME_EMAIL_DOMAINS:-}"
  # Subject-wide logout cleanup is enabled by default; set to off for staged
  # rollout while monitoring auth-audit cleanup outcomes.
  AUTH_SUBJECT_CLEANUP_ENABLED: "${AUTH_SUBJECT_CLEANUP_ENABLED:-on}"
  # Signed document-edit workspace capability. API and Neon BFF must receive
  # the same values. TOKEN_KEYS is a JSON object; ACTIVE_KID selects the minting key.
  DOCUMENT_EDIT_WORKSPACE_TOKEN_SECRET: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_SECRET:-}"
  DOCUMENT_EDIT_WORKSPACE_TOKEN_KEYS: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_KEYS:-}"
  DOCUMENT_EDIT_WORKSPACE_TOKEN_ACTIVE_KID: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_ACTIVE_KID:-}"
  DOCUMENT_EDIT_SAVE_AND_TRANSITION_DISABLED: "${DOCUMENT_EDIT_SAVE_AND_TRANSITION_DISABLED:-}"
  # Attachment hardening rollout flags.
  ATTACHMENT_AUTH_STRICT: "${ATTACHMENT_AUTH_STRICT:-false}"
  ATTACHMENT_MULTIPART_CLEANUP_STRICT: "${ATTACHMENT_MULTIPART_CLEANUP_STRICT:-false}"
  ENTITY_QUERY_CURSOR_SECRET: "${ENTITY_QUERY_CURSOR_SECRET:-}"
  MUTATION_KERNEL_STAGE: "${MUTATION_KERNEL_STAGE:-shadow_validation}"
  MUTATION_KERNEL_INTERNAL_TENANTS: "${MUTATION_KERNEL_INTERNAL_TENANTS:-}"
  MUTATION_KERNEL_EXTERNAL_COHORT: "${MUTATION_KERNEL_EXTERNAL_COHORT:-}"
  # Atlas agent is fail-closed and independently tenant/permission gated.
  ATLAS_AGENT_ENABLED: "${ATLAS_AGENT_ENABLED:-false}"
  ATLAS_AGENT_ADMIN_ENABLED: "${ATLAS_AGENT_ADMIN_ENABLED:-false}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  ATLAS_AGENT_CREDENTIAL_FINGERPRINT_KEY: "${ATLAS_AGENT_CREDENTIAL_FINGERPRINT_KEY:-}"
  ATLAS_AGENT_DEFAULT_PUBLIC_MODEL: "${ATLAS_AGENT_DEFAULT_PUBLIC_MODEL:-atlas-fast}"
  ATLAS_AGENT_ANTHROPIC_FAST_MODEL: "${ATLAS_AGENT_ANTHROPIC_FAST_MODEL:-claude-haiku-4-5-20251001}"
  ATLAS_AGENT_ANTHROPIC_BALANCED_MODEL: "${ATLAS_AGENT_ANTHROPIC_BALANCED_MODEL:-claude-sonnet-4-6}"
  ATLAS_AGENT_ANTHROPIC_BEST_MODEL: "${ATLAS_AGENT_ANTHROPIC_BEST_MODEL:-claude-opus-4-8}"
  OPENAI_PROVIDER_ENABLED: "${OPENAI_PROVIDER_ENABLED:-false}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_PROJECT_ID: "${OPENAI_PROJECT_ID:-}"
  OPENAI_TIMEOUT_MS: "${OPENAI_TIMEOUT_MS:-60000}"
  ATLAS_AGENT_OPENAI_EVAL_MODEL: "${ATLAS_AGENT_OPENAI_EVAL_MODEL:-gpt-5.6-sol}"
  GEMINI_PROVIDER_ENABLED: "${GEMINI_PROVIDER_ENABLED:-false}"
  GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
  GEMINI_PROJECT_ID: "${GEMINI_PROJECT_ID:-}"
  GEMINI_EVAL_MODEL: "${GEMINI_EVAL_MODEL:-gemini-3.6-flash}"
  GEMINI_TIMEOUT_MS: "${GEMINI_TIMEOUT_MS:-60000}"
  GEMINI_ACCOUNT_CLASS: "${GEMINI_ACCOUNT_CLASS:-}"
  GEMINI_PROVIDER_REGION: "${GEMINI_PROVIDER_REGION:-}"
  ATLAS_AGENT_PROVIDER_TIMEOUT_MS: "${ATLAS_AGENT_PROVIDER_TIMEOUT_MS:-60000}"
  ATLAS_AGENT_STREAM_IDLE_TIMEOUT_MS: "${ATLAS_AGENT_STREAM_IDLE_TIMEOUT_MS:-30000}"
  ATLAS_AGENT_MAX_OUTPUT_TOKENS: "${ATLAS_AGENT_MAX_OUTPUT_TOKENS:-2048}"
  ATLAS_AGENT_MAX_OUTPUT_BYTES: "${ATLAS_AGENT_MAX_OUTPUT_BYTES:-131072}"
  ATLAS_AGENT_USER_RUNS_PER_MINUTE: "${ATLAS_AGENT_USER_RUNS_PER_MINUTE:-10}"
  ATLAS_AGENT_TENANT_RUNS_PER_MINUTE: "${ATLAS_AGENT_TENANT_RUNS_PER_MINUTE:-100}"
  ATLAS_AGENT_TOOLS_ENABLED: "${ATLAS_AGENT_TOOLS_ENABLED:-false}"
  ATLAS_AGENT_TOOL_MAX_ROUNDS: "${ATLAS_AGENT_TOOL_MAX_ROUNDS:-3}"
  ATLAS_AGENT_TOOL_MAX_CALLS: "${ATLAS_AGENT_TOOL_MAX_CALLS:-4}"
  ATLAS_AGENT_TOOL_MAX_ELAPSED_MS: "${ATLAS_AGENT_TOOL_MAX_ELAPSED_MS:-120000}"
  ATLAS_AGENT_TOOL_MAX_TOTAL_TOKENS: "${ATLAS_AGENT_TOOL_MAX_TOTAL_TOKENS:-32768}"
  ATLAS_AGENT_TOOL_TIMEOUT_MS: "${ATLAS_AGENT_TOOL_TIMEOUT_MS:-10000}"
  ATLAS_AGENT_TOOL_MAX_INPUT_BYTES: "${ATLAS_AGENT_TOOL_MAX_INPUT_BYTES:-32768}"
  ATLAS_AGENT_TOOL_MAX_RESULT_BYTES: "${ATLAS_AGENT_TOOL_MAX_RESULT_BYTES:-32768}"
  ATLAS_CONVERSATION_PERSISTENCE_ENABLED: "${ATLAS_CONVERSATION_PERSISTENCE_ENABLED:-false}"
  ATLAS_CONVERSATION_CONTENT_PROTECTION_MODE: "${ATLAS_CONVERSATION_CONTENT_PROTECTION_MODE:-database_at_rest_non_sensitive_only}"
  ATLAS_CONVERSATION_RETENTION_DAYS: "${ATLAS_CONVERSATION_RETENTION_DAYS:-30}"
  ATLAS_CONVERSATION_MIN_RETENTION_DAYS: "${ATLAS_CONVERSATION_MIN_RETENTION_DAYS:-1}"
  ATLAS_CONVERSATION_MAX_RETENTION_DAYS: "${ATLAS_CONVERSATION_MAX_RETENTION_DAYS:-365}"
  ATLAS_CONVERSATION_CONTEXT_MAX_MESSAGES: "${ATLAS_CONVERSATION_CONTEXT_MAX_MESSAGES:-20}"
  ATLAS_CONVERSATION_CONTEXT_MAX_CHARACTERS: "${ATLAS_CONVERSATION_CONTEXT_MAX_CHARACTERS:-98304}"
  ATLAS_CONVERSATION_STALE_RUN_TIMEOUT_MS: "${ATLAS_CONVERSATION_STALE_RUN_TIMEOUT_MS:-900000}"
  ATLAS_CONVERSATION_PURGE_BATCH_SIZE: "${ATLAS_CONVERSATION_PURGE_BATCH_SIZE:-500}"
  # IAM outbox worker polling interval
  OUTBOX_POLL_MS: "${OUTBOX_POLL_MS:-10000}"
  # Credential encryption (AES-256-GCM; warns + disables in local dev; REQUIRED in staging/production)
  CREDENTIAL_MASTER_KEY: "${CREDENTIAL_MASTER_KEY:-}"
  # Telemetry — legacy logshipper OTLP slot (kernel.config.schema.json); kept
  # until kernel telemetry config is retired. App code does not consume this.
  OTLP_ENDPOINT: "${OTLP_ENDPOINT}"
  # Distributed tracing → Tempo (OTLP/gRPC, port 4317). Unset → initOtel() no-ops.
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
  OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME}"
  OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER}"
  OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG}"
  # Error tracking (GlitchTip — monitoring profile; empty disables SDK)
  GLITCHTIP_DSN: "${GLITCHTIP_DSN:-}"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
  # Node.js
  NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
  NODE_ENV: "${NODE_ENV:-production}"
  # WebAuthn relying-party ID (must match the domain in the browser URL bar)
  WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-athyper.local}"
  # PDF rendering (docrender) + text extraction (docparser) — render profile; empty disables
  DOCRENDER_BASE_URL: "${DOCRENDER_BASE_URL:-}"
  DOCPARSER_URL: "${DOCPARSER_URL:-}"
  # Cron heartbeats (cronwatch — monitoring profile; empty disables)
  CRONWATCH_BASE_URL: "${CRONWATCH_BASE_URL:-}"
  # Search (searchcore — search profile; empty disables)
  SEARCHCORE_URL: "${SEARCHCORE_URL:-}"
  SEARCHCORE_MASTER_KEY: "${MEILI_MASTER_KEY:-}"
  # SMTP — app notification email channel
  # Dev default: mailtrap container (port 1025, no auth). The email channel
  # is only registered when SMTP_HOST is non-empty, so these defaults wire
  # local dev automatically without requiring .env changes.
  # Staging/production: override all vars via secrets/.env.
  SMTP_HOST: "${SMTP_HOST:-mailtrap}"
  SMTP_PORT: "${SMTP_PORT:-1025}"
  SMTP_SECURE: "${SMTP_SECURE:-false}"
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_PASS: "${SMTP_PASS:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@athyper.local}"
  SMTP_FROM_NEON:  "${SMTP_FROM_NEON:-noreply.neon-test@athyper.com}"
  SMTP_FROM_MESH:  "${SMTP_FROM_MESH:-noreply.mesh-test@athyper.com}"
  SMTP_FROM_ADMIN: "${SMTP_FROM_ADMIN:-noreply.admin-test@athyper.com}"
  SMTP_BOUNCE_WEBHOOK_SECRET: "${SMTP_BOUNCE_WEBHOOK_SECRET:-}"
  # Web Push (VAPID) — provider-independent browser push signing.
  VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
  VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
  VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"

# M7: host-gateway maps to host IP. Requires Docker 20.10+.
# On Docker Desktop (Win/Mac) this resolves to the VM gateway.
# On Linux Docker Engine it resolves to the bridge gateway (172.17.0.1).
# If services listen only on 127.0.0.1, set DOCKER_HOST_GATEWAY in .env
# and replace host-gateway with ${DOCKER_HOST_GATEWAY:-host-gateway}.
x-athyper-hosts: &athyper-hosts
  - "iam.athyper.local:host-gateway"
  - "gateway.athyper.local:host-gateway"
  - "neon.athyper.local:host-gateway"
  - "mesh.athyper.local:host-gateway"
  - "admin.athyper.local:host-gateway"
  - "api.athyper.local:host-gateway"
  - "objectstorage.athyper.local:host-gateway"
  - "objectstorage.console.athyper.local:host-gateway"

x-athyper-volumes: &athyper-volumes
  - "${ATHYPER_CONFIG}:/config:ro"

x-next-public-build-args: &next-public-build-args
  NEXT_PUBLIC_ATHYPER_DASHBOARD_PREFETCH_ENTITIES: "${NEXT_PUBLIC_ATHYPER_DASHBOARD_PREFETCH_ENTITIES:-}"
  NEXT_PUBLIC_AUTH_DISCOVERY_RESEND_COOLDOWN_SECONDS: "${NEXT_PUBLIC_AUTH_DISCOVERY_RESEND_COOLDOWN_SECONDS:-30}"
  NEXT_PUBLIC_ENVIRONMENT: "${ENVIRONMENT}"
  NEXT_PUBLIC_GITHUB_LOGIN_ENABLED: "${NEXT_PUBLIC_GITHUB_LOGIN_ENABLED:-false}"
  NEXT_PUBLIC_GLITCHTIP_DSN: "${NEXT_PUBLIC_GLITCHTIP_DSN:-}"
  NEXT_PUBLIC_PLATFORM_CONTROL_ENABLED: "${NEXT_PUBLIC_PLATFORM_CONTROL_ENABLED:-false}"
  NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
  NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"
  NEXT_PUBLIC_SERVICE_VERSION: "${SERVICE_VERSION:-}"

services:
  # -------------------------------------------------------------------------
  # Neon App — containerised Next.js (F8 Phase 3, Option B)
  # Host:   ${APPS_ATHYPER_WEB_HOST}  (neon.athyper.local | *-stg.athyper.com | *.athyper.com)
  # Paths:  /user, /admin, /ops — workbench routing via file provider
  #         (stack/config/gateway/dynamic/athyper.workbench.yml)
  # Build:  apps/Dockerfile (parameterized multi-stage; Next.js output: "standalone")
  # Rebuild: docker compose --project-directory stack/compose build neon-web
  #
  # Local dev (Option B): this service is in profile `apps` only — NOT `core`
  # or `gateway` — so `stack/scripts/stack/up.sh` local presets do not start it.
  # Local devs continue running `pnpm --filter @athyper/neon dev -- --port 3101`
  # on the host, and the workbench.yml file provider routes to host.docker.internal:3101.
  #
  # Staging / production: `up.sh apps` brings this container up and the
  # environments/neon-workbench-routes.{staging,prod}.yml file providers
  # route to neon-web:3000 over the internal edge network.
  # -------------------------------------------------------------------------
  neon-web:
    build:
      context: ../..
      dockerfile: apps/Dockerfile
      args:
        <<: *next-public-build-args
        APP_NAME: neon
        APP_PACKAGE: "@athyper/neon"
    profiles: ["apps"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
    networks: [edge, internal]
    depends_on:
      memorycache:
        condition: service_healthy
      # service_started (not service_healthy) — the web app does not need
      # a ready API at boot; it proxies requests lazily and returns 503
      # upstream-unavailable if the API is still warming up.
      api:
        condition: service_started
    environment:
      # ── Runtime basics ─────────────────────────────────────────────────
      ENVIRONMENT: "${ENVIRONMENT}"
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${WEB_PORT}"
      # ── F8 Phase 1 — single-ingress host guard ────────────────────────
      # Each service receives generic ALLOWED_HOSTS/GATEWAY_ORIGIN values.
      # The stack-level .env keeps plane-specific source vars so one shared
      # compose project can deploy all three app containers safely.
      # The host-guard middleware rejects requests whose Host header
      # doesn't match; /livez is excluded from the matcher for healthcheck.
      ALLOWED_HOSTS: "${NEON_ALLOWED_HOSTS}"
      GATEWAY_ORIGIN: "${NEON_GATEWAY_ORIGIN}"
      # ── Public base URL (used to build OAuth2 redirect_uri) ───────────
      PUBLIC_BASE_URL: "https://${APPS_ATHYPER_NEON_HOST}"
      PUBLIC_WEB_URL: "https://${APPS_ATHYPER_NEON_HOST}"
      NEON_PUBLIC_WEB_URL: "https://${APPS_ATHYPER_NEON_HOST}"
      # ── Keycloak / IAM ────────────────────────────────────────────────
      # KC is fronted by Traefik at IAM_HOST in all non-local envs; DNS
      # resolves to the gateway so the web BFF can hit it over HTTPS like
      # the browser does. KEYCLOAK_ADMIN_* are secrets — the env file MUST
      # source them from a secret manager; committing real values is a
      # policy violation (see docs/secrets-management.md).
      KEYCLOAK_BASE_URL:       "https://${IAM_HOST}"
      KEYCLOAK_REALM:          "${KEYCLOAK_REALM:-athyper}"
      KEYCLOAK_CLIENT_ID:      "${NEON_KEYCLOAK_CLIENT_ID:-neon-web}"
      KEYCLOAK_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # ── Platform control realm (optional) ──────────────────────────────
      PLATFORM_CONTROL_ENABLED:     "${PLATFORM_CONTROL_ENABLED:-false}"
      PLATFORM_KEYCLOAK_REALM:      "${PLATFORM_KEYCLOAK_REALM:-platform-control}"
      PLATFORM_KEYCLOAK_CLIENT_ID:  "${PLATFORM_KEYCLOAK_CLIENT_ID:-athyper-admin}"
      # ── Data-plane proxy target (internal network, no TLS) ─────────────
      RUNTIME_API_URL: "http://api:${API_PORT}"
      ATLAS_AGENT_ENABLED: "${ATLAS_AGENT_ENABLED:-false}"
      ATLAS_AGENT_ADMIN_ENABLED: "${ATLAS_AGENT_ADMIN_ENABLED:-false}"
      AUTH_CONTEXT_RESOLVER_REQUIRED: "${AUTH_CONTEXT_RESOLVER_REQUIRED:-true}"
      AUTH_DISCOVERY_SHARED_SECRET: "${AUTH_DISCOVERY_SHARED_SECRET:-}"
      AUTH_DISCOVERY_DELIVERY_URL: "${AUTH_DISCOVERY_DELIVERY_URL:-}"
      AUTH_DISCOVERY_DELIVERY_SECRET: "${AUTH_DISCOVERY_DELIVERY_SECRET:-}"
      AUTH_DISCOVERY_EXPOSE_DEV_LINK: "${AUTH_DISCOVERY_EXPOSE_DEV_LINK:-false}"
      IAM_PRESENTATION_CONTEXT_TTL_SECONDS: "${IAM_PRESENTATION_CONTEXT_TTL_SECONDS:-60}"
      DOCUMENT_EDIT_WORKSPACE_TOKEN_SECRET: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_SECRET:-}"
      DOCUMENT_EDIT_WORKSPACE_TOKEN_KEYS: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_KEYS:-}"
      DOCUMENT_EDIT_WORKSPACE_TOKEN_ACTIVE_KID: "${DOCUMENT_EDIT_WORKSPACE_TOKEN_ACTIVE_KID:-}"
      DOCUMENT_EDIT_SAVE_AND_TRANSITION_DISABLED: "${DOCUMENT_EDIT_SAVE_AND_TRANSITION_DISABLED:-}"
      # ── Redis (session storage) ────────────────────────────────────────
      REDIS_URL: "${REDIS_URL}"
      # ── Feature flags (NEXT_PUBLIC_* baked into browser bundle at build) ─
      NEXT_PUBLIC_GITHUB_LOGIN_ENABLED:     "${NEXT_PUBLIC_GITHUB_LOGIN_ENABLED:-false}"
      NEXT_PUBLIC_PLATFORM_CONTROL_ENABLED: "${NEXT_PUBLIC_PLATFORM_CONTROL_ENABLED:-false}"
      # Social login → tenant mapping (used when KC org claim is absent)
      GITHUB_TENANT_ID: "${GITHUB_TENANT_ID:-}"
      # ── Observability — GlitchTip/Sentry ───────────────────────────────
      NEXT_PUBLIC_SENTRY_DSN:                 "${NEXT_PUBLIC_SENTRY_DSN:-}"
      SENTRY_DSN:                             "${SENTRY_DSN:-}"
      NEXT_PUBLIC_ENVIRONMENT:                "${ENVIRONMENT}"
      NEXT_PUBLIC_SERVICE_VERSION:            "${SERVICE_VERSION:-}"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:  "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      SENTRY_TRACES_SAMPLE_RATE:              "${SENTRY_TRACES_SAMPLE_RATE:-0}"
      # ── Node TLS ───────────────────────────────────────────────────────
      # Default 1 (enforce). Self-signed staging certs need 0; set in the
      # staging .env. Never set 0 in production.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-1}"
    extra_hosts: *athyper-hosts
    # F4 — /livez probes only the event loop (middleware.ts matcher excludes
    # it so the host-guard doesn't run). DO NOT point this at any route that
    # exercises Redis / BFF / session — those live behind /api/admin/health.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- http://localhost:${WEB_PORT:-3000}/livez || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s   # Next.js cold start + JIT warm-up before /livez responds
    # Shutdown: 20s — drain in-flight SSR requests before force-kill
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Service labels: register container with Traefik's Docker provider so
    # staging/prod workbench route files can reference neon-web@docker
    # (auto-detected IP:port) instead of a static APPS_ATHYPER_WEB_UPSTREAM_URL.
    # No router labels — all routing is declared in the file-provider workbench
    # config (path stripping + forward-auth + IP restriction kept declarative).
    # No ports: — reachable only via Traefik over athyper-edge. F8 Phase 2.
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.services.neon-web.loadbalancer.server.port=3000
      - traefik.http.services.neon-web.loadbalancer.healthcheck.path=/livez
      - traefik.http.services.neon-web.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.neon-web.loadbalancer.healthcheck.timeout=5s

  mesh-web:
    build:
      context: ../..
      dockerfile: apps/Dockerfile
      args:
        <<: *next-public-build-args
        APP_NAME: mesh
        APP_PACKAGE: "@athyper/mesh"
    profiles: ["apps"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
    networks: [edge, internal]
    depends_on:
      memorycache:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ENVIRONMENT: "${ENVIRONMENT}"
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${WEB_PORT}"
      ALLOWED_HOSTS: "${MESH_ALLOWED_HOSTS}"
      GATEWAY_ORIGIN: "${MESH_GATEWAY_ORIGIN}"
