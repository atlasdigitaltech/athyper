  # -------------------------------------------------------------------------
  # Runtime API - Backend services
  # Host: api.athyper.local
  # Build: server/Dockerfile.dev (context = monorepo root)
  # Rebuild: docker compose --project-directory stack/compose build api
  #
  # Profiles: apps — NOT core, NOT gateway.
  # Local dev runs the server on the host via api-up.bat (PORT=4000).
  # Traefik's static file provider (stack/config/gateway/dynamic/athyper.api.yml,
  # priority=1) routes api.athyper.local → host.docker.internal:4000.
  # When this container IS running (apps profile), Docker-label router fires at
  # auto-priority ~30 and overrides the static file automatically.
  # Note: api was previously in the gateway profile too — that caused stale
  # containers to silently shadow host api-up.bat sessions. Removed 2026-06.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile.dev
    profiles: ["apps"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
    networks: [edge, internal]
    depends_on:
      dbpool-apps:
        condition: service_healthy
      memorycache:
        condition: service_healthy
      virusscan:
        condition: service_started
    environment:
      <<: *athyper-shared-env
      MODE: "${MODE}"
    extra_hosts: *athyper-hosts
    volumes: *athyper-volumes
    # F4: Use /livez (process-alive, no dep checks) to avoid restarts on transient
    # dependency flaps. Use /readyz for load-balancer health targets.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- http://localhost:${API_PORT:-3000}/livez || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s    # App init: schema validation, DI container, route registration
    # Shutdown: 20s — drain in-flight HTTP requests (see SHUTDOWN_TIMEOUT_MS)
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.rule=Host(`${APPS_ATHYPER_API_HOST}`)
      - traefik.http.routers.api.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.api.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000

  # -------------------------------------------------------------------------
  # BullMQ Worker — IAM outbox + job processors (no HTTP, internal only)
  # Runs: MODE=worker node dist/src/app.js
  # -------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile.dev
    profiles: ["apps"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
    networks: [internal]
    depends_on:
      dbpool-apps:
        condition: service_healthy
      memorycache:
        condition: service_healthy
    environment:
      <<: *athyper-shared-env
      MODE: worker
      # Cross-tenant retention authority is intentionally absent from API.
      ATLAS_CONVERSATION_MAINTENANCE_DATABASE_URL: "${ATLAS_CONVERSATION_MAINTENANCE_DATABASE_URL:-}"
    extra_hosts: *athyper-hosts
    volumes: *athyper-volumes
    # F4: /livez — process-alive probe, no dependency checks
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- http://localhost:${API_PORT:-3000}/livez || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s    # App init minus HTTP server setup
    # Shutdown: 30s — allow in-flight BullMQ jobs to complete before force-kill
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # -------------------------------------------------------------------------
  # BullMQ Scheduler — repeatable job registration only (no HTTP, internal only)
  # Runs: MODE=scheduler node dist/src/app.js
  # -------------------------------------------------------------------------
  scheduler:
    build:
      context: ../..
      dockerfile: server/Dockerfile.dev
    profiles: ["apps"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
    networks: [internal]
    depends_on:
      dbpool-apps:
        condition: service_healthy
      memorycache:
        condition: service_healthy
    environment:
      <<: *athyper-shared-env
      MODE: scheduler
      # Used only to validate and schedule governed retention maintenance.
      ATLAS_CONVERSATION_MAINTENANCE_DATABASE_URL: "${ATLAS_CONVERSATION_MAINTENANCE_DATABASE_URL:-}"
    extra_hosts: *athyper-hosts
    volumes: *athyper-volumes
    # F4: /livez — process-alive probe, no dependency checks
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- http://localhost:${API_PORT:-3000}/livez || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s    # Lightweight: only registers repeatable jobs, no HTTP
    # Shutdown: 20s — clean deregistration of repeatable job schedules
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
