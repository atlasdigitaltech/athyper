# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local | staging | production
# Version     : 1.0.0
# Compose     : athyper-memorycache-jobs-config
#
# Description :
#   Optional dedicated Redis for BullMQ queues/workers/schedulers.
#
#   The primary `memorycache` service (athyper-memorycache.yml) backs
#   the shared cache plane: JWKS, feature flags, IAM session/bootstrap
#   cache, OAuth2 token cache, descriptor cache, /readyz ping.
#
#   When this service is enabled, set `REDIS_BULLMQ_URL` in the env file
#   to `redis://app:${MEMORYCACHE_PASSWORD}@memorycache-jobs:6379/0` so the
#   server bootstrap points BullMQ at this instance instead of sharing
#   the cache client. Isolating job coordination from cache reads means a
#   READONLY error or reconnect storm on one cluster cannot cascade to
#   the other — a prerequisite for Redis Sentinel / HA promotion because
#   failover affects all consumers of the promoted replica simultaneously.
#
#   Profile `memorycache-jobs` is OPT-IN. It is not part of the `core`
#   profile and is not enabled by any preset. Activate it explicitly in
#   staging/production via:
#
#     COMPOSE_PROFILES=core,memorycache-jobs docker compose up -d
#
#   ACL config and credentials are reused from the primary memorycache
#   service. Phase B (see docs/runbooks/rb-09-redis-failover.md) will
#   split credentials when Sentinel topology lands.
# =======================================================================

services:
  memorycache_jobs:
    image: redis:7.4.8-alpine
    profiles: ["memorycache-jobs"]
    deploy:
      resources:
        limits:
          memory: "${MEMORYCACHE_MEMORY_LIMIT}"
    command:
      - sh
      - -c
      - |
        set -eu
        : "$${MEMORYCACHE_PASSWORD:?MEMORYCACHE_PASSWORD is empty — refusing to start}"
        : "$${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD is empty — refusing to start}"
        : "$${REDIS_GLITCHTIP_PASSWORD:?REDIS_GLITCHTIP_PASSWORD is empty — refusing to start}"
        : "$${REDIS_INFISICAL_PASSWORD:?REDIS_INFISICAL_PASSWORD is empty — refusing to start}"
        : "$${REDIS_ADMIN_PASSWORD:?REDIS_ADMIN_PASSWORD is empty — refusing to start}"
        APP_HASH=$$(printf '%s' "$$MEMORYCACHE_PASSWORD" | sha256sum | awk '{print $$1}')
        EXP_HASH=$$(printf '%s' "$$REDIS_EXPORTER_PASSWORD" | sha256sum | awk '{print $$1}')
        GT_HASH=$$(printf '%s' "$$REDIS_GLITCHTIP_PASSWORD" | sha256sum | awk '{print $$1}')
        INF_HASH=$$(printf '%s' "$$REDIS_INFISICAL_PASSWORD" | sha256sum | awk '{print $$1}')
        ADM_HASH=$$(printf '%s' "$$REDIS_ADMIN_PASSWORD" | sha256sum | awk '{print $$1}')
        sed -e "s/__APP_HASH__/$$APP_HASH/g" \
            -e "s/__EXPORTER_HASH__/$$EXP_HASH/g" \
            -e "s/__GLITCHTIP_HASH__/$$GT_HASH/g" \
            -e "s/__INFISICAL_HASH__/$$INF_HASH/g" \
            -e "s/__ADMIN_HASH__/$$ADM_HASH/g" \
            /usr/local/etc/redis/redis-acl.conf > /tmp/redis-acl.conf
        if grep -qE '__(APP|EXPORTER|GLITCHTIP|INFISICAL|ADMIN)_HASH__' /tmp/redis-acl.conf; then
          echo "FATAL: ACL hash markers not fully substituted in /tmp/redis-acl.conf" >&2
          exit 1
        fi
        exec redis-server /usr/local/etc/redis/redis.conf \
          --requirepass "$$MEMORYCACHE_PASSWORD" \
          --aclfile /tmp/redis-acl.conf
    environment:
      MEMORYCACHE_PASSWORD: ${MEMORYCACHE_PASSWORD}
      REDIS_EXPORTER_PASSWORD: ${REDIS_EXPORTER_PASSWORD}
      REDIS_GLITCHTIP_PASSWORD: ${REDIS_GLITCHTIP_PASSWORD}
      REDIS_INFISICAL_PASSWORD: ${REDIS_INFISICAL_PASSWORD}
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD}
    volumes:
      - ${ATHYPER_CONFIG}/memorycache/cache.conf:/usr/local/etc/redis/redis.conf:ro
      - ${ATHYPER_CONFIG}/memorycache/redis-acl.conf:/usr/local/etc/redis/redis-acl.conf:ro
      - ${ATHYPER_DATA}/memorycache-jobs:/data
    networks: [internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test "$$(redis-cli --user app -a "$$MEMORYCACHE_PASSWORD" --no-auth-warning ACL WHOAMI 2>/dev/null)" = "app"',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
