# =======================================================================
# Stack       : athyper Stack – Monitoring
# Service     : statuswatch — service availability dashboard + alerting
#
# Description :
#   Monitors HTTP endpoints, Docker containers, TCP/DNS reachability.
#   Designed to probe the event.endpoint.health_check_url set every INT
#   provider already maintains, plus in-stack services (docrender, docparser,
#   searchcore, iam, memorycache, datastore).
#
# Notes :
#   - Stores state in an embedded SQLite DB mounted at /app/data.
#   - Accessible via Traefik at ${STATUSWATCH_HOST}.
#   - Protected by DASHBOARD_AUTH_MW in staging/production (statuswatch has its
#     own login but the gateway gate adds defence-in-depth).
# =======================================================================

services:
  statuswatch:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    user: "9105:9105"
    networks: [edge, internal]
    volumes:
      - ${ATHYPER_DATA}/statuswatch:/app/data
    deploy:
      resources:
        limits:
          memory: "${STATUSWATCH_MEMORY_LIMIT}"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node /app/extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.statuswatch.rule=Host(`${STATUSWATCH_HOST}`)
      - traefik.http.routers.statuswatch.entrypoints=websecure
      - traefik.http.routers.statuswatch.tls=true
      - traefik.http.routers.statuswatch.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.statuswatch.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.services.statuswatch.loadbalancer.server.port=3001
      - traefik.http.routers.statuswatch.middlewares=${DASHBOARD_AUTH_MW}
