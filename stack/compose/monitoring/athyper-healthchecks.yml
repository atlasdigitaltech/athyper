# =======================================================================
# Stack       : athyper Stack – Monitoring
# Service     : Healthchecks — dead-man's-switch for scheduled jobs
#
# Description :
#   Paired with the BullMQ job lifecycle. Each job pings a check URL on
#   completion; Healthchecks alerts when the expected ping interval is
#   missed ("job never fired" / "job didn't report success").
#
#   Wiring lives in createJobsService() (server/src/kernel/bootstrap.ts):
#   onCompleted → pingSuccess(queue, jobName); onFailed → pingFail(...).
#   The slug is `{queue}-{jobName}` lowercased and dash-collapsed — see
#   server/src/foundation/monitoring/healthchecks.ts. Operators create a
#   Healthchecks check per slug they want to alert on; unmatched pings are
#   dropped server-side. control.cron_schedule.code is NOT used as the
#   slug today.
#
# Notes :
#   - Routes through dbpool-apps:6432 (transaction pool) to database
#     athyper_health. Created by init-databases.sh.
#   - Couples monitoring uptime to the apps pool — acceptable at current
#     scale; revisit if Healthchecks becomes the only signal for an outage.
# =======================================================================

services:
  healthchecks:
    # Pin explicitly — `:latest` drifts across unrelated deploys. Verify the
    # tag on https://hub.docker.com/r/healthchecks/healthchecks/tags and
    # bump deliberately.
    image: healthchecks/healthchecks:v4.1.1
    profiles: ["monitoring"]
    networks: [edge, internal]
    environment:
      DB: postgres
      DB_HOST: dbpool-apps
      DB_PORT: "6432"
      DB_NAME: athyper_health
      DB_USER: ${DB_ADMIN_USER}
      DB_PASSWORD: ${DB_ADMIN_PASSWORD}
      SECRET_KEY: ${HEALTHCHECKS_SECRET_KEY}
      ALLOWED_HOSTS: ${HEALTHCHECKS_HOST}
      SITE_ROOT: https://${HEALTHCHECKS_HOST}
      SITE_NAME: "Athyper Healthchecks"
      DEFAULT_FROM_EMAIL: ${KC_SMTP_FROM:-noreply@athyper.local}
      EMAIL_HOST: ${KC_SMTP_HOST:-mailhog}
      EMAIL_PORT: ${KC_SMTP_PORT:-1025}
      EMAIL_USE_TLS: ${HEALTHCHECKS_EMAIL_USE_TLS:-False}
      DEBUG: "False"
    deploy:
      resources:
        limits:
          memory: "${HEALTHCHECKS_MEMORY_LIMIT}"
    depends_on:
      dbpool-apps:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.healthchecks.rule=Host(`${HEALTHCHECKS_HOST}`)
      - traefik.http.routers.healthchecks.entrypoints=websecure
      - traefik.http.routers.healthchecks.tls=true
      - traefik.http.routers.healthchecks.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.healthchecks.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.services.healthchecks.loadbalancer.server.port=8000
