# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local
# Version     : 1.1.0
# Compose     : athyper-override-local-config
#
# Description :
#   Local development environment overrides for athyper Stack.
#   Add local-specific service configurations here (e.g., debug settings,
#   development volumes, hot-reload mounts).
#
# =======================================================================

services:
  # ── Local Windows Docker: user + capability overrides ─────────────────────────
  # Named service users (9100-9105) exist only on the Linux server where
  # data-dirs-create.sh runs chown before first start. On Windows, Docker bind
  # mounts present as drwxr-xr-x (755) inside the container and non-zero UIDs
  # hit "Permission denied (os error 13)". Two overrides are needed:
  #   user: "0:0"         — run as root so UID matches are not needed
  #   cap_add: [DAC_OVERRIDE] — restore the capability dropped by cap_drop: ALL
  #                             so root can actually write to 755 bind mounts

  memorycache:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      internal: null
      edge: null

  memorycache-jobs:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  # Host-run attachment workers translate http://docparser:9998 to
  # http://127.0.0.1:9998 in stack/scripts/app/api-up.bat.
  docparser:
    ports:
      - "127.0.0.1:9998:9998"
    networks:
      internal: null
      edge: null

  objectstorage:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  logging:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  metrics:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  # Grafana: root override + capability fix + local dashboard provisioning.
  # Re-provisions from JSON on restart — nothing persists that isn't committed
  # under config/telemetry/provisioning/dashboards/json/.
  telemetry:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ${ATHYPER_CONFIG}/telemetry/provisioning.env/dashboards.local.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro

  tracing:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  searchcore:
    image: getmeili/meilisearch:v1.13
    profiles: ["search"]
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  # analyticsboard does not use cap_drop: ALL — user override only.
  # (statuswatch previously needed a user override on Windows; now uses a
  # named volume in athyper-statuswatch.yml, so no local override required.)
  analyticsboard:
    image: metabase/metabase:v0.51.10
    profiles: ["analytics"]
    user: "0:0"

  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      internal: null
      edge: null

  dbpool-apps:
    ports:
      - "127.0.0.1:6432:6432"
    networks:
      internal: null
      edge: null

  dbpool-session:
    ports:
      - "127.0.0.1:6433:6433"
    networks:
      internal: null
      edge: null
