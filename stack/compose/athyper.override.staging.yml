# =======================================================================
# Stack       : athyper Stack – Core Infrastructure & Observability
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : staging
# Version     : 1.0.0
# Compose     : athyper-override-staging-config
#
# Description :
#   Staging environment overrides for athyper Stack.
#   - Keycloak runs in optimized mode (start, not start-dev)
#   - No MailHog dependency (real SMTP via env vars)
#   - API and worker scaled to 2 replicas for parity with production
#   - Named Docker volumes for stateful services (I-08 parity)
#
# =======================================================================

# Named volumes for stateful services (mirrors production pattern).
volumes:
  athyper_db_data:
    driver: local

services:
  # Grafana: relax dashboard provisioning for on-call exploration during
  # incident rehearsal. Edits and deletions allowed in the UI; the file
  # provisioner still re-installs the JSON set on restart so changes are
  # ephemeral.
  #
  # GF_AUTH_BASIC_ENABLED=false: Grafana sits behind the Traefik basic-auth
  # popup (DASHBOARD_AUTH_MW). Browsers cache that header and re-send it on
  # every request, which Grafana would otherwise validate against its own
  # user DB — failing because the IAM admin password ≠ Grafana admin
  # password. Disabling Grafana basic auth lets the cached header pass
  # through harmlessly so the form login and session cookie work.
  telemetry:
    environment:
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ${ATHYPER_CONFIG}/telemetry/provisioning.env/dashboards.staging.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro

  # Meilisearch: enable the bundled mini-dashboard in staging. MEILI_ENV
  # only toggles the dashboard UI in v1.x — master-key auth is enforced
  # regardless. Production keeps MEILI_ENV=production (UI disabled).
  #
  # The Traefik basic-auth middleware (DASHBOARD_AUTH_MW) is removed for
  # staging because the mini-dashboard sends Authorization: Bearer <key>
  # on every API call, which overrides the cached Basic auth header and
  # causes Traefik to re-prompt on every request. Meilisearch's own
  # master-key auth provides access control — the API rejects requests
  # without a valid key, so the dashboard is functional but the indexes
  # remain protected.
  searchcore:
    environment:
      MEILI_ENV: development
    labels:
      - traefik.http.routers.searchcore.middlewares=

  # Keycloak: optimized mode — disables dev defaults, enables theme caching
  iam:
    command: ["start", "--import-realm"]
    environment:
      KC_SMTP_USERNAME: ${KC_SMTP_USERNAME}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD}

  # mailtrap: disable Traefik routing in staging — dev-only service, no public hostname.
  # SMTP is still reachable internally by Keycloak on port 1025. Web UI is internal only.
  mailtrap:
    labels:
      - traefik.enable=false

  # Neon Web: fix build context (base file resolves ../.. from apps/ subfolder).
  # Suppress Docker provider auto-router (container name becomes invalid hostname).
  # Real routing comes from the file provider (gateway/dynamic/athyper.workbench.yml).
  neon-web:
    build:
      context: ../..
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.services.neon-web.loadbalancer.server.port=3000
      - traefik.http.services.neon-web.loadbalancer.healthcheck.path=/livez
      - traefik.http.services.neon-web.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.neon-web.loadbalancer.healthcheck.timeout=5s

  mesh-web:
    build:
      context: ../..
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.services.mesh-web.loadbalancer.server.port=3000
      - traefik.http.services.mesh-web.loadbalancer.healthcheck.path=/livez
      - traefik.http.services.mesh-web.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.mesh-web.loadbalancer.healthcheck.timeout=5s

  studio-web:
    build:
      context: ../..
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.services.studio-web.loadbalancer.server.port=3000
      - traefik.http.services.studio-web.loadbalancer.healthcheck.path=/livez
      - traefik.http.services.studio-web.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.studio-web.loadbalancer.healthcheck.timeout=5s


  # API: 2 replicas to validate multi-instance behavior before production.
  # Dockerfile.prod compiles TS → JS and strips devDeps; Dockerfile.dev is
  # local-only (tsx watch).
  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
        reservations:
          cpus: "0.15"
          memory: 256M

  # Worker: 2 replicas to validate concurrent job processing
  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: "${APPS_ATHYPER_MEMORY_LIMIT}"
        reservations:
          cpus: "0.15"
          memory: 256M

  # Scheduler: uses the same compiled image as api/worker
  scheduler:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod

  # Database: resource guarantees + named volume (I-08 parity with production).
  db:
    volumes:
      - athyper_db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: "${DB_MEMORY_LIMIT}"
        reservations:
          memory: 512M

  # Redis: resource guarantees
  memorycache:
    deploy:
      resources:
        limits:
          memory: "${MEMORYCACHE_MEMORY_LIMIT}"
        reservations:
          memory: 128M

  # Gateway: ACME cert resolver for staging Let's Encrypt certificates.
  # command: is a full replacement (Docker Compose scalar merge) — replicates
  # all base flags from athyper-gateway.yml and appends the three ACME lines.
  # volumes: merges by target path; /certs without :ro lets ACME write acme.json.
  gateway:
    command:
      - --accesslog=${GATEWAY_ACCESSLOG:-true}
      - --accesslog.format=json
      - --accesslog.fields.defaultMode=keep
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.headers.defaultMode=drop
      - --accesslog.fields.headers.names.Authorization=drop
      - --accesslog.fields.headers.names.Cookie=drop
      - --accesslog.fields.headers.names.Set-Cookie=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.X-Forwarded-For=keep
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedHeaders.insecure=false
      - --entrypoints.websecure.http.encodeQuerySemicolons=true
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt-staging
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.format=json
      - --log.level=${GATEWAY_LOG_LEVEL:-INFO}
      - --ping=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=athyper-edge
      - --providers.docker=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --serversTransport.forwardingTimeouts.dialTimeout=30s
      - --serversTransport.insecureSkipVerify=false
      - --certificatesResolvers.letsencrypt-staging.acme.email=${ACME_EMAIL}
      - --certificatesResolvers.letsencrypt-staging.acme.storage=/certs/acme.json
      - --certificatesResolvers.letsencrypt-staging.acme.httpChallenge.entryPoint=web
    volumes:
      - ${ATHYPER_CONFIG}/gateway/dynamic:/etc/traefik/dynamic:ro
      - ${ATHYPER_SECRETS_ROOT}/gateway/certs:/certs
