# =======================================================================
# Stack       : athyper Stack – Search
# Service     : Meilisearch — cross-entity full-text search
#
# Description :
#   Meilisearch backs the Sprint 41 SearchInput and future cross-entity
#   queries. Indexing is driven by a jobs-search-index BullMQ worker
#   that subscribes to event.outbox (Track B2.2, not yet wired).
#
#   Tenant isolation uses Meilisearch tenant tokens (JWTs) minted per
#   request BY THE API RUNTIME (backend) from tenantContext, with an
#   embedded `_tenant_id` filter rule. Tokens are NEVER issued
#   client-side — doing so would require shipping the parent API key to
#   the browser and defeat the isolation guarantee. The backend issues a
#   scoped token per session and returns it to the frontend, which uses
#   it to query Meilisearch directly.
#
# Notes :
#   - Persistent volume at $ATHYPER_DATA/meilisearch (indexes + settings).
#   - Admin UI served from the same port 7700.
#   - MEILI_ENV=production disables the dev-only UI chrome but keeps the
#     UI reachable for authenticated admins.
#   - Master key is admin-only; application code uses scoped API keys or
#     tenant tokens, never the master.
# =======================================================================

services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    profiles: ["search"]
    networks: [edge, internal]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-512MiB}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_LOG_LEVEL: ${MEILI_LOG_LEVEL:-INFO}
    volumes:
      - ${ATHYPER_DATA}/meilisearch:/meili_data
    deploy:
      resources:
        limits:
          memory: "${MEILI_MEMORY_LIMIT}"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Shutdown: 20s — Meili flushes the LMDB journal on SIGTERM
    stop_grace_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.meilisearch.rule=Host(`${MEILI_HOST}`)
      - traefik.http.routers.meilisearch.entrypoints=websecure
      - traefik.http.routers.meilisearch.tls=true
      - traefik.http.routers.meilisearch.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.services.meilisearch.loadbalancer.server.port=7700
      - traefik.http.routers.meilisearch.middlewares=${DASHBOARD_AUTH_MW}
