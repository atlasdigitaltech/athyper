# =======================================================================
# Stack       : athyper Stack – Admin (DEV ONLY)
# Service     : dbconsole — browser-based Postgres client
#
# Description :
#   Direct SQL access to athyper_dev1 through a local browser UI.
#   Convenience tool for developers — **never** exposed in staging or
#   production.
#
# Notes :
#   - Reads DATABASE_ADMIN_URL (direct DB connection, bypasses pgbouncer).
#   - Guarded by profile `admin`. Production/staging deployments must NOT
#     activate the admin profile. validate-env.sh enforces this.
# =======================================================================

services:
  dbconsole:
    # Pin explicitly — `:latest` drifts. dbconsole is dev-only (blocked by
    # validate-env.sh in staging/production), but pinning reduces dev
    # surprise when an upgrade breaks the Postgres driver.
    image: sosedoff/pgweb:0.16.2
    profiles: ["admin"]
    networks: [edge, internal]
    environment:
      PGWEB_DATABASE_URL: ${DATABASE_ADMIN_URL}
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-athyperadmin}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:-athyperadmin}
    deploy:
      resources:
        limits:
          memory: "${DBCONSOLE_MEMORY_LIMIT}"
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --show-error --user "$$PGWEB_AUTH_USER:$$PGWEB_AUTH_PASS" --output /dev/null http://127.0.0.1:8081/ || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=athyper-edge
      - traefik.http.routers.dbconsole.rule=Host(`${DBCONSOLE_HOST}`)
      - traefik.http.routers.dbconsole.entrypoints=websecure
      - traefik.http.routers.dbconsole.tls=true
      - traefik.http.routers.dbconsole.tls.options=${GATEWAY_TLS_OPTIONS}
      - traefik.http.routers.dbconsole.tls.certresolver=${GATEWAY_CERT_RESOLVER}
      - traefik.http.services.dbconsole.loadbalancer.server.port=8081
      - traefik.http.routers.dbconsole.middlewares=${DASHBOARD_AUTH_MW}
