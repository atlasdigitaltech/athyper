# =======================================================================
# Stack       : athyper Stack – Emergency break-glass
# Service     : queueconsole — BullMQ queue inspection UI (sidecar)
#
# Status      : BREAK-GLASS FALLBACK — not part of normal operations.
#
# Primary path (day-to-day) :
#   queueconsole is embedded inside the API runtime at
#     /api/jobs/admin/board
#   gated by RBAC permissions JOBS.BOARD.VIEW and JOBS.QUEUE.MANAGE.
#   That is the route all operators should use during normal operations.
#
# This container :
#   Exists only so queue state can be inspected when the API runtime
#   itself is crash-looping or unreachable (bad deploy, OOM, broken
#   migration) but Redis / BullMQ are still healthy. In that scenario
#   the embedded UI is unreachable and we need an out-of-band view.
#
# Security posture :
#   - Profile ``emergency`` — disabled by default. Must be explicitly
#     activated via COMPOSE_PROFILES=emergency.
#   - No Traefik labels — NOT reachable through the public gateway.
#   - Attached only to the ``internal`` network — NOT ``edge``.
#   - Reachable only from inside the Docker network, i.e. via
#     ``docker compose exec`` / a short-lived SSH tunnel / VPN-pinned
#     operator host. No public hostname is allocated.
#   - Read-only in practice: the UI image exposes mutating actions
#     (pause / resume / retry / clean), but those actions bypass
#     Athyper's RBAC audit trail. Use them only when the runbook
#     (rb-08-bullboard-emergency-activation.md) explicitly authorises.
#
# Activation & tear-down :
#   See docs/runbooks/rb-08-bullboard-emergency-activation.md — every
#   activation MUST be recorded as an incident entry and the container
#   MUST be torn down once the incident resolves.
# =======================================================================

services:
  queueconsole:
    image: deadly0/bull-board:3.2.6@sha256:58817a076c16055e090f095103b9f3fe3a8b8500cf75cd5abe610f409bcc8fa6
    profiles: ["emergency"]
    networks: [internal]
    environment:
      REDIS_HOST: "${BULLBOARD_REDIS_HOST:-memorycache}"
      REDIS_PORT: "${BULLBOARD_REDIS_PORT:-6379}"
      REDIS_DB: "${BULLBOARD_REDIS_DB:-0}"
      REDIS_USE_TLS: "${BULLBOARD_REDIS_USE_TLS:-false}"
      REDIS_USERNAME: "${BULLBOARD_REDIS_USERNAME:-app}"
      REDIS_PASSWORD: "${BULLBOARD_REDIS_PASSWORD:-${MEMORYCACHE_PASSWORD}}"
    deploy:
      resources:
        limits:
          memory: "${QUEUECONSOLE_MEMORY_LIMIT:-128m}"
    depends_on:
      memorycache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
