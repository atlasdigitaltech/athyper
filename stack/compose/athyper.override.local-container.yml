# =======================================================================
# Stack       : athyper Stack – Local Container Mode (perf test / QA)
# Maintainer  : Atlas Digital Technology Solutions (athyper Team)
# Environment : local (container mode)
# Version     : 1.0.0
# Compose     : athyper-override-local-container-config
#
# Description :
#   Alternative local override that runs the 6 app services (api, worker,
#   scheduler, neon-web, mesh-web, admin-web) as PRODUCTION containers
#   on the developer machine — used for performance testing and QA that
#   mirrors staging behaviour without leaving Windows.
#
#   Day-to-day dev keeps using athyper.override.local.yml (via dev-local.bat)
#   which runs apps on the host in dev mode (tsx watch / next dev).
#
#   Delta from athyper.override.local.yml:
#     - api / worker / scheduler build from server/Dockerfile.prod
#       (compiled node dist/) instead of Dockerfile.dev (tsx watch)
#     - NODE_ENV=production is explicit (base already defaults, made
#       explicit here so it's visible in `docker inspect`)
#     - Resource limits kept modest for single-machine testing
#
#   The 3 web apps (neon/mesh/admin) already use their production
#   Dockerfile in the base compose — no build override needed.
#
#   All Windows-specific tweaks from athyper.override.local.yml are
#   preserved verbatim below so infra services behave identically.
#
# Usage:
#   stack\scripts\dev-container.bat            : bring 6 app containers up
#   stack\scripts\dev-container.bat --build    : rebuild images first
#   stack\scripts\dev-container.bat --stop-only: stop app containers only
#
# =======================================================================

services:
  # ─────────────────────────────────────────────────────────────────────
  # Gateway (Traefik) — repoint upstream URLs from host.docker.internal
  # (used by dev-local.bat when apps run on the host) to container names
  # (used by dev-container.bat when apps run as containers).
  #
  # The gateway must be RESTARTED for these env changes to take effect —
  # dev-container.bat handles that by force-recreating gateway.
  # ─────────────────────────────────────────────────────────────────────

  gateway:
    environment:
      APPS_ATHYPER_NEON_UPSTREAM_URL:  "http://neon-web:3000"
      APPS_ATHYPER_MESH_UPSTREAM_URL:  "http://mesh-web:3000"
      APPS_ATHYPER_STUDIO_UPSTREAM_URL: "http://studio-web:3000"
      APPS_ATHYPER_API_UPSTREAM_URL:   "http://api:3000"

  # ─────────────────────────────────────────────────────────────────────
  # App services — prod container mode overrides
  # ─────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod
    environment:
      NODE_ENV: production

  worker:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod
    environment:
      NODE_ENV: production

  scheduler:
    build:
      context: ../..
      dockerfile: server/Dockerfile.prod
    environment:
      NODE_ENV: production

  neon-web:
    environment:
      NODE_ENV: production

  mesh-web:
    environment:
      NODE_ENV: production

  studio-web:
    environment:
      NODE_ENV: production

  # ─────────────────────────────────────────────────────────────────────
  # Windows/local infra tweaks — copied verbatim from
  # athyper.override.local.yml so infra behaves identically in both modes.
  # Named service users (9100-9105) exist only on the Linux server; on
  # Windows bind mounts present as 755, so non-zero UIDs hit EACCES.
  #   user: "0:0"           — run as root
  #   cap_add: [DAC_OVERRIDE] — restore capability dropped by cap_drop: ALL
  # ─────────────────────────────────────────────────────────────────────

  memorycache:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    ports:
      - "6379:6379"
    networks:
      internal: null
      edge: null

  memorycache-jobs:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  objectstorage:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  logging:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  metrics:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  telemetry:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    volumes:
      - ${ATHYPER_CONFIG}/telemetry/provisioning.env/dashboards.local.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro

  tracing:
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  # searchcore Windows tweak — only takes effect when --with-search brings
  # the search/athyper-searchcore.yml compose file into the file list.
  searchcore:
    image: getmeili/meilisearch:v1.13
    profiles: ["search"]
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE

  db:
    ports:
      - "5432:5432"
    networks:
      internal: null
      edge: null

  dbpool-apps:
    ports:
      - "6432:6432"
    networks:
      internal: null
      edge: null

  dbpool-session:
    ports:
      - "6433:6433"
    networks:
      internal: null
      edge: null
