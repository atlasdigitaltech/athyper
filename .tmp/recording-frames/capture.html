<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: white; width: 100%; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; background: white; }
  #status { position: fixed; left: 8px; top: 8px; font: 14px sans-serif; background: rgba(255,255,255,.8); color: #111; }
</style>
</head>
<body>
<video id="video" muted playsinline preload="auto" crossorigin="anonymous" style="display:none"></video>
<canvas id="canvas"></canvas>
<div id="status">loading</div>
<script>
const params = new URLSearchParams(location.search);
const t = Number(params.get('t') || '0');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
video.src = 'file:///C:/Users/Chandravel%20Natarajan/Downloads/Recording%202026-06-07%20135038.mp4';
function draw(label) {
  const w = video.videoWidth || 1920;
  const h = video.videoHeight || 1080;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, w, h);
  try { ctx.drawImage(video, 0, 0, w, h); } catch (err) { status.textContent = 'draw failed ' + err.message; return; }
  status.textContent = label + ' t=' + video.currentTime.toFixed(2) + ' dur=' + (video.duration || 0).toFixed(2) + ' size=' + w + 'x' + h;
  document.body.dataset.ready = '1';
}
video.addEventListener('loadedmetadata', () => {
  status.textContent = 'metadata dur=' + video.duration;
  video.currentTime = Math.min(Math.max(t, 0), Math.max(video.duration - 0.05, 0));
});
video.addEventListener('seeked', () => {
  video.play().then(() => setTimeout(() => { video.pause(); draw('ready'); }, 250)).catch(() => draw('ready'));
});
video.addEventListener('error', () => { status.textContent = 'video error'; });
setTimeout(() => { if (document.body.dataset.ready !== '1') draw('timeout'); }, 4500);
</script>
</body>
</html>
