  - "!packages/shared/finance-rules"
  - "!packages/shared/runtime-line-item"
  - "!packages/shared/theme"
  - "!packages/shared/ui"
  - "tooling/*"
  # ── Server packages (three-plane refactor structure) ──────────────────────
  - "server/apps/*"
  - "server/db"
