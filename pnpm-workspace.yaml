  # foundation/theme uses different name @athyper/platform-theme — no conflict
  # - "!packages/shared/business-domain/theme"
  - "!packages/shared/business-domain/ui"
  # data-integration/icons re-enabled: @athyper/icons has no replacement (platform-icons is a different name)
  # - "!packages/shared/data-integration/icons"
  - "!packages/shared/platform-auth/config"
  # cascade re-enabled: @athyper/cascade required by server/packages/services/shared
  # - "!packages/shared/runtime-domain/cascade"
  - "!packages/shared/runtime-domain/config"
  # runtime-domain/content-ui re-enabled: @athyper/content-ui has no replacement in active workspace
