  - "!packages/shared/runtime-domain/domain-widgets"
  - "!packages/shared/runtime-domain/entity-print"
  - "!packages/shared/runtime-domain/finance-rules"
  - "!packages/shared/runtime-domain/icons"
  - "!packages/shared/runtime-domain/temporal"
  - "!packages/shared/runtime-domain/theme"
  # runtime-domain/ui re-enabled: @athyper/ui peerDep required by runtime-shared and its consumers
  # business-domain/ui stays excluded (same name @athyper/ui, superseded by runtime-domain/ui)
  # - "!packages/shared/runtime-domain/ui"
  - "!packages/shared/shared-infrastructure/config"
  - "!packages/shared/ui-platform/config"
  - "!packages/shared/ui-platform/finance-rules"
  - "!packages/shared/ui-platform/i18n"
  - "!packages/shared/ui-platform/notifications-client"
  - "!packages/shared/ui-platform/temporal"
