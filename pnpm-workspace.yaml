  - "!packages/platform/api-client"
  - "!packages/platform/brand"
  - "!packages/platform/core"
  - "!packages/platform/i18n"
  - "!packages/platform/icons"
  - "!packages/platform/notifications"
  - "!packages/platform/query"
  - "!packages/platform/surface-kit"
  - "!packages/platform/theme"
  - "!packages/platform/ui"
  # ── Old shared hierarchy copy superseded by packages/contracts/mesh-exchange ──
  - "!packages/shared/data-integration/mesh-exchange-contracts"

  # ── New package structure ────────────────────────────────────────────
  - "packages/tooling/*"
