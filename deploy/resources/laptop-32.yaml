apiVersion: athyper.io/v1alpha1
kind: ResourceProfile
metadata:
  id: laptop-32
spec:
  hostMemoryMiB: 32768
  wslMemoryMiB: 20480
  # Three isolated Redis stores; retain 4 GiB within the WSL budget for overhead.
  maxContainerMemoryMiB: 16384
  maxContainerCpu: 16
  minimumFreeDiskGiB: 100
  diskWarningPercent: 20
  diskCriticalPercent: 10
