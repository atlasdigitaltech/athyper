apiVersion: athyper.io/v1alpha1
kind: ProviderCatalog
providers:
  search: { allowedModes: [internal, external, mock, disabled], applicationVariable: SEARCHCORE_URL, healthPath: /health, timeoutMs: 10000, dataOwner: search, backupOwner: search }
  secrets: { allowedModes: [file, internal, external, disabled], applicationVariable: SECRETS_PROVIDER_URL, healthPath: /api/status, timeoutMs: 5000, dataOwner: security, backupOwner: security }
  objectStorage: { allowedModes: [internal, external, mock], applicationVariable: S3_ENDPOINT, healthPath: /minio/health/ready, timeoutMs: 10000, dataOwner: object-storage, backupOwner: object-storage }
  mail: { allowedModes: [internal, external, mock, disabled], applicationVariable: EMAIL_PROVIDER, timeoutMs: 10000, dataOwner: communications, backupOwner: disposable }
  push: { allowedModes: [external, mock, disabled], applicationVariable: VAPID_PUBLIC_KEY, timeoutMs: 10000, dataOwner: communications, backupOwner: disposable }
  scanner: { allowedModes: [internal, external, mock, disabled], applicationVariable: CLAMD_HOST, companionVariables: [CLAMD_PORT], timeoutMs: 30000, dataOwner: security, backupOwner: rebuildable }
  rendering: { allowedModes: [internal, external, mock, disabled], applicationVariable: DOCRENDER_BASE_URL, healthPath: /health, timeoutMs: 30000, dataOwner: documents, backupOwner: source }
