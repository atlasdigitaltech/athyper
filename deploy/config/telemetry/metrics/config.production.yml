# Prometheus scrape configuration for production.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - redis-alerts.yml
  - record-transfer-alerts.yml
  - business-partner-alerts.yml
  - business-partner-case-alerts.yml
  - api-alerts.yml
  # recording-rules.yml, governance-alerts.yml and document-registry-alerts.yml
  # were removed: their metrics (gov_*, fin_doc_registry_*,
  # athyper_http_requests_total, athyper_queue_jobs) are not emitted anywhere in
  # current code. See docs/operations/observability-followups-20260912.md.
  # NOTE: document-registry-slo.yml is a specification document, not Prometheus-native.
  # It uses a custom recording_rules/slos YAML format. Do not add it to rule_files.

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["metrics:9090"]
        labels:
          service: prometheus
          component: prometheus
          env: production
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager
          component: alertmanager
          env: production
  - job_name: redis_exporter
    static_configs:
      - targets: ["memorycache-exporter:9121"]
        labels:
          service: memorycache
          role: primary
          component: redis_exporter
          env: production

  - job_name: athyper_api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9464"]
        labels:
          service: api
          component: cache_metrics
          env: production
  - job_name: loki
    static_configs:
      - targets: ["logging:3100"]
        labels:
          service: logging
          component: loki
          env: production
  - job_name: alloy
    static_configs:
      - targets: ["logshipper:12345"]
        labels:
          service: logging
          component: alloy
          env: production
  - job_name: tempo
    static_configs:
      - targets: ["tracing:3200"]
        labels:
          service: tracing
          component: tempo
          env: production
