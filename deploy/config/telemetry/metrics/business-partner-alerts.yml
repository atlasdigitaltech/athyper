groups:
  - name: athyper-business-partner-v1
    rules:
      - alert: AthyperBusinessPartnerMetricsCollectionFailed
        expr: athyper_business_partner_metrics_collection_success == 0 or (time() - athyper_business_partner_metrics_last_success_timestamp_seconds > 300)
        for: 5m
        labels:
          { severity: warning, service: business-partner, team: master-data }
        annotations:
          summary: "Business Partner metrics collection is failing, unconfigured, or stale"
          runbook: "docs/runbooks/business-partner-metrics-collector.md"
      - alert: AthyperBusinessPartnerCaseMutationLatencyHigh
        expr: histogram_quantile(0.95, sum by (le,operation) (rate(athyper_business_partner_case_http_duration_ms_bucket{operation=~"create-case|update-case|validate-case|submit-case|decide-case|materialize-case"}[10m]))) > 800
        for: 10m
        labels:
          { severity: warning, service: business-partner, team: master-data }
        annotations:
          {
            summary: "Business Partner governed-case mutation p95 exceeds 800 ms",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
      - alert: AthyperBusinessPartnerCaseFailureRateHigh
        expr: sum(rate(athyper_business_partner_case_http_total{outcome="error"}[10m])) / clamp_min(sum(rate(athyper_business_partner_case_http_total[10m])), 0.001) > 0.01
        for: 10m
        labels:
          { severity: critical, service: business-partner, team: master-data }
        annotations:
          {
            summary: "Business Partner governed-case error rate exceeds one percent",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
      - alert: AthyperBusinessPartnerCaseStuck
        expr: athyper_business_partner_case_oldest_open_seconds > 86400
        for: 15m
        labels:
          { severity: warning, service: business-partner, team: master-data }
        annotations:
          {
            summary: "A non-terminal Business Partner case has been open for more than 24 hours",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
      - alert: AthyperBusinessPartnerNotificationPlanningFailure
        expr: increase(athyper_business_partner_notification_planning_total{outcome=~"retry|dead_letter"}[10m]) > 0
        for: 1m
        labels:
          { severity: warning, service: business-partner, team: communications }
        annotations:
          {
            summary: "Business Partner notification planning is retrying or dead-lettering",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
      - alert: AthyperBusinessPartnerNotificationStuck
        expr: athyper_business_partner_notification_oldest_pending_seconds > 300
        for: 5m
        labels:
          { severity: warning, service: business-partner, team: communications }
        annotations:
          {
            summary: "A Business Partner notification has remained pending for more than five minutes",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
      - alert: AthyperBusinessPartnerNotificationDeadLetter
        expr: athyper_business_partner_notification_dead_letters > 0
        for: 1m
        labels:
          {
            severity: critical,
            service: business-partner,
            team: communications,
          }
        annotations:
          {
            summary: "A Business Partner notification planning item is dead-lettered",
            runbook: "docs/runbooks/business-partner-v1-operations.md",
          }
  - name: athyper-business-partner-delivery
    rules:
      - alert: AthyperBusinessPartnerDeliveryFailures
        expr: sum(rate(athyper_business_partner_mesh_delivery_total{operation="delivery",outcome=~"retry|dead_letter|quarantined"}[5m])) > 0.05
        for: 10m
        labels: { severity: warning, service: business-partner }
        annotations:
          {
            summary: "MESH to NEON Business Partner delivery is failing",
            runbook: "docs/runbooks/business-partner-production-rollout.md",
          }
      - alert: AthyperBusinessPartnerDeliveryDeadLetter
        expr: increase(athyper_business_partner_mesh_delivery_total{operation="delivery",outcome=~"dead_letter|quarantined"}[5m]) > 0
        for: 1m
        labels: { severity: critical, service: business-partner }
        annotations:
          {
            summary: "Business Partner event entered dead letter or quarantine",
            runbook: "docs/runbooks/business-partner-production-rollout.md",
          }
      - alert: AthyperBusinessPartnerReconciliationDrift
        expr: increase(athyper_business_partner_mesh_delivery_total{operation="reconciliation",outcome="reopened"}[15m]) > 0
        for: 1m
        labels: { severity: warning, service: business-partner }
        annotations:
          {
            summary: "Reconciliation found a missing NEON recipient receipt",
            runbook: "docs/runbooks/business-partner-production-rollout.md",
          }
  - name: athyper-business-partner-360
    rules:
      - alert: AthyperBusinessPartner360SummaryLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(athyper_bp360_duration_ms_bucket{operation="summary"}[10m]))) > 500
        for: 10m
        labels:
          { severity: warning, service: business-partner-360, team: platform }
        annotations:
          {
            summary: "Business Partner 360 summary p95 exceeds 500 ms",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
      - alert: AthyperBusinessPartner360SectionLatencyHigh
        expr: histogram_quantile(0.95, sum by (le,section) (rate(athyper_bp360_duration_ms_bucket{operation="section"}[10m]))) > 750
        for: 10m
        labels:
          { severity: warning, service: business-partner-360, team: platform }
        annotations:
          {
            summary: "A Business Partner 360 section p95 exceeds 750 ms",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
      - alert: AthyperBusinessPartner360ErrorRateHigh
        expr: sum(rate(athyper_bp360_request_total{outcome="failure"}[10m])) / clamp_min(sum(rate(athyper_bp360_request_total[10m])), 0.001) > 0.01
        for: 10m
        labels:
          { severity: critical, service: business-partner-360, team: platform }
        annotations:
          {
            summary: "Business Partner 360 error rate exceeds one percent",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
      - alert: AthyperBusinessPartner360DefinitionUnavailable
        expr: increase(athyper_bp360_completeness_total{status="definition_unavailable"}[10m]) > 0
        for: 1m
        labels:
          { severity: warning, service: business-partner-360, team: platform }
        annotations:
          {
            summary: "Business Partner 360 completeness cannot use a compatible local definition",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
      - alert: AthyperBusinessPartner360MeshFallbackHigh
        expr: sum(rate(athyper_bp360_mesh_fallback_total[10m])) / clamp_min(sum(rate(athyper_bp360_request_total{section="network"}[10m])), 0.001) > 0.05
        for: 10m
        labels:
          { severity: warning, service: business-partner-360, team: platform }
        annotations:
          {
            summary: "Business Partner 360 Network fallback rate exceeds five percent",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
      - alert: AthyperBusinessPartner360RevealFailureSpike
        expr: increase(athyper_bp360_reveal_total{outcome="failure"}[5m]) > 5
        for: 1m
        labels:
          { severity: critical, service: business-partner-360, team: security }
        annotations:
          {
            summary: "Purpose-bound Business Partner reveal failures are elevated",
            runbook: "docs/runbooks/business-partner-360-operations.md",
          }
