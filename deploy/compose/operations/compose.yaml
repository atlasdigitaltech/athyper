name: athyper-operations

x-athyper:
  resource-profile: laptop-32-ops-lite
  mutually-exclusive-modes:
    [lite, tracing, statuswatch, cronwatch, errorcollect]
  incomplete-modes: [cronwatch, errorcollect]

services:
  metrics:
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    command:
      [
        --config.file=/etc/prometheus/prometheus.yaml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=24h,
      ]
    ports: ["127.0.0.1:53900:9090"]
    volumes:
      - metrics-data:/prometheus
      - ../../config/telemetry/metrics/redis-alerts.yml:/etc/prometheus/redis-alerts.yml:ro
      - ../../config/telemetry/metrics/record-transfer-alerts.yml:/etc/prometheus/record-transfer-alerts.yml:ro
      - ../../config/telemetry/metrics/business-partner-case-alerts.yml:/etc/prometheus/business-partner-case-alerts.yml:ro
      - ../../config/telemetry/metrics/api-alerts.yml:/etc/prometheus/api-alerts.yml:ro
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/business-partner-rules.yaml:/etc/prometheus/business-partner-rules.yaml:ro
      - ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/operations/prometheus-targets:/etc/prometheus/targets:ro
    networks: [operations, host-access, platform-observability]
    healthcheck:
      {
        test: [CMD, wget, -q, --spider, http://127.0.0.1:9090/-/ready],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 384m
    cpus: 0.35

  logging:
    image: ${ATHYPER_IMAGE_LOKI:-athyper/loki:3.6.10-ready}
    build: { context: ../../config/observability-readiness, target: loki }
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yaml]
    volumes: [logging-data:/loki, ./config/loki.yaml:/etc/loki/loki.yaml:ro]
    networks: [operations]
    healthcheck:
      test: [CMD, /usr/local/bin/readiness, http://127.0.0.1:3100/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    cpus: 0.4

  alertmanager:
    image: prom/alertmanager:v0.32.0
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yaml]
    ports: ["127.0.0.1:53905:9093"]
    volumes:
      [
        ./config/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro,
        alertmanager-data:/alertmanager,
      ]
    networks: [operations, platform-observability]
    healthcheck:
      {
        test: [CMD, wget, -q, --spider, http://127.0.0.1:9093/-/ready],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1

  logshipper:
    image: grafana/alloy:v1.15.1
    restart: unless-stopped
    command:
      [
        run,
        --server.http.listen-addr=0.0.0.0:12345,
        --storage.path=/tmp/data-alloy,
        --disable-reporting,
        /etc/alloy/config.alloy,
      ]
    ports: ["127.0.0.1:53901:3500"]
    volumes: [./config/alloy.alloy:/etc/alloy/config.alloy:ro]
    networks: [operations, host-access]
    healthcheck:
      {
        test:
          [
            CMD-SHELL,
            "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/12345; printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'",
          ],
        interval: 15s,
        timeout: 5s,
        retries: 5,
      }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cpus: 0.25

  telemetry:
    image: grafana/grafana:12.4.3
    user: "0:0"
    entrypoint: [/bin/bash, /athyper/bin/start-grafana.sh]
    restart: unless-stopped
    depends_on:
      {
        metrics: { condition: service_healthy },
        logging: { condition: service_healthy },
      }
    environment:
      GF_SECURITY_ADMIN_USER: athyper-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      ATHYPER_OPERATIONS_MODE: ${ATHYPER_OPERATIONS_MODE:-lite}
    secrets: [grafana-admin-password]
    ports: ["127.0.0.1:53902:3000"]
    volumes:
      [
        telemetry-data:/var/lib/grafana,
        ./config/grafana:/athyper/provisioning-source:ro,
        ./scripts/start-grafana.sh:/athyper/bin/start-grafana.sh:ro,
      ]
    networks: [operations, host-access]
    healthcheck:
      {
        test: [CMD-SHELL, wget -q --spider http://127.0.0.1:3000/api/health],
        interval: 15s,
        timeout: 5s,
        retries: 10,
        start_period: 30s,
      }
    security_opt: [no-new-privileges:true]
    # DAC_READ_SEARCH reads the owner-only admin-password secret as root;
    # SETUID/SETGID are for start-grafana.sh's su to the non-root grafana
    # user, which ends up with zero effective capabilities.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.25

  tracing:
    profiles: [tracing]
    image: ${ATHYPER_IMAGE_TEMPO:-athyper/tempo:2.10.4-ready}
    build: { context: ../../config/observability-readiness, target: tempo }
    restart: "no"
    command: [-config.file=/etc/tempo/tempo.yaml]
    ports: ["127.0.0.1:53903:4318"]
    volumes:
      [tracing-data:/var/tempo, ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro]
    networks: [operations, host-access]
    healthcheck:
      test: [CMD, /usr/local/bin/readiness, http://127.0.0.1:3200/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 384m
    cpus: 0.35

  statuswatch:
    profiles: [monitor-status]
    image: louislam/uptime-kuma:1
    # The pinned image's own entrypoint expects to start as root: it chowns
    # /app/data to PUID:PGID then setpriv-drops to that user before exec'ing
    # the app. Forcing `user:` directly bypasses that chown and leaves the
    # volume unwritable by a non-root UID.
    environment:
      PUID: "9105"
      PGID: "9105"
    restart: "no"
    ports: ["127.0.0.1:53904:3001"]
    volumes: [statuswatch-data:/app/data]
    networks: [operations, host-access]
    healthcheck:
      {
        test: [CMD-SHELL, node /app/extra/healthcheck.js],
        interval: 30s,
        timeout: 10s,
        retries: 3,
        start_period: 30s,
      }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    cpus: 0.2

networks:
  operations: { internal: true }
  host-access: {}
  platform-observability:
    external: true
    name: athyper-platform-observability

volumes:
  alertmanager-data: {}
  metrics-data: {}
  logging-data: {}
  telemetry-data: {}
  tracing-data: {}
  statuswatch-data: {}

secrets:
  grafana-admin-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/operations/secrets/grafana-admin-password
