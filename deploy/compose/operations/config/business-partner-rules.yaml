groups:
  - name: business-partner-delivery
    rules:
      - alert: BusinessPartnerDeliveryFailures
        expr: sum(rate(athyper_business_partner_mesh_delivery_total{operation="delivery",outcome=~"retry|dead_letter|quarantined"}[5m])) > 0.05
        for: 10m
        labels: { severity: warning, service: business-partner }
        annotations: { summary: MESH to NEON Business Partner delivery is failing, runbook: docs/runbooks/business-partner-production-rollout.md }
      - alert: BusinessPartnerDeliveryDeadLetter
        expr: increase(athyper_business_partner_mesh_delivery_total{operation="delivery",outcome=~"dead_letter|quarantined"}[5m]) > 0
        for: 1m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: Business Partner event entered dead letter or quarantine, runbook: docs/runbooks/business-partner-production-rollout.md }
      - alert: BusinessPartnerReconciliationDrift
        expr: increase(athyper_business_partner_mesh_delivery_total{operation="reconciliation",outcome="reopened"}[15m]) > 0
        for: 1m
        labels: { severity: warning, service: business-partner }
        annotations: { summary: Reconciliation found a missing NEON recipient receipt, runbook: docs/runbooks/business-partner-production-rollout.md }
      - alert: BusinessPartnerRequestTooOld
        expr: max(athyper_business_partner_request_oldest_open_seconds) > 86400
        for: 15m
        labels: { severity: warning, service: business-partner }
        annotations: { summary: Oldest open Business Partner request exceeds 24 hours, runbook: docs/runbooks/business-partner-p9-qualification.md }
      - alert: BusinessPartnerRequestFailureRate
        expr: sum(rate(athyper_business_partner_request_http_total{outcome="error"}[5m])) / clamp_min(sum(rate(athyper_business_partner_request_http_total[5m])), 0.001) > 0.01
        for: 10m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: Business Partner request failure rate exceeds one percent, runbook: docs/runbooks/business-partner-p9-qualification.md }
      - alert: BusinessPartnerMaterializationFailure
        expr: increase(athyper_business_partner_request_http_total{operation="apply",outcome="error"}[5m]) > 0
        for: 1m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: Business Partner request materialization failed, runbook: docs/runbooks/business-partner-p9-qualification.md }
      - alert: BusinessPartnerInvitationAbuse
        expr: increase(athyper_business_partner_invitation_http_total{operation="external_guard",outcome=~"rate_limited|payload_too_large"}[5m]) > 5
        for: 1m
        labels: { severity: warning, service: business-partner }
        annotations: { summary: External invitation guard is rejecting abusive traffic, runbook: docs/runbooks/business-partner-p9-qualification.md }
      - alert: BusinessPartnerOutboxLag
        expr: max(athyper_outbox_lag_seconds) > 60
        for: 5m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: Outbox lag exceeds the P9 release threshold, runbook: docs/runbooks/outbox-lag.md }
      - alert: BusinessPartnerWorkflowSlaWorkerFailure
        expr: increase(athyper_job_dlq_total{queue="maintenance"}[5m]) > 0 or max(athyper_schedule_lag_seconds{queue="maintenance"}) > 60
        for: 5m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: Workflow SLA maintenance is delayed or dead-lettered, runbook: docs/runbooks/business-partner-p9-qualification.md }
      - alert: BusinessPartnerIamDrift
        expr: increase(trustiam_projection_reconciliation_total{outcome=~"drift|failed|fenced"}[15m]) > 0
        for: 1m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: IAM projection reconciliation detected drift or fencing, runbook: docs/runbooks/trustiam-keycloak-identity-saga-recovery.md }
      - alert: BusinessPartnerReadinessFailure
        expr: min(up{job="athyper-runtime-processes"}) < 1
        for: 2m
        labels: { severity: critical, service: business-partner }
        annotations: { summary: A Business Partner runtime process is not scrape-ready, runbook: docs/runbooks/business-partner-p9-qualification.md }
