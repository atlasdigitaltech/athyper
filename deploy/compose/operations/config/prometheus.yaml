global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs: [{ targets: [alertmanager:9093] }]
rule_files:
  - /etc/prometheus/redis-alerts.yml
  - /etc/prometheus/business-partner-rules.yaml
  - /etc/prometheus/record-transfer-alerts.yml
  - /etc/prometheus/business-partner-case-alerts.yml
  - /etc/prometheus/api-alerts.yml
scrape_configs:
  - job_name: operations-prometheus
    static_configs:
      [
        {
          targets: [127.0.0.1:9090],
          labels: { instance: operations, environment: workstation },
        },
      ]
  - job_name: athyper-instances
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
        refresh_interval: 30s
