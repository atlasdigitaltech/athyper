# Include after compose.yaml, compose.parity.yaml and compose.optional.yaml with --profile secretstore.
# Local development only: TLS for the optional Infisical service on the app network.
services:
  publication-secretstore-tls:
    profiles: [secretstore]
    depends_on:
      secretstore: { condition: service_healthy }
    image: ${ATHYPER_IMAGE_TRAEFIK:-athyper/traefik:3.7.13-hardened}
    build: { context: ../../config/traefik }
    user: "${ATHYPER_RUNTIME_UID:-1000}:${ATHYPER_RUNTIME_GID:-1000}"
    restart: unless-stopped
    command:
      - --entrypoints.https.address=:8443
      - --providers.file.filename=/etc/traefik/publication-secretstore.yaml
      - --api.dashboard=false
      - --log.level=ERROR
    volumes:
      - ./config/traefik/publication-secretstore.yaml:/etc/traefik/publication-secretstore.yaml:ro
    secrets: [publication-tls-certificate, publication-tls-private-key]
    networks:
      app:
        aliases: [secrets.dev.athyper.test]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 128m
    cpus: 0.25
secrets:
  publication-tls-certificate:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/platform/secrets/tls.crt
  publication-tls-private-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/platform/secrets/tls.key
