services:
  memorycache-exporter:
    profiles: [observability]
    image: oliver006/redis_exporter:v1.82.0-alpine
    depends_on:
      memorycache: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://memorycache:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis-password
    secrets: [redis-password]
    networks: [data, ops]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 64m
    cpus: 0.1

  metrics:
    profiles: [observability]
    image: prom/prometheus:v3.11.2
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d]
    volumes:
      - metrics-data:/prometheus
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks: [ops]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 0.5

  logging:
    profiles: [observability]
    image: grafana/loki:3.6.10
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - logging-data:/loki
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
    networks: [ops]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 768m
    cpus: 0.75

  tracing:
    profiles: [observability]
    image: grafana/tempo:2.10.4
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - tracing-data:/var/tempo
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks: [ops]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 512m
    cpus: 0.5

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.32.0
    command: [--config.file=/etc/alertmanager/alertmanager.yaml]
    volumes:
      - ./config/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    networks: [ops]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 128m
    cpus: 0.25

  telemetry:
    profiles: [observability]
    image: grafana/grafana:12.4.3
    depends_on:
      metrics: { condition: service_started }
      logging: { condition: service_started }
      tracing: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: athyper-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana-admin-password]
    ports:
      - "${ATHYPER_GRAFANA_BIND:-127.0.0.1:53000}:3000"
    volumes:
      - telemetry-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [ops]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5

  secretstore-db-init:
    profiles: [secretstore]
    image: postgres:16.13-bookworm
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DB_ROLE: athyper_infisical
      ATHYPER_DB_NAME: athyper_infisical
      ATHYPER_PASSWORD_SECRET: infisical-db-password
    entrypoint: [/bin/bash, /athyper/bin/init-optional-db.sh]
    secrets: [postgres-password, infisical-db-password]
    volumes:
      - ./scripts/init-optional-db.sh:/athyper/bin/init-optional-db.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  secretstore:
    profiles: [secretstore]
    image: infisical/infisical:v0.159.16
    depends_on:
      secretstore-db-init: { condition: service_completed_successfully }
      memorycache: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/start-infisical.sh]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      SITE_URL: ${ATHYPER_INFISICAL_URL:-http://127.0.0.1:53001}
      TELEMETRY_ENABLED: "false"
    secrets: [infisical-encryption-key, infisical-auth-secret, infisical-db-password, redis-password]
    ports:
      - "${ATHYPER_INFISICAL_BIND:-127.0.0.1:53001}:8080"
    volumes:
      - ./scripts/start-infisical.sh:/athyper/bin/start-infisical.sh:ro
    networks: [app, data]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 768m
    cpus: 1.0

  analytics-db-init:
    profiles: [analytics]
    image: postgres:16.13-bookworm
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DB_ROLE: athyper_analytics
      ATHYPER_DB_NAME: athyper_analytics
      ATHYPER_PASSWORD_SECRET: analytics-db-password
    entrypoint: [/bin/bash, /athyper/bin/init-optional-db.sh]
    secrets: [postgres-password, analytics-db-password]
    volumes:
      - ./scripts/init-optional-db.sh:/athyper/bin/init-optional-db.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  analyticsboard:
    profiles: [analytics]
    image: metabase/metabase:v0.51.10
    depends_on:
      analytics-db-init: { condition: service_completed_successfully }
    entrypoint: [/bin/sh, /athyper/bin/start-metabase.sh]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: athyper_analytics
      MB_DB_USER: athyper_analytics
      MB_CHECK_FOR_UPDATES: "false"
    secrets: [analytics-db-password]
    ports:
      - "${ATHYPER_ANALYTICS_BIND:-127.0.0.1:53002}:3000"
    volumes:
      - ./scripts/start-metabase.sh:/athyper/bin/start-metabase.sh:ro
    networks: [app, data]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 1024m
    cpus: 1.0

  dbconsole:
    profiles: [admin-db]
    image: sosedoff/pgweb:0.16.2
    depends_on:
      dbpool-session: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/start-pgweb.sh]
    secrets: [runtime-db-password]
    ports:
      - "${ATHYPER_PGWEB_BIND:-127.0.0.1:53003}:8081"
    volumes:
      - ./scripts/start-pgweb.sh:/athyper/bin/start-pgweb.sh:ro
    networks: [app]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  memorycache-jobs:
    profiles: [admin-queue]
    image: redis:7.4.8-alpine
    entrypoint: [/bin/sh, /athyper/bin/start-jobs-redis.sh]
    secrets: [jobs-redis-password]
    volumes:
      - memorycache-jobs-data:/data
      - ./scripts/start-jobs-redis.sh:/athyper/bin/start-jobs-redis.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5

  queueconsole:
    profiles: [admin-queue]
    image: venatum/bull-board:3.3.17
    depends_on:
      memorycache-jobs: { condition: service_started }
    entrypoint: [/bin/sh, /athyper/bin/start-bull-board.sh]
    environment:
      REDIS_HOST: memorycache-jobs
      REDIS_PORT: "6379"
      REDIS_USE_TLS: "false"
      BULL_VERSION: BULLMQ
    secrets: [jobs-redis-password]
    ports:
      - "${ATHYPER_QUEUE_BIND:-127.0.0.1:53004}:3000"
    volumes:
      - ./scripts/start-bull-board.sh:/athyper/bin/start-bull-board.sh:ro
    networks: [app, data]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.25

volumes:
  metrics-data: {}
  logging-data: {}
  tracing-data: {}
  telemetry-data: {}
  memorycache-jobs-data: {}

secrets:
  grafana-admin-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/grafana-admin-password
  infisical-encryption-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-encryption-key
  infisical-auth-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-auth-secret
  infisical-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-db-password
  analytics-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/analytics-db-password
  jobs-redis-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/jobs-redis-password
