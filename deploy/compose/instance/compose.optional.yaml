services:
  memorycache-exporter:
    profiles: [observability]
    image: oliver006/redis_exporter:v1.82.0-alpine
    user: "${ATHYPER_RUNTIME_UID:-1000}:${ATHYPER_RUNTIME_GID:-1000}"
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis-exporter.sh]
    volumes:
      [
        ./scripts/start-redis-exporter.sh:/athyper/bin/start-redis-exporter.sh:ro,
      ]
    cap_drop: [ALL]
    depends_on:
      memorycache: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://memorycache:6379
    secrets: [redis-password]
    networks:
      data: {}
      ops: {}
      platform-observability:
        aliases: ["memorycache-exporter-${ATHYPER_INSTANCE:-dev}"]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1

  jobqueue-exporter:
    profiles: [observability]
    image: oliver006/redis_exporter:v1.82.0-alpine
    user: "${ATHYPER_RUNTIME_UID:-1000}:${ATHYPER_RUNTIME_GID:-1000}"
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis-exporter.sh]
    volumes:
      [
        ./scripts/start-redis-exporter.sh:/athyper/bin/start-redis-exporter.sh:ro,
      ]
    cap_drop: [ALL]
    depends_on:
      jobqueue: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://jobqueue:6379
    secrets: [redis-password]
    networks:
      data: {}
      ops: {}
      platform-observability:
        aliases: ["jobqueue-exporter-${ATHYPER_INSTANCE:-dev}"]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1

  secretstore-cache-exporter:
    profiles: [observability]
    image: oliver006/redis_exporter:v1.82.0-alpine
    user: "${ATHYPER_RUNTIME_UID:-1000}:${ATHYPER_RUNTIME_GID:-1000}"
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis-exporter.sh]
    volumes:
      [
        ./scripts/start-redis-exporter.sh:/athyper/bin/start-redis-exporter.sh:ro,
      ]
    cap_drop: [ALL]
    depends_on:
      secretstore-cache: { condition: service_healthy }
    environment:
      REDIS_ADDR: redis://secretstore-cache:6379
    secrets: [redis-password]
    networks:
      data: {}
      ops: {}
      platform-observability:
        aliases: ["secretstore-cache-exporter-${ATHYPER_INSTANCE:-dev}"]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 64m
    cpus: 0.1

  metrics:
    profiles: [observability]
    image: prom/prometheus:v3.11.2
    restart: unless-stopped
    command:
      [
        --config.file=/etc/prometheus/prometheus.yaml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=7d,
      ]
    volumes:
      - metrics-data:/prometheus
      - ../../config/telemetry/metrics/redis-alerts.yml:/etc/prometheus/redis-alerts.yml:ro
      - ../../config/telemetry/metrics/record-transfer-alerts.yml:/etc/prometheus/record-transfer-alerts.yml:ro
      - ../../config/telemetry/metrics/business-partner-case-alerts.yml:/etc/prometheus/business-partner-case-alerts.yml:ro
      - ../../config/telemetry/metrics/api-alerts.yml:/etc/prometheus/api-alerts.yml:ro
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/prometheus/business-partner-rules.yaml:/etc/prometheus/business-partner-rules.yaml:ro
    networks: [ops]
    healthcheck:
      test: [CMD, wget, -q, -T, "4", --spider, http://127.0.0.1:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    cpus: 0.5

  tracing:
    profiles: [observability]
    image: ${ATHYPER_IMAGE_TEMPO:-athyper/tempo:2.10.4-ready}
    build: { context: ../../config/observability-readiness, target: tempo }
    restart: unless-stopped
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - tracing-data:/var/tempo
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    networks: [ops]
    healthcheck:
      test: [CMD, /usr/local/bin/readiness, http://127.0.0.1:3200/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    cpus: 0.5

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.32.0
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yaml]
    volumes:
      - ./config/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    networks: [ops]
    healthcheck:
      test: [CMD, wget, -q, -T, "4", --spider, http://127.0.0.1:9093/-/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 128m
    cpus: 0.25

  telemetry:
    profiles: [observability]
    image: grafana/grafana:12.4.3
    restart: unless-stopped
    # Root bootstrap reads the owner-only admin-password secret, then su
    # drops to the image's non-root grafana account before exec'ing Grafana.
    user: "0:0"
    entrypoint: [/bin/bash, /athyper/bin/start-grafana.sh]
    depends_on:
      metrics: { condition: service_healthy }
      tracing: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: athyper-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana-admin-password]
    ports:
      - "${ATHYPER_GRAFANA_BIND:-127.0.0.1:53000}:3000"
    volumes:
      - telemetry-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/start-grafana.sh:/athyper/bin/start-grafana.sh:ro
    networks: [ops]
    healthcheck:
      test: [CMD, wget, -q, -T, "4", --spider, http://127.0.0.1:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 0.5

  secretstore-db-init:
    profiles: [secretstore]
    image: ${ATHYPER_IMAGE_POSTGRES:-athyper/postgres:16.15-hardened}
    build: { context: ../../config/postgres }
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DB_ROLE: athyper_infisical
      ATHYPER_DB_NAME: athyper_infisical
      ATHYPER_PASSWORD_SECRET: infisical-db-password
    entrypoint: [/bin/bash, /athyper/bin/init-optional-db.sh]
    secrets: [postgres-password, infisical-db-password]
    volumes:
      - ./scripts/init-optional-db.sh:/athyper/bin/init-optional-db.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    # Runs as the image's default root user (psql only, no privilege drop);
    # DAC_READ_SEARCH is required to read the owner-only postgres/role secrets
    # once all other capabilities are dropped.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  secretstore:
    restart: unless-stopped
    profiles: [secretstore]
    image: infisical/infisical:v0.159.16
    # Read owner-only Docker secrets, then drop to the image's non-root account.
    user: "0:0"
    depends_on:
      secretstore-db-init: { condition: service_completed_successfully }
      secretstore-cache: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/start-infisical.sh]
    # Use the image's built-in CA bundle; its entrypoint updates /etc at runtime.
    command: [node, --enable-source-maps, dist/main.mjs]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      SITE_URL: ${ATHYPER_INFISICAL_URL:-http://127.0.0.1:53001}
      TELEMETRY_ENABLED: "false"
    secrets:
      [
        infisical-encryption-key,
        infisical-auth-secret,
        infisical-db-password,
        redis-password,
      ]
    ports:
      - "${ATHYPER_INFISICAL_BIND:-127.0.0.1:53001}:8080"
    volumes:
      - ./scripts/start-infisical.sh:/athyper/bin/start-infisical.sh:ro
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --show-error,
          --max-time,
          "4",
          http://127.0.0.1:8080/api/status,
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 768m
    cpus: 1.0

  analytics-db-init:
    profiles: [analytics]
    image: ${ATHYPER_IMAGE_POSTGRES:-athyper/postgres:16.15-hardened}
    build: { context: ../../config/postgres }
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DB_ROLE: athyper_analytics
      ATHYPER_DB_NAME: athyper_analytics
      ATHYPER_PASSWORD_SECRET: analytics-db-password
    entrypoint: [/bin/bash, /athyper/bin/init-optional-db.sh]
    secrets: [postgres-password, analytics-db-password]
    volumes:
      - ./scripts/init-optional-db.sh:/athyper/bin/init-optional-db.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  analyticsboard:
    profiles: [analytics]
    image: ${ATHYPER_IMAGE_METABASE:-athyper/metabase:0.51.10-hardened}
    build: { context: ../../config/metabase }
    restart: unless-stopped
    depends_on:
      analytics-db-init: { condition: service_completed_successfully }
    entrypoint: [/bin/sh, /athyper/bin/start-metabase.sh]
    command: [/app/run_metabase.sh]
    user: "0:0"
    working_dir: /tmp
    environment:
      HOME: /tmp
      MB_PLUGINS_DIR: /plugins
      # Leave room inside the 1 GiB cgroup for JVM native memory and plugin tmpfs.
      JAVA_OPTS: -Xms128m -Xmx384m -XX:MaxMetaspaceSize=256m
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: athyper_analytics
      MB_DB_USER: athyper_analytics
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
    secrets: [analytics-db-password]
    ports:
      - "${ATHYPER_ANALYTICS_BIND:-127.0.0.1:53002}:3000"
    volumes:
      - ./scripts/start-metabase.sh:/athyper/bin/start-metabase.sh:ro
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --show-error,
          --max-time,
          "4",
          http://127.0.0.1:3000/api/health,
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    security_opt: [no-new-privileges:true]
    # Read the host-owned secret, then take upstream's non-root startup path.
    # The application database is PostgreSQL; extracted plugins are ephemeral.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs:
      [
        "/tmp:size=128m,mode=1777",
        "/plugins:size=256m,uid=2000,gid=2000,mode=0700",
      ]
    init: true
    mem_limit: 1024m
    cpus: 1.0

  dbconsole:
    profiles: [admin-db]
    image: sosedoff/pgweb:0.16.2
    restart: unless-stopped
    depends_on:
      dbpool-session: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/start-pgweb.sh]
    secrets: [runtime-db-password]
    ports:
      - "${ATHYPER_PGWEB_BIND:-127.0.0.1:53003}:8081"
    volumes:
      - ./scripts/start-pgweb.sh:/athyper/bin/start-pgweb.sh:ro
    networks: [app]
    healthcheck:
      test:
        [
          CMD,
          curl,
          --fail,
          --silent,
          --show-error,
          --max-time,
          "4",
          http://127.0.0.1:8081/api/bookmarks,
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  queueconsole:
    profiles: [admin-queue]
    image: venatum/bull-board:3.3.17
    restart: unless-stopped
    depends_on:
      jobqueue: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/start-bull-board.sh]
    environment:
      REDIS_HOST: jobqueue
      REDIS_PORT: "6379"
      REDIS_USE_TLS: "false"
      BULL_VERSION: BULLMQ
    secrets: [redis-password]
    ports:
      - "${ATHYPER_QUEUE_BIND:-127.0.0.1:53004}:3000"
    volumes:
      - ./scripts/start-bull-board.sh:/athyper/bin/start-bull-board.sh:ro
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthcheck', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || (await r.json()).status !== 'ok') process.exit(1)}).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.25

volumes:
  metrics-data: {}
  tracing-data: {}
  telemetry-data: {}
  alertmanager-data: {}

secrets:
  grafana-admin-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/grafana-admin-password
  infisical-encryption-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-encryption-key
  infisical-auth-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-auth-secret
  infisical-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/infisical-db-password
  analytics-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/analytics-db-password
