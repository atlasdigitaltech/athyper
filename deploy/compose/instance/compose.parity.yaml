x-web-common: &web-common
  restart: unless-stopped
  entrypoint: [/bin/sh, /athyper/bin/start-web.sh]
  depends_on:
    api: { condition: service_healthy }
    iam: { condition: service_healthy }
    memorycache: { condition: service_healthy }
  volumes:
    - ./scripts/start-web.sh:/athyper/bin/start-web.sh:ro
  networks: [edge, app]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  healthcheck:
    test: [CMD-SHELL, wget -q --spider http://127.0.0.1:3000/]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 30s

x-runtime-common: &runtime-common
  image: ${ATHYPER_IMAGE_RUNTIME_SERVER:-ghcr.io/atlasdigitaltech/athyper-runtime-server:dev}
  restart: unless-stopped
  entrypoint: [/bin/sh, /athyper/bin/start-runtime.sh]
  depends_on:
    dbpool-apps: { condition: service_healthy }
    dbpool-session: { condition: service_healthy }
    iam: { condition: service_healthy }
    memorycache: { condition: service_healthy }
    jobqueue: { condition: service_healthy }
    objectstorage-init: { condition: service_completed_successfully }
    virusscan: { condition: service_healthy }
    docrender: { condition: service_healthy }
    docparser: { condition: service_healthy }
    searchcore: { condition: service_healthy }
    searchcore-key-init: { condition: service_completed_successfully }
  volumes:
    - ./scripts/start-runtime.sh:/athyper/bin/start-runtime.sh:ro
    - searchcore-key:/run/searchcore:ro
  networks: [app, data, document-services]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true

services:
  neon-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_NEON_WEB:-ghcr.io/atlasdigitaltech/athyper-neon-web:dev}
    environment:
      ATHYPER_APP_ID: neon
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_APP_DOMAIN: neon.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: neon-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/neon-iam-client-secret
    secrets:
      [session-token-encryption-key, neon-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  mesh-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_MESH_WEB:-ghcr.io/atlasdigitaltech/athyper-mesh-web:dev}
    environment:
      ATHYPER_APP_ID: mesh
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_APP_DOMAIN: mesh.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: mesh-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/mesh-iam-client-secret
    secrets:
      [session-token-encryption-key, mesh-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  studio-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_STUDIO_WEB:-ghcr.io/atlasdigitaltech/athyper-studio-web:dev}
    environment:
      ATHYPER_APP_ID: studio
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_APP_DOMAIN: studio.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: studio-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/studio-iam-client-secret
    secrets:
      [session-token-encryption-key, studio-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  # Private metrics listener; the application /metrics on port 4000 stays loopback-only.
  api:
    <<: *runtime-common
    networks:
      app: {}
      data: {}
      document-services: {}
      ops: {}
      platform-observability:
        aliases: ["api-${ATHYPER_INSTANCE:-dev}"]
    environment:
      REDIS_BULLMQ_HOST: jobqueue
      MODE: api
      PROCESS_METRICS_PORT: "9464"
      ATLAS_AGENT_ENABLED: ${ATLAS_AGENT_ENABLED:-false}
      ATLAS_CONVERSATION_PERSISTENCE_ENABLED: ${ATLAS_CONVERSATION_PERSISTENCE_ENABLED:-false}
      ATLAS_AGENT_TOOLS_ENABLED: ${ATLAS_AGENT_TOOLS_ENABLED:-false}
      WAVE0_CONTROL_ADMIN_PARAMETERS_ENABLED: ${WAVE0_CONTROL_ADMIN_PARAMETERS_ENABLED:-false}
      BUSINESS_PARTNER_METRICS_TARGETS: ${BUSINESS_PARTNER_METRICS_TARGETS:-[]}
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      # Enabled after bearer-authenticated, exact-plane CSV/XLSX/JSON acceptance.
      # Operators can still disable the contract explicitly per environment.
      RECORD_TRANSFER_PUBLIC_API_ENABLED: ${RECORD_TRANSFER_PUBLIC_API_ENABLED:-true}
      PUBLICATION_API_ENABLED: ${PUBLICATION_API_ENABLED:-true}
      PUBLICATION_TARGET_PLANES: ${PUBLICATION_TARGET_PLANES:-studio,neon,mesh}
      VAPID_SUBJECT_FILE: /run/secrets/vapid-subject
      VAPID_PUBLIC_KEY_FILE: /run/secrets/vapid-public-key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private-key
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - objectstorage-artifacts-writer-access-key
      - objectstorage-artifacts-writer-secret-key
      - vapid-subject
      - vapid-public-key
      - vapid-private-key
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:4000/livez]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 20s
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *runtime-common
    environment:
      REDIS_BULLMQ_HOST: jobqueue
      MODE: worker
      PROCESS_METRICS_PORT: "9464"
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      BUSINESS_PARTNER_MESH_DELIVERY_ENABLED: ${BUSINESS_PARTNER_MESH_DELIVERY_ENABLED:-true}
      BUSINESS_PARTNER_MESH_RECONCILIATION_ENABLED: ${BUSINESS_PARTNER_MESH_RECONCILIATION_ENABLED:-true}
      VAPID_SUBJECT_FILE: /run/secrets/vapid-subject
      VAPID_PUBLIC_KEY_FILE: /run/secrets/vapid-public-key
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid-private-key
    networks:
      app: {}
      data: {}
      document-services: {}
      ops: {}
      platform-observability:
        aliases: ["worker-${ATHYPER_INSTANCE:-dev}"]
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - objectstorage-artifacts-writer-access-key
      - objectstorage-artifacts-writer-secret-key
      - vapid-subject
      - vapid-public-key
      - vapid-private-key
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');const s=fs.statSync('/tmp/athyper-worker.heartbeat');if(Date.now()-s.mtimeMs>45000)process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0

  scheduler:
    <<: *runtime-common
    environment:
      REDIS_BULLMQ_HOST: jobqueue
      MODE: scheduler
      PROCESS_METRICS_PORT: "9464"
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      BUSINESS_PARTNER_MESH_DELIVERY_ENABLED: ${BUSINESS_PARTNER_MESH_DELIVERY_ENABLED:-true}
      BUSINESS_PARTNER_MESH_RECONCILIATION_ENABLED: ${BUSINESS_PARTNER_MESH_RECONCILIATION_ENABLED:-true}
    networks:
      app: {}
      data: {}
      document-services: {}
      ops: {}
      platform-observability:
        aliases: ["scheduler-${ATHYPER_INSTANCE:-dev}"]
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - objectstorage-artifacts-writer-access-key
      - objectstorage-artifacts-writer-secret-key
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');const s=fs.statSync('/tmp/athyper-scheduler.heartbeat');if(Date.now()-s.mtimeMs>45000)process.exit(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 0.5

  # DEV-only clean-database foundation build. It intentionally refuses an
  # existing schema; release instances use the forward-only runner below.
  db-migration:
    <<: *runtime-common
    profiles: [migration]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DDL_SHA256: ${ATHYPER_DDL_SHA256:?set ATHYPER_DDL_SHA256}
    entrypoint: [/bin/sh, /athyper/bin/run-foundation.sh]
    secrets: [postgres-password]
    volumes:
      - ./scripts/run-foundation.sh:/athyper/bin/run-foundation.sh:ro
      - ./scripts/runtime-worker-grants-v1.sql:/athyper/reconciliation/runtime-worker-grants-v1.sql:ro
      - ../../../server/db/ddl:/athyper/ddl:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  db-forward-migration:
    <<: *runtime-common
    profiles: [migration]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      ATHYPER_MIGRATION_ROOT: /app/migrations
    entrypoint: [/bin/sh, /app/bin/run-forward-migrations.sh]
    secrets: [postgres-password]
    volumes: []
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  # One-time QA initialization only. The current foundation checksum must be
  # present in every plane before image-contained migrations may be baselined.
  db-migration-baseline:
    <<: *runtime-common
    profiles: [migration]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      ATHYPER_DDL_SHA256: ${ATHYPER_DDL_SHA256:?set ATHYPER_DDL_SHA256}
      ATHYPER_MIGRATION_ROOT: /app/migrations
    entrypoint: [/bin/sh, /athyper/bin/baseline-forward-migrations.sh]
    secrets: [postgres-password]
    volumes:
      - ./scripts/baseline-forward-migrations.sh:/athyper/bin/baseline-forward-migrations.sh:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  virusscan:
    image: ${ATHYPER_IMAGE_VIRUSSCAN:-athyper/clamav:1.5.2-zip-limit-1}
    build:
      context: ../../config/virusscan
    entrypoint: [/bin/sh, /athyper/bin/start-clamav.sh]
    restart: unless-stopped
    # The malware-scanning adapter parses clamd's VERSION build date (no timezone field) as UTC;
    # pin the container's clock so that assumption holds regardless of the host's local timezone.
    environment:
      TZ: UTC
      # Report engine inspection limits as detections where supported.
      # The local engine patch makes ZIP truncation report this limit too.
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
      CLAMD_CONF_MaxRecursion: "17"
      # FreshClam can update before clamd's socket exists during image startup.
      # Periodic self-check provides reload recovery even if that notification fails.
      CLAMD_CONF_SelfCheck: "60"
      FRESHCLAM_CHECKS: "24"
    volumes:
      - virusscan-data:/var/lib/clamav
      - ./scripts/start-clamav.sh:/athyper/bin/start-clamav.sh:ro
    # Untrusted-file scanning must not share the database/search network.
    # FreshClam retains dedicated outbound access. clamd listens on both interfaces;
    # this is not a signature-domain allowlist. No host port is published here.
    networks: [document-services, signature-egress]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG && find /var/lib/clamav -maxdepth 1 -name 'daily.c?d' -mtime -2 -print | grep -q .",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /run, /var/log/clamav]
    # Root prepares signature/log ownership and runtime config; upstream daemons
    # drop to clamav. The wrapper redirects config mutations into /tmp.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    mem_limit: 1280m
    cpus: 1.0

  docrender:
    image: ${ATHYPER_IMAGE_GOTENBERG:-athyper/gotenberg:8.37.0-hardened}
    build: { context: ../../config/gotenberg }
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-disable-routes=true
      # Only uploaded HTML/assets are needed; block all remote fetch mechanisms.
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-list=^https?://.*
      - --api-disable-download-from=true
      - --api-download-from-deny-list=.*
      - --webhook-deny-list=.*
      - --pdfengines-disable-routes=true
    networks: [document-services]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:3000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, "/home/gotenberg:uid=1001,gid=1001,mode=0700"]
    # Verified locally: starts and renders (chromium + libreoffice) with no capabilities at all.
    cap_drop: [ALL]
    init: true
    mem_limit: 512m
    cpus: 1.0

  docparser:
    image: ${ATHYPER_IMAGE_TIKA:-athyper/tika:4.0.0-hardened}
    build: { context: ../../config/tika }
    restart: unless-stopped
    networks: [document-services]
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -T,
          "5",
          -t,
          "1",
          -O,
          /dev/null,
          http://127.0.0.1:9998/tika,
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    init: true
    mem_limit: 768m
    cpus: 1.0

  searchcore:
    image: ${ATHYPER_IMAGE_MEILISEARCH:-athyper/meilisearch:1.13.3-hardened}
    build: { context: ../../config/meilisearch }
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-search.sh]
    environment:
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512MiB
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_LOG_LEVEL: INFO
      MEILI_NO_ANALYTICS: "true"
    secrets: [search-master-key]
    volumes:
      - searchcore-data:/meili_data
      - ./scripts/start-search.sh:/athyper/bin/start-search.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:7700/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    # The deployed entrypoint reads a host-owned 0600 Compose secret. The bare image
    # starts without capabilities, but this mount requires DAC_OVERRIDE for that read.
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    init: true
    mem_limit: 1024m
    cpus: 1.0

  # One-shot bootstrap: mints (or reconciles) the scoped Meilisearch API key that
  # api/worker/scheduler use at runtime, so the master key is limited to searchcore and this initializer.
  # Writes the key to the searchcore-key volume for start-runtime.sh to read.
  searchcore-key-init:
    image: ${ATHYPER_IMAGE_SEARCHCORE_KEY_INIT:-athyper/searchcore-key-init:1}
    build:
      context: ../../config/searchcore-key-init
    restart: "no"
    depends_on:
      searchcore: { condition: service_healthy }
    entrypoint: [/bin/sh, /athyper/bin/provision-search-key.sh]
    secrets: [search-master-key]
    volumes:
      - searchcore-key:/run/searchcore
      - ./scripts/provision-search-key.sh:/athyper/bin/provision-search-key.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

volumes:
  virusscan-data: {}
  searchcore-data: {}
  searchcore-key: {}

secrets:
  vapid-subject:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/vapid-subject
  vapid-public-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/vapid-public-key
  vapid-private-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/vapid-private-key
  session-token-encryption-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/session-token-encryption-key
  neon-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/neon-iam-client-secret
  mesh-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/mesh-iam-client-secret
  studio-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/studio-iam-client-secret
  runtime-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/runtime-iam-client-secret
  search-master-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/search-master-key

# Only application runtimes and document processors belong here. Parsers receive
# untrusted files and must not share the database/search network.
networks:
  document-services:
    internal: true
