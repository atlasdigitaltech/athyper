x-web-common: &web-common
  restart: unless-stopped
  entrypoint: [/bin/sh, /athyper/bin/start-web.sh]
  depends_on:
    api: { condition: service_healthy }
    iam: { condition: service_healthy }
    memorycache: { condition: service_healthy }
  volumes:
    - ./scripts/start-web.sh:/athyper/bin/start-web.sh:ro
  networks: [edge, app]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  healthcheck:
    test: [CMD-SHELL, wget -q --spider http://127.0.0.1:3000/]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 30s

x-runtime-common: &runtime-common
  image: ${ATHYPER_IMAGE_RUNTIME_SERVER:-ghcr.io/atlasdigitaltech/athyper-runtime-server:dev}
  restart: unless-stopped
  entrypoint: [/bin/sh, /athyper/bin/start-runtime.sh]
  depends_on:
    dbpool-apps: { condition: service_healthy }
    dbpool-session: { condition: service_healthy }
    iam: { condition: service_healthy }
    memorycache: { condition: service_healthy }
    objectstorage-init: { condition: service_completed_successfully }
    virusscan: { condition: service_healthy }
    docrender: { condition: service_healthy }
    docparser: { condition: service_healthy }
    searchcore: { condition: service_healthy }
  volumes:
    - ./scripts/start-runtime.sh:/athyper/bin/start-runtime.sh:ro
  networks: [app, data]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true

services:
  neon-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_NEON_WEB:-ghcr.io/atlasdigitaltech/athyper-neon-web:dev}
    environment:
      ATHYPER_APP_ID: neon
      ATHYPER_APP_DOMAIN: neon.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: neon-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/neon-iam-client-secret
    secrets: [session-token-encryption-key, neon-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  mesh-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_MESH_WEB:-ghcr.io/atlasdigitaltech/athyper-mesh-web:dev}
    environment:
      ATHYPER_APP_ID: mesh
      ATHYPER_APP_DOMAIN: mesh.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: mesh-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/mesh-iam-client-secret
    secrets: [session-token-encryption-key, mesh-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  studio-web:
    <<: *web-common
    image: ${ATHYPER_IMAGE_STUDIO_WEB:-ghcr.io/atlasdigitaltech/athyper-studio-web:dev}
    environment:
      ATHYPER_APP_ID: studio
      ATHYPER_APP_DOMAIN: studio.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      ATHYPER_IAM_CLIENT_ID: studio-web
      ATHYPER_IAM_SECRET_FILE: /run/secrets/studio-iam-client-secret
    secrets: [session-token-encryption-key, studio-iam-client-secret, redis-password]
    mem_limit: 512m
    cpus: 0.75

  api:
    <<: *runtime-common
    environment:
      MODE: api
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - search-master-key
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:4000/livez]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    stop_grace_period: 20s
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *runtime-common
    environment:
      MODE: worker
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - search-master-key
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');const s=fs.statSync('/tmp/athyper-worker.heartbeat');if(Date.now()-s.mtimeMs>45000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 1.0

  scheduler:
    <<: *runtime-common
    environment:
      MODE: scheduler
      ATHYPER_DOMAIN_SUFFIX: ${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
    secrets:
      - runtime-db-password
      - worker-db-password
      - redis-password
      - runtime-iam-client-secret
      - objectstorage-app-access-key
      - objectstorage-app-secret-key
      - search-master-key
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');const s=fs.statSync('/tmp/athyper-scheduler.heartbeat');if(Date.now()-s.mtimeMs>45000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 0.5

  # DEV-only clean-database foundation build. It intentionally refuses an
  # existing schema; release instances use the forward-only runner below.
  db-migration:
    <<: *runtime-common
    profiles: [migration]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      ATHYPER_DDL_SHA256: ${ATHYPER_DDL_SHA256:?set ATHYPER_DDL_SHA256}
    entrypoint: [/bin/sh, /athyper/bin/run-foundation.sh]
    secrets: [postgres-password]
    volumes:
      - ./scripts/run-foundation.sh:/athyper/bin/run-foundation.sh:ro
      - ./scripts/runtime-worker-grants-v1.sql:/athyper/reconciliation/runtime-worker-grants-v1.sql:ro
      - ../../../server/db/ddl:/athyper/ddl:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  db-forward-migration:
    <<: *runtime-common
    profiles: [migration]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      ATHYPER_MIGRATION_ROOT: /app/migrations
    entrypoint: [/bin/sh, /app/bin/run-forward-migrations.sh]
    secrets: [postgres-password]
    volumes: []
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  virusscan:
    image: clamav/clamav:1.5.2
    restart: unless-stopped
    volumes:
      - virusscan-data:/var/lib/clamav
    # Signatures require outbound connectivity. Only the scanner joins this
    # dedicated egress network; port 3310 remains private on the data network.
    networks: [data, signature-egress]
    healthcheck:
      test: [CMD-SHELL, "echo PING | nc -w 3 127.0.0.1 3310 | grep -q PONG && find /var/lib/clamav -maxdepth 1 -name 'daily.c?d' -mtime -2 -print | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    mem_limit: 1280m
    cpus: 1.0

  docrender:
    image: gotenberg/gotenberg:8.31.0
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-auto-start
      - --libreoffice-restart-after=50
      - --chromium-allow-list=file:///tmp.*
    networks: [data]
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:3000/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 512m
    cpus: 1.0

  docparser:
    image: apache/tika:3.0.0.0-full@sha256:82698af9bacf3dbd80ba7a18cc69d06596af107169fddcb8a067f6bb1bd10426
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9998/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    mem_limit: 768m
    cpus: 1.0

  searchcore:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-search.sh]
    environment:
      MEILI_ENV: production
      MEILI_MAX_INDEXING_MEMORY: 512MiB
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_LOG_LEVEL: INFO
    secrets: [search-master-key]
    volumes:
      - searchcore-data:/meili_data
      - ./scripts/start-search.sh:/athyper/bin/start-search.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:7700/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 1024m
    cpus: 1.0

  mailtrap:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: "500"
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://127.0.0.1:8025/livez]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    init: true
    mem_limit: 256m
    cpus: 0.25

volumes:
  virusscan-data: {}
  searchcore-data: {}

secrets:
  session-token-encryption-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/session-token-encryption-key
  neon-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/neon-iam-client-secret
  mesh-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/mesh-iam-client-secret
  studio-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/studio-iam-client-secret
  runtime-iam-client-secret:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/runtime-iam-client-secret
  search-master-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/search-master-key
