# Browser landing page for the development S3 endpoint. The gateway selects
# this only for unsigned HTML navigation to /; object requests go directly to S3.
server {
  listen 8083;
  server_name _;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;

  location = /console {
    return 302 /console/;
  }

  location /console/ {
    # Resolve lazily so the optional console cannot prevent outage-page startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $storage_console http://objectstorage:23646;
    proxy_pass $storage_console;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cookie_flags admin-session secure httponly samesite=lax;
    client_max_body_size 100m;
    proxy_read_timeout 300s;
    # Override the static landing-page CSP for the console's scripts/styles.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options DENY always;
  }

  location = / {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Athyper object storage</title><style>body{font:18px/1.6 system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:24px;color:#172033;background:#f6f8fc}h1{line-height:1.2}code{overflow-wrap:anywhere}</style></head><body><h1>Athyper object storage</h1><p>This address is the private S3 endpoint for development storage.</p><p>Open documents through Athyper, or connect an S3 client using your assigned access credentials and this endpoint:</p><p><code>https://objects.dev.athyper.test</code></p><p>Use region <code>us-east-1</code> and path-style addressing. Bucket and file access requires authentication or a valid signed URL.</p><p><a href="/console/">Sign in to the storage console</a> to browse buckets and upload or download files.</p></body></html>';
  }

  location / {
    return 404;
  }
}

# Shared ingress policy: all outage/maintenance responses advise HTTP clients
# to retry after 60 seconds. The browser outage page checks recovery every
# 15 seconds independently; maintenance does not automatically reload.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;
  error_page 503 /status.html;
  sub_filter_once on;
  sub_filter '__STATUS_MODE__' 'outage';

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /status.html {
    internal;
  }

  location / {
    return 503;
  }
}

# Maintenance is deliberately a separate, private service. No default router
# selects it; an operator-controlled dynamic route can switch a browser plane
# to this endpoint without changing automatic outage behavior.
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;
  error_page 503 /status.html;
  sub_filter_once on;
  sub_filter '__STATUS_MODE__' 'maintenance';

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /status.html {
    internal;
  }

  location / {
    return 503;
  }
}

# API and unmatched routes never receive browser HTML.
server {
  listen 8082;
  server_name _;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    default_type application/problem+json;
    return 503 '{"type":"urn:athyper:problem:service-unavailable","title":"Service unavailable","status":503,"detail":"The requested Athyper service is temporarily unavailable."}\n';
  }
}
