server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;
  error_page 503 /status.html;
  sub_filter_once on;
  sub_filter '__STATUS_MODE__' 'outage';

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /status.html {
    internal;
  }

  location / {
    return 503;
  }
}

# Maintenance is deliberately a separate, private service. No default router
# selects it; an operator-controlled dynamic route can switch a browser plane
# to this endpoint without changing automatic outage behavior.
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;
  error_page 503 /status.html;
  sub_filter_once on;
  sub_filter '__STATUS_MODE__' 'maintenance';

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /status.html {
    internal;
  }

  location / {
    return 503;
  }
}

# API and unmatched routes never receive browser HTML.
server {
  listen 8082;
  server_name _;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    default_type application/problem+json;
    return 503 '{"type":"urn:athyper:problem:service-unavailable","title":"Service unavailable","status":503,"detail":"The requested Athyper service is temporarily unavailable."}\n';
  }
}
