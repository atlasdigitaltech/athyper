global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - static_configs: [{ targets: [alertmanager:9093] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: [127.0.0.1:9090] }]
  - job_name: redis
    static_configs: [{ targets: [memorycache-exporter:9121] }]
