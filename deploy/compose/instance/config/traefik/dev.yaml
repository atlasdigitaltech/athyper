http:
  routers:
    iam: { rule: Host(`iam.dev.athyper.test`), entryPoints: [web], service: iam }
    api: { rule: Host(`api.dev.athyper.test`), entryPoints: [web], service: api-failover }
    neon: { rule: Host(`neon.dev.athyper.test`), entryPoints: [web], service: neon-failover }
    mesh: { rule: Host(`mesh.dev.athyper.test`), entryPoints: [web], service: mesh-failover }
    studio: { rule: Host(`studio.dev.athyper.test`), entryPoints: [web], service: studio-failover }
    mail: { rule: Host(`mail.dev.athyper.test`), entryPoints: [web], service: mail }
    minio: { rule: Host(`minio.dev.athyper.test`), entryPoints: [web], service: minio }
    fallback: { rule: PathPrefix(`/`), entryPoints: [web], service: problem, priority: 1 }
  services:
    api-failover: { failover: { healthCheck: {}, service: api, fallback: problem } }
    neon-failover: { failover: { healthCheck: {}, service: neon, fallback: outage } }
    mesh-failover: { failover: { healthCheck: {}, service: mesh, fallback: outage } }
    studio-failover: { failover: { healthCheck: {}, service: studio, fallback: outage } }
    iam: { loadBalancer: { servers: [{ url: http://iam:8080 }] } }
    api:
      loadBalancer:
        healthCheck: { path: /livez, interval: 10s, timeout: 3s }
        servers: [{ url: http://api:4000 }]
    neon:
      loadBalancer:
        healthCheck: { path: /, interval: 10s, timeout: 3s }
        servers: [{ url: http://neon-web:3000 }]
    mesh:
      loadBalancer:
        healthCheck: { path: /, interval: 10s, timeout: 3s }
        servers: [{ url: http://mesh-web:3000 }]
    studio:
      loadBalancer:
        healthCheck: { path: /, interval: 10s, timeout: 3s }
        servers: [{ url: http://studio-web:3000 }]
    mail: { loadBalancer: { servers: [{ url: http://mailtrap:8025 }] } }
    minio: { loadBalancer: { servers: [{ url: http://objectstorage:9001 }] } }
    outage:
      loadBalancer:
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers: [{ url: http://gateway-outage:8080 }]
    maintenance:
      loadBalancer:
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers: [{ url: http://gateway-outage:8081 }]
    problem:
      loadBalancer:
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers: [{ url: http://gateway-outage:8082 }]
