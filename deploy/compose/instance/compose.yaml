# The controller supplies the project name with `docker compose --project-name`.
# Secret files are owner-only files below ATHYPER_RUNTIME_ROOT; values never
# appear in this file, Compose environment variables, or image metadata.
services:
  gateway:
    image: ${ATHYPER_IMAGE_TRAEFIK:-athyper/traefik:3.7.13-hardened}
    build: { context: ../../config/traefik }
    user: "${ATHYPER_RUNTIME_UID:-1000}:${ATHYPER_RUNTIME_GID:-1000}"
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=false
      - --log.level=INFO
    volumes:
      - ./config/traefik/${ATHYPER_INSTANCE:-dev}.yaml:/etc/traefik/dynamic.yaml:ro
    networks:
      edge: {}
      app: {}
      platform-ingress:
        aliases:
          - gateway-${ATHYPER_INSTANCE:-dev}
    healthcheck:
      test:
        [
          CMD,
          traefik,
          healthcheck,
          --ping,
          --ping.entrypoint=health,
          --entrypoints.health.address=:8082,
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    init: true
    mem_limit: 256m
    cpus: 0.5

  gateway-outage:
    image: ${ATHYPER_IMAGE_NGINX:-nginxinc/nginx-unprivileged:stable-alpine@sha256:442753882674b49ae2c1de83ed67896131c0777f56df5005e356e62bc3f7e7ce}
    # nginx's master process manages/reaps its workers; no separate init needed.
    restart: unless-stopped
    volumes:
      - ./config/nginx/outage.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/status.html:/usr/share/nginx/html/status.html:ro
    networks: [app]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 2 --spider http://127.0.0.1:8080/healthz &&
          wget -q -T 2 --spider http://127.0.0.1:8081/healthz &&
          wget -q -T 2 --spider http://127.0.0.1:8082/healthz
      interval: 15s
      timeout: 7s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    # Catalog budget for three endpoints (outage, maintenance, problem JSON).
    # Measure representative load before reducing this allocation.
    mem_limit: 128m
    cpus: 0.1

  db:
    image: ${ATHYPER_IMAGE_POSTGRES:-athyper/postgres:16.15-hardened}
    build: { context: ../../config/postgres }
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres-password]
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    ports:
      - "${ATHYPER_POSTGRES_BIND:-127.0.0.1:5432}:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    # Root bootstrap reads owner-only secrets, fixes volume/socket ownership,
    # then setpriv drops to postgres. Persistent writes stay on db-data.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: 2048m
    cpus: 2.0

  db-init:
    image: ${ATHYPER_IMAGE_POSTGRES:-athyper/postgres:16.15-hardened}
    build: { context: ../../config/postgres }
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    entrypoint: [/bin/bash, /athyper/bin/init-postgres.sh]
    secrets:
      [
        postgres-password,
        iam-db-password,
        runtime-db-password,
        worker-db-password,
      ]
    volumes:
      - ./scripts/init-postgres.sh:/athyper/bin/init-postgres.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    # Read owner-only host secret files; no other capabilities are needed.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  dbpool-apps:
    image: ${ATHYPER_IMAGE_PGBOUNCER:-athyper/pgbouncer:1.25.2-hardened}
    build: { context: ../../config/pgbouncer }
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ATHYPER_POOL_MODE: transaction
      ATHYPER_PGBOUNCER_MAX_CLIENT_CONN: "${ATHYPER_PGBOUNCER_APPS_MAX_CLIENT_CONN:-200}"
      ATHYPER_PGBOUNCER_DEFAULT_POOL_SIZE: "${ATHYPER_PGBOUNCER_APPS_DEFAULT_POOL_SIZE:-20}"
      ATHYPER_PGBOUNCER_RESERVE_POOL_SIZE: "${ATHYPER_PGBOUNCER_APPS_RESERVE_POOL_SIZE:-5}"
      ATHYPER_PGBOUNCER_MAX_DB_CONNECTIONS: "${ATHYPER_PGBOUNCER_APPS_MAX_DB_CONNECTIONS:-0}"
      ATHYPER_PGBOUNCER_MAX_USER_CONNECTIONS: "${ATHYPER_PGBOUNCER_APPS_MAX_USER_CONNECTIONS:-0}"
    entrypoint: [/bin/sh, /athyper/bin/start-pgbouncer.sh]
    secrets: [runtime-db-password, worker-db-password]
    volumes:
      - ./scripts/start-pgbouncer.sh:/athyper/bin/start-pgbouncer.sh:ro
      - ./scripts/healthcheck-pgbouncer.sh:/athyper/bin/healthcheck-pgbouncer.sh:ro
    networks: [app, data]
    healthcheck:
      test: [CMD, /bin/sh, /athyper/bin/healthcheck-pgbouncer.sh]
      interval: 10s
      timeout: 10s
      retries: 12
    security_opt: [no-new-privileges:true]
    # Root reads owner-only host secrets, then chown/su drops to uid 70.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  dbpool-session:
    image: ${ATHYPER_IMAGE_PGBOUNCER:-athyper/pgbouncer:1.25.2-hardened}
    build: { context: ../../config/pgbouncer }
    user: "0:0"
    restart: unless-stopped
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ATHYPER_POOL_MODE: session
      ATHYPER_PGBOUNCER_MAX_CLIENT_CONN: "${ATHYPER_PGBOUNCER_SESSION_MAX_CLIENT_CONN:-200}"
      ATHYPER_PGBOUNCER_DEFAULT_POOL_SIZE: "${ATHYPER_PGBOUNCER_SESSION_DEFAULT_POOL_SIZE:-20}"
      ATHYPER_PGBOUNCER_RESERVE_POOL_SIZE: "${ATHYPER_PGBOUNCER_SESSION_RESERVE_POOL_SIZE:-5}"
      ATHYPER_PGBOUNCER_MAX_DB_CONNECTIONS: "${ATHYPER_PGBOUNCER_SESSION_MAX_DB_CONNECTIONS:-0}"
      ATHYPER_PGBOUNCER_MAX_USER_CONNECTIONS: "${ATHYPER_PGBOUNCER_SESSION_MAX_USER_CONNECTIONS:-0}"
    entrypoint: [/bin/sh, /athyper/bin/start-pgbouncer.sh]
    secrets: [runtime-db-password, worker-db-password]
    volumes:
      - ./scripts/start-pgbouncer.sh:/athyper/bin/start-pgbouncer.sh:ro
      - ./scripts/healthcheck-pgbouncer.sh:/athyper/bin/healthcheck-pgbouncer.sh:ro
    networks: [app, data]
    healthcheck:
      test: [CMD, /bin/sh, /athyper/bin/healthcheck-pgbouncer.sh]
      interval: 10s
      timeout: 10s
      retries: 12
    security_opt: [no-new-privileges:true]
    # Root reads owner-only host secrets, then chown/su drops to uid 70.
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  memorycache:
    image: ${ATHYPER_IMAGE_REDIS:-athyper/valkey:8.1.10}
    build: { context: ../../config/redis }
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis.sh]
    secrets: [redis-password]
    environment:
      REDIS_MAXMEMORY_MB: "${REDIS_MAXMEMORY_MB:-512}"
    volumes:
      - valkey-data:/data
      - ./scripts/start-redis.sh:/athyper/bin/start-redis.sh:ro
    # Browser sessions are server-side and fail closed through Redis. Expose
    # Redis only to the private application network in addition to data; the
    # web containers deliberately do not join the broader data network.
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli SET athyper:health:memorycache ok EX 30 | grep -qx OK',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    # Read the owner-only secret before the upstream entrypoint chowns /data
    # and drops to valkey. AOF and snapshots stay on valkey-data.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1024m
    cpus: 0.15

  jobqueue:
    image: ${ATHYPER_IMAGE_REDIS:-athyper/valkey:8.1.10}
    build: { context: ../../config/redis }
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis.sh]
    secrets: [redis-password]
    environment:
      REDIS_MAXMEMORY_MB: "${ATHYPER_JOBS_REDIS_MAXMEMORY_MB:-512}"
    volumes:
      - jobqueue-data:/data
      - ./scripts/start-redis.sh:/athyper/bin/start-redis.sh:ro
    # Dedicated persistent store; no session or cache clients.
    networks: [data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli SET athyper:health:jobqueue ok EX 30 | grep -qx OK',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    # Read the owner-only secret before the upstream entrypoint chowns /data
    # and drops to valkey. AOF and snapshots stay on valkey-data.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1024m
    cpus: 0.25

  secretstore-cache:
    image: ${ATHYPER_IMAGE_REDIS:-athyper/valkey:8.1.10}
    build: { context: ../../config/redis }
    restart: unless-stopped
    entrypoint: [/bin/sh, /athyper/bin/start-redis.sh]
    secrets: [redis-password]
    environment:
      REDIS_MAXMEMORY_MB: "${ATHYPER_SECRETSTORE_REDIS_MAXMEMORY_MB:-256}"
    volumes:
      - secretstore-cache-data:/data
      - ./scripts/start-redis.sh:/athyper/bin/start-redis.sh:ro
    # Dedicated persistent store; no session or cache clients.
    networks: [data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli SET athyper:health:secretstore-cache ok EX 30 | grep -qx OK',
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    # Read the owner-only secret before the upstream entrypoint chowns /data
    # and drops to valkey. AOF and snapshots stay on valkey-data.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.1

  # Local DEV/QA only. Cloud environments use provisioned Amazon S3.
  objectstorage:
    image: ${ATHYPER_IMAGE_SEAWEEDFS:-athyper/seaweedfs:4.46-hardened}
    build: { context: ../../config/seaweedfs }
    restart: unless-stopped
    user: "1000:1000"
    secrets:
      [
        minio-root-password,
        objectstorage-app-access-key,
        objectstorage-app-secret-key,
        objectstorage-artifacts-writer-access-key,
        objectstorage-artifacts-writer-secret-key,
      ]
    volumes: [seaweedfs-data:/data]
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "nc -z 127.0.0.1 9000 && wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1024m
    cpus: 1.0

  objectstorage-init:
    image: ${ATHYPER_IMAGE_S3_TOOLS:-athyper/s3-tools:1}
    build: { context: ../../config/s3-tools }
    restart: "no"
    user: "1000:1000"
    depends_on:
      objectstorage: { condition: service_healthy }
    secrets:
      [
        minio-root-password,
        objectstorage-app-access-key,
        objectstorage-app-secret-key,
        objectstorage-artifacts-writer-access-key,
        objectstorage-artifacts-writer-secret-key,
      ]
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 256m
    cpus: 0.1

  iam:
    image: ${ATHYPER_IMAGE_IAM:-ghcr.io/atlasdigitaltech/athyper-keycloak:dev}
    restart: unless-stopped
    depends_on:
      db-init: { condition: service_completed_successfully }
    entrypoint: [/bin/bash, /athyper/bin/start-keycloak.sh]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/athyper_iam
      KC_DB_USERNAME: athyper_iam
      KC_BOOTSTRAP_ADMIN_USERNAME: athyper-admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: https://iam.${ATHYPER_DOMAIN_SUFFIX:-dev.athyper.test}
      KC_PROXY_HEADERS: xforwarded
    secrets:
      - iam-admin-password
      - iam-db-password
      - studio-iam-client-secret
      - neon-iam-client-secret
      - mesh-iam-client-secret
      - runtime-iam-client-secret
    volumes:
      - iam-data:/opt/keycloak/data
      - ./scripts/start-keycloak.sh:/athyper/bin/start-keycloak.sh:ro
    networks: [app, data]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: [no-new-privileges:true]
    # Image runs as UID 1000 (also the generated secret owner); no capabilities.
    # Quarkus augmentation and health support are baked into the IAM image.
    # Only persistent data and temporary files are writable at runtime.
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1024m
    cpus: 1.0

networks:
  edge: {}
  app: {}
  data:
    internal: true
  signature-egress: {}
  ops:
    internal: true
  # The one deliberate cross-project network. It is created and owned by the
  # athyper-platform Compose project; instance projects only attach gateways.
  platform-ingress:
    external: true
    name: athyper-platform-ingress
  platform-observability:
    external: true
    name: athyper-platform-observability

volumes:
  db-data: {}
  valkey-data: {}
  jobqueue-data: {}
  secretstore-cache-data: {}
  # Retain old MinIO volumes externally for rollback; never mount them in SeaweedFS.
  seaweedfs-data: {}
  iam-data: {}

secrets:
  postgres-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/postgres-password
  redis-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/redis-password
  minio-root-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/minio-root-password
  iam-admin-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/iam-admin-password
  iam-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/iam-db-password
  runtime-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/runtime-db-password
  worker-db-password:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/worker-db-password
  objectstorage-app-access-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/objectstorage-app-access-key
  objectstorage-app-secret-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/objectstorage-app-secret-key
  objectstorage-artifacts-writer-access-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/objectstorage-artifacts-writer-access-key
  objectstorage-artifacts-writer-secret-key:
    file: ${ATHYPER_RUNTIME_ROOT:?set ATHYPER_RUNTIME_ROOT}/instances/${ATHYPER_INSTANCE:-dev}/secrets/objectstorage-artifacts-writer-secret-key
