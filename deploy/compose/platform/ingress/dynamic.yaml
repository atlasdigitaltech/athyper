tls:
  certificates:
    - certFile: /run/secrets/platform-tls-certificate
      keyFile: /run/secrets/platform-tls-private-key
  options:
    default:
      minVersion: VersionTLS12

http:
  routers:
    # QA and staging are intentionally parked while DEV is stabilized.
    # Restore their routers and services after 2026-08-30.
    dev:
      rule: HostRegexp(`[a-z0-9-]+\.dev\.athyper\.test`)
      entryPoints: [websecure]
      service: gateway-dev-failover
      tls: {}
  services:
    gateway-dev-failover:
      failover: { healthCheck: {}, service: gateway-dev, fallback: platform-outage }
    gateway-dev:
      loadBalancer:
        healthCheck: { path: /ping, port: 8082, interval: 10s, timeout: 3s }
        servers: [{ url: http://gateway-dev:8080 }]
    platform-outage:
      loadBalancer:
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers: [{ url: http://platform-outage:8080 }]
