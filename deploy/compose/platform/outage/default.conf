server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  # Shared ingress policy: advise HTTP clients to retry after 60 seconds.
  add_header Retry-After "60" always;
  add_header X-Content-Type-Options "nosniff" always;
  error_page 503 /status.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /status.html {
    internal;
  }

  location / {
    return 503;
  }
}
