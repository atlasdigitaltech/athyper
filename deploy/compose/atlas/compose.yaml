# Separate local-development project. API joins the external inference network.
services:
  atlas-inference:
    image: ${ATLAS_OLLAMA_IMAGE:?Load the pinned image from deploy/config/atlas/local-inference.json}
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_VULKAN: "0"
    volumes:
      - atlas-models:/root/.ollama
    networks: [inference]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 10g
    cpus: 4
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      # Process/API health only. Model readiness is checked separately.
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
networks:
  inference:
    internal: true
volumes:
  atlas-models: {}
