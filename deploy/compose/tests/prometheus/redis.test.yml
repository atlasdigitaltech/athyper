rule_files:
  - ../../../config/telemetry/metrics/redis-alerts.yml
evaluation_interval: 30s
tests:
  - interval: 1m
    input_series:
      - series: redis_memory_used_bytes{service="memorycache"}
        values: 85+0x10
      - series: redis_memory_max_bytes{service="memorycache"}
        values: 100+0x10
    promql_expr_test:
      - expr: ALERTS{alertname="RedisMemoryHigh",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisMemoryHigh",alertstate="firing",service="memorycache",severity="warning"}'
            value: 1
  - interval: 1m
    input_series:
      - series: redis_memory_used_bytes{service="memorycache"}
        values: 96+0x10
      - series: redis_memory_max_bytes{service="memorycache"}
        values: 100+0x10
    promql_expr_test:
      - expr: ALERTS{alertname="RedisMemoryCritical",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisMemoryCritical",alertstate="firing",service="memorycache",severity="critical"}'
            value: 1
  - interval: 1m
    input_series:
      - series: redis_errors_total{service="memorycache",err="OOM"}
        values: 0 0 1 1 1 1
    promql_expr_test:
      - expr: ALERTS{alertname="RedisRejectedWrites",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisRejectedWrites",alertstate="firing",service="memorycache",severity="critical",err="OOM"}'
            value: 1
  - interval: 1m
    input_series:
      - series: up{service="memorycache"}
        values: 0+0x10
    promql_expr_test:
      - expr: ALERTS{alertname="RedisExporterDown",alertstate="firing"}
        eval_time: 2m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisExporterDown",alertstate="firing",service="memorycache",severity="critical"}'
            value: 1
  - interval: 1m
    input_series:
      - series: redis_up{service="memorycache"}
        values: 0+0x10
    promql_expr_test:
      - expr: ALERTS{alertname="RedisDown",alertstate="firing"}
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisDown",alertstate="firing",service="memorycache",severity="critical"}'
            value: 1
  - interval: 1m
    input_series:
      - series: redis_memory_used_bytes{service="memorycache"}
        values: 70+0x10
      - series: redis_memory_max_bytes{service="memorycache"}
        values: 100+0x10
      - series: up{service="memorycache"}
        values: 1+0x10
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 5m
        exp_samples: []
  - interval: 1m
    input_series:
      - series: redis_connected_clients{service="memorycache"}
        values: 8500+0x10
      - series: redis_config_maxclients{service="memorycache"}
        values: 10000+0x10
    promql_expr_test:
      - expr: ALERTS{alertname="RedisHighClientCount",alertstate="firing"}
        eval_time: 6m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="RedisHighClientCount",alertstate="firing",service="memorycache",severity="warning"}'
            value: 1
