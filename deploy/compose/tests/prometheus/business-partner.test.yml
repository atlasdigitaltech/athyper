rule_files:
  - ../../instance/config/prometheus/business-partner-rules.yaml
evaluation_interval: 30s
tests:
  - interval: 1m
    input_series:
      - series: athyper_business_partner_mesh_delivery_total{operation="delivery",outcome="dead_letter",instance="dev"}
        values: 0+5x20
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerDeliveryFailures",alertstate="firing"}
        eval_time: 16m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="BusinessPartnerDeliveryFailures",alertstate="firing",instance="dev",severity="warning",service="business-partner"}'
            value: 1
  - interval: 1m
    input_series:
      - series: athyper_business_partner_mesh_delivery_total{operation="delivery",outcome="retry",instance="dev"}
        values: 0+0x20
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerDeliveryFailures",alertstate="firing"}
        eval_time: 16m
        exp_samples: []
  - interval: 1m
    input_series:
      - series: up{job="athyper-runtime-processes",instance="worker:9464"}
        values: 0+0x5
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerReadinessFailure",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="BusinessPartnerReadinessFailure",alertstate="firing",instance="worker:9464",severity="critical",service="business-partner"}'
            value: 1
  - interval: 1m
    input_series:
      - series: athyper_business_partner_request_http_total{outcome="error",instance="dev"}
        values: 0+10x15
      - series: athyper_business_partner_request_http_total{outcome="success",instance="dev"}
        values: 0+10x15
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerRequestFailureRate",alertstate="firing"}
        eval_time: 15m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="BusinessPartnerRequestFailureRate",alertstate="firing",instance="dev",severity="critical",service="business-partner"}'
            value: 1
