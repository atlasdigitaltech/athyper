rule_files:
  - ../../operations/config/business-partner-rules.yaml
evaluation_interval: 30s
tests:
  # Proves the operations Prometheus's actual scrape job label ("athyper-instances",
  # via file_sd) matches the rule, and that aggregating `by (instance)` keeps a
  # healthy instance's "up" series from masking a failing one's.
  - interval: 1m
    input_series:
      - series: up{job="athyper-instances",instance="dev"}
        values: 1+0x5
      - series: up{job="athyper-instances",instance="qa"}
        values: 0+0x5
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerReadinessFailure",alertstate="firing"}
        eval_time: 3m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="BusinessPartnerReadinessFailure",alertstate="firing",instance="qa",severity="critical",service="business-partner"}'
            value: 1
  # Same proof for a rate-based aggregate: one instance well under threshold,
  # the other well over. A bare sum() would have blended them into one series
  # that might never cross 0.05 depending on relative volume.
  - interval: 1m
    input_series:
      - series: athyper_business_partner_mesh_delivery_total{operation="delivery",outcome="dead_letter",instance="dev"}
        values: 0+0x20
      - series: athyper_business_partner_mesh_delivery_total{operation="delivery",outcome="dead_letter",instance="qa"}
        values: 0+5x20
    promql_expr_test:
      - expr: ALERTS{alertname="BusinessPartnerDeliveryFailures",alertstate="firing"}
        eval_time: 16m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="BusinessPartnerDeliveryFailures",alertstate="firing",instance="qa",severity="warning",service="business-partner"}'
            value: 1
