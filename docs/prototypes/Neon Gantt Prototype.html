<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #faf9f5;
        color: #141413;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Neon Gantt Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Layout concept: Neon app shell (rail + top bar + Countries list header + toolbar) with the Board layout filling the list body; an inspector drawer exposes the published descriptor, findings, request budget and viewer simulation. */
      :root {
        --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
        --display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --bg: #f7f7f8;
        --surface: #fff;
        --surface2: #f0f0f2;
        --line: #e3e3e8;
        --fg: #16161a;
        --muted: #6a6a75;
        --accent: #16161a;
        --accent-fg: #fff;
        --accent-soft: #ececf0;
        --rail: #0b0b0d;
        --rail-fg: #e8e8ec;
        --top: #fff;
        --ok: #126b34;
        --ok-bg: #e3f4ea;
        --warn: #8a5200;
        --warn-bg: #fbefd6;
        --bad: #b02525;
        --bad-bg: #fbe4e4;
        --neu: #5c5c67;
        --neu-bg: #ececf0;
        --shadow:
          0 1px 2px rgba(20, 20, 30, 0.06), 0 4px 14px rgba(20, 20, 30, 0.06);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-neon]) {
          --bg: #0a1020;
          --surface: #111a2e;
          --surface2: #16213a;
          --line: #233252;
          --fg: #e9eefb;
          --muted: #93a1c0;
          --accent: #5b9bf0;
          --accent-fg: #06101f;
          --accent-soft: #18284a;
          --rail: #070c18;
          --rail-fg: #c9d4ec;
          --top: #0d1527;
          --ok: #4cc17e;
          --ok-bg: #12301f;
          --warn: #e8a93a;
          --warn-bg: #352a0f;
          --bad: #f07070;
          --bad-bg: #381616;
          --neu: #93a1c0;
          --neu-bg: #1a2644;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"]:not([data-neon]) {
        --bg: #0a1020;
        --surface: #111a2e;
        --surface2: #16213a;
        --line: #233252;
        --fg: #e9eefb;
        --muted: #93a1c0;
        --accent: #5b9bf0;
        --accent-fg: #06101f;
        --accent-soft: #18284a;
        --rail: #070c18;
        --rail-fg: #c9d4ec;
        --top: #0d1527;
        --ok: #4cc17e;
        --ok-bg: #12301f;
        --warn: #e8a93a;
        --warn-bg: #352a0f;
        --bad: #f07070;
        --bad-bg: #381616;
        --neu: #93a1c0;
        --neu-bg: #1a2644;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      :root[data-neon="ocean"] {
        --bg: #f3f6fb;
        --surface: #fff;
        --surface2: #eaeff8;
        --line: #d9e1f0;
        --fg: #13233f;
        --muted: #5d6e8e;
        --accent: #1d4f91;
        --accent-fg: #fff;
        --accent-soft: #e1ebfa;
        --rail: #102a52;
        --rail-fg: #dbe6fa;
        --top: #fff;
        color-scheme: light;
      }
      :root[data-neon="midnight"] {
        --bg: #0a1020;
        --surface: #111a2e;
        --surface2: #16213a;
        --line: #233252;
        --fg: #e9eefb;
        --muted: #93a1c0;
        --accent: #5b9bf0;
        --accent-fg: #06101f;
        --accent-soft: #18284a;
        --rail: #070c18;
        --rail-fg: #c9d4ec;
        --top: #0d1527;
        --ok: #4cc17e;
        --ok-bg: #12301f;
        --warn: #e8a93a;
        --warn-bg: #352a0f;
        --bad: #f07070;
        --bad-bg: #381616;
        --neu: #93a1c0;
        --neu-bg: #1a2644;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }
      :root[data-neon="graphite"] {
        --bg: #0c0c0d;
        --surface: #161617;
        --surface2: #1d1d1f;
        --line: #2a2a2d;
        --fg: #f0f0f2;
        --muted: #9a9aa3;
        --accent: #f0f0f2;
        --accent-fg: #0c0c0d;
        --accent-soft: #242427;
        --rail: #000;
        --rail-fg: #dcdce0;
        --top: #101011;
        --ok: #4cc17e;
        --ok-bg: #12301f;
        --warn: #e8a93a;
        --warn-bg: #352a0f;
        --bad: #f07070;
        --bad-bg: #381616;
        --neu: #9a9aa3;
        --neu-bg: #232326;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
      :root[data-neon="light"] {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.45;
        margin: 0;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .mono {
        font-family: var(--mono);
      }

      .app {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        min-height: 100%;
      }
      .rail {
        background: var(--rail);
        color: var(--rail-fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 12px 0;
        position: sticky;
        top: 0;
        height: 100vh;
        height: 100dvh;
      }
      .rail button {
        all: unset;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        cursor: pointer;
        opacity: 0.78;
      }
      .rail button:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.08);
      }
      .rail button[aria-current] {
        opacity: 1;
        background: rgba(255, 255, 255, 0.14);
      }
      .rail svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .rail .av {
        margin-top: auto;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #2c2c33;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
      }
      main {
        min-width: 0;
      }
      .top {
        background: var(--top);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 22px;
        line-height: 1;
      }
      .logo small {
        display: block;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: lowercase;
      }
      .tenant {
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .tenant span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .top .sp {
        flex: 1;
      }
      .themes {
        display: flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
      }
      .themes button {
        border: 0;
        background: transparent;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .themes button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .sw {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid rgba(128, 128, 128, 0.5);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 7px 12px;
        font-weight: 600;
        display: inline-flex;
        gap: 7px;
        align-items: center;
      }
      .btn:hover {
        background: var(--surface2);
      }
      .btn.pri {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: var(--accent);
      }
      .crumbs {
        padding: 10px 20px;
        color: var(--muted);
        font-size: 12.5px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .crumbs b {
        color: var(--fg);
        font-weight: 500;
      }
      .head {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--line);
      }
      .head .ic {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow);
      }
      .head h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .head p {
        margin: 2px 0 0;
        color: var(--muted);
      }
      .stage {
        padding: 16px 20px 40px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .toolbar {
        display: flex;
        gap: 10px;
        padding: 10px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        position: relative;
      }
      .toolbar .search {
        flex: 1 1 220px;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--bg);
      }
      .toolbar .search input {
        border: 0;
        background: transparent;
        outline: 0;
        padding: 9px 0;
        width: 100%;
        min-width: 0;
      }
      .toolbar .search:focus-within {
        outline: 2px solid var(--accent);
      }
      .kbd {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0 5px;
        color: var(--muted);
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 12px;
        font-weight: 600;
        background: var(--neu-bg);
        color: var(--neu);
      }
      .chip.success {
        background: var(--ok-bg);
        color: var(--ok);
      }
      .chip.warning {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .chip.danger {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--neu);
        flex: none;
      }
      .dot.success {
        background: var(--ok);
      }
      .dot.warning {
        background: var(--warn);
      }
      .dot.danger {
        background: var(--bad);
      }

      .pop {
        position: absolute;
        right: 10px;
        top: calc(100% + 6px);
        width: min(360px, calc(100vw - 32px));
        z-index: 20;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .pop h3 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .seg {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
        background: var(--bg);
      }
      .seg button {
        flex: 1;
        border: 0;
        background: transparent;
        border-radius: 6px;
        padding: 6px 8px;
        font-weight: 600;
        color: var(--muted);
      }
      .seg button[aria-checked="true"] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .seg button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        text-decoration: line-through;
        text-decoration-thickness: 1px;
      }
      .why {
        font-size: 12.5px;
        color: var(--muted);
        border-left: 3px solid var(--warn);
        padding: 2px 0 2px 10px;
        margin: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .why code,
      .code {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      select,
      .field {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 7px 9px;
        width: 100%;
      }

      .notice {
        margin: 10px;
        padding: 9px 12px;
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn);
        font-weight: 500;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .notice.info {
        background: var(--accent-soft);
        color: var(--fg);
      }
      .notice button {
        margin-left: auto;
        border: 1px solid currentColor;
        background: transparent;
        border-radius: 6px;
        padding: 3px 9px;
        font-weight: 600;
      }

      /* board */
      .board {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x proximity;
        padding: 12px;
        align-items: flex-start;
      }
      .lane {
        flex: 0 0 300px;
        scroll-snap-align: start;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        max-height: 640px;
        min-width: 0;
      }
      .lane.collapsed {
        flex-basis: 64px;
        align-items: center;
      }
      .lane.over {
        outline: 2px dashed var(--accent);
        outline-offset: 2px;
      }
      .lh {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 10px 10px 12px;
        position: sticky;
        top: 0;
        background: inherit;
        border-radius: 12px 12px 0 0;
        border-bottom: 1px solid var(--line);
        width: 100%;
      }
      .lh h2 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 650;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lane.collapsed .lh {
        flex-direction: column;
        border-bottom: 0;
        padding: 10px 4px;
      }
      .lane.collapsed .lh h2 {
        writing-mode: vertical-rl;
        flex: none;
        max-height: 220px;
      }
      .count {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 8px;
      }
      .lh .x {
        border: 0;
        background: transparent;
        border-radius: 6px;
        width: 26px;
        height: 26px;
        color: var(--muted);
      }
      .lh .x:hover {
        background: var(--surface);
      }
      .tag {
        font-size: 10px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
      }
      .lb {
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 60px;
      }
      .lane.collapsed .lb {
        display: none;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card[draggable="true"] {
        cursor: grab;
      }
      .card.drag {
        opacity: 0.4;
      }
      .card.flash {
        animation: flash 1.1s;
      }
      @keyframes flash {
        from {
          box-shadow: 0 0 0 3px var(--accent);
        }
        to {
          box-shadow: none;
        }
      }
      .comfy .card {
        padding: 12px 14px;
        gap: 9px;
      }
      .compact .card {
        padding: 7px 10px;
        gap: 4px;
      }
      .compact .card .meta,
      .compact .card .prog {
        display: none;
      }
      .card .t {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }
      .card .t b {
        font-size: 14.5px;
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .card .iso {
        font-family: var(--mono);
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0 5px;
        color: var(--muted);
        flex: none;
      }
      .meta {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 12.5px;
        margin: 0;
      }
      .meta dt {
        color: var(--muted);
      }
      .meta dd {
        margin: 0;
        text-align: end;
      }
      .prog {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .prog i {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: var(--surface2);
        overflow: hidden;
      }
      .prog i b {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
      }
      .lane.terminal .card {
        opacity: 0.82;
      }
      .more {
        border: 1px dashed var(--line);
        background: transparent;
        border-radius: 8px;
        padding: 7px;
        color: var(--muted);
        font-weight: 600;
      }
      .more:hover {
        color: var(--fg);
        border-color: var(--accent);
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 18px 8px;
        font-size: 12.5px;
      }
      .chips {
        display: none;
        gap: 6px;
        overflow-x: auto;
        padding: 10px 12px 0;
      }
      .chips button {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 10px;
        white-space: nowrap;
        font-weight: 600;
      }
      .chips button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .unmapped {
        margin: 0 12px 12px;
      }

      /* table + cards layouts */
      .tw {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 620px;
      }
      th {
        font-weight: 500;
        color: var(--muted);
        text-align: start;
        padding: 10px 14px;
        background: var(--surface2);
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 10px;
        padding: 12px;
      }

      /* inspector */
      .insp {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(480px, 100vw);
        background: var(--surface);
        border-inline-start: 1px solid var(--line);
        box-shadow: var(--shadow);
        z-index: 40;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.22s;
      }
      .insp.open {
        transform: none;
      }
      .insp header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .insp header b {
        flex: 1;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 6px 10px;
        border-radius: 7px;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }
      .tabs button[aria-selected="true"] {
        background: var(--accent-soft);
        color: var(--fg);
      }
      .ib {
        padding: 14px;
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      pre {
        margin: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.5;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
      }
      .find {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .find .code {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .find small {
        display: block;
        color: var(--muted);
        font-family: var(--font);
      }
      .tog {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .tog input {
        margin-top: 3px;
        accent-color: var(--accent);
      }
      .tog small {
        display: block;
        color: var(--muted);
      }
      .live {
        position: absolute;
        left: -9999px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: var(--fg);
        color: var(--bg);
        padding: 9px 14px;
        border-radius: 9px;
        font-weight: 600;
        z-index: 60;
        max-width: calc(100vw - 32px);
      }
      @media (max-width: 700px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          display: none;
        }
        .top,
        .crumbs,
        .head,
        .stage {
          padding-inline: 16px;
        }
        .stage {
          padding-top: 12px;
        }
        .head h1 {
          font-size: 24px;
        }
        .themes span.l {
          display: none;
        }
        .chips {
          display: flex;
        }
        .lane {
          flex-basis: 100%;
        }
        .board {
          padding: 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ---- design pass ---- */
      .t-success {
        --tone: var(--ok);
        --tone-bg: var(--ok-bg);
      }
      .t-warning {
        --tone: var(--warn);
        --tone-bg: var(--warn-bg);
      }
      .t-danger {
        --tone: var(--bad);
        --tone-bg: var(--bad-bg);
      }
      .t-neutral {
        --tone: var(--neu);
        --tone-bg: var(--neu-bg);
      }
      body {
        background:
          radial-gradient(
            1100px 380px at 12% -80px,
            var(--accent-soft),
            transparent 70%
          ),
          var(--bg);
        background-color: var(--bg);
      }
      .head {
        border-bottom: 0;
        padding-bottom: 6px;
      }
      .head h1,
      .logo {
        font-family: var(--display);
        letter-spacing: -0.025em;
      }
      .head h1 {
        font-size: 36px;
        font-weight: 700;
      }
      .head .ic {
        background: linear-gradient(145deg, var(--surface), var(--accent-soft));
        border-radius: 16px;
      }
      .panel {
        border-radius: 16px;
      }
      .toolbar {
        padding: 12px;
      }
      .toolbar .seg {
        flex: none;
      }
      .toolbar .seg button {
        padding: 6px 14px;
      }
      .dist {
        padding: 14px 14px 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .dist .bar {
        display: flex;
        gap: 3px;
        height: 10px;
      }
      .dist .bar i {
        border-radius: 5px;
        background: var(--tone);
        min-width: 6px;
        transition: flex 0.4s;
      }
      .dist .leg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .dist .leg span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .dist .leg b {
        color: var(--fg);
        font-weight: 600;
      }
      .dist .leg span:first-child {
        margin-inline-end: auto;
      }
      .board {
        padding: 14px;
        gap: 14px;
        scrollbar-width: thin;
      }
      .lane {
        background: color-mix(in srgb, var(--tone) 7%, var(--surface2));
        border-color: color-mix(in srgb, var(--tone) 22%, var(--line));
        border-radius: 16px;
        box-shadow: inset 0 3px 0 var(--tone);
      }
      .lh {
        padding: 14px 12px 10px 14px;
        border-bottom: 0;
      }
      .lh h2 {
        font-family: var(--display);
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .count {
        background: var(--tone-bg);
        color: var(--tone);
        border-color: transparent;
        font-weight: 600;
        padding: 1px 9px;
      }
      .lb {
        padding: 2px 10px 12px;
        gap: 10px;
      }
      .card {
        border-radius: 12px;
        border-color: transparent;
        box-shadow:
          0 1px 2px rgba(20, 20, 30, 0.07),
          0 0 0 1px var(--line);
        transition:
          transform 0.16s,
          box-shadow 0.16s;
        animation: rise 0.35s both;
        gap: 10px;
      }
      .card:hover,
      .card:focus-visible {
        transform: translateY(-2px);
        box-shadow:
          0 6px 16px rgba(20, 20, 30, 0.12),
          0 0 0 1.5px var(--accent);
      }
      @keyframes rise {
        from {
          opacity: 0.001;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card .t {
        justify-content: flex-start;
        align-items: center;
        gap: 11px;
      }
      .tile {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-weight: 500;
        font-size: 12.5px;
        background: var(--tone-bg);
        color: var(--tone);
        flex: none;
        letter-spacing: 0.02em;
      }
      .nm {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .nm b {
        font-size: 14.5px;
        font-weight: 650;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .nm small {
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip.mono {
        font-family: var(--mono);
        font-weight: 500;
        background: var(--surface2);
        color: var(--muted);
      }
      .prog i {
        height: 4px;
      }
      .prog i b {
        background: linear-gradient(
          90deg,
          var(--accent),
          color-mix(in srgb, var(--accent) 55%, var(--tone, var(--accent)))
        );
      }
      .prog span:last-child {
        font-size: 11px;
      }
      .compact .card .row,
      .compact .card .prog {
        display: none;
      }
      .compact .tile {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 11px;
      }
      .comfy .card {
        padding: 13px 14px;
      }
      .more {
        border-radius: 10px;
        border-style: solid;
        border-color: var(--line);
        background: var(--surface);
      }
      .chips {
        padding-top: 12px;
      }
      th {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .themes {
        box-shadow: var(--shadow);
      }

      /* ---- calendar ---- */
      .calnav {
        display: flex;
        gap: 10px 14px;
        align-items: center;
        flex-wrap: wrap;
        padding: 16px 14px 6px;
      }
      .calnav h2 {
        font-family: var(--display);
        font-size: 24px;
        margin: 0;
        letter-spacing: -0.025em;
        flex: 1 1 180px;
        min-width: 0;
      }
      .calnav .grp {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .iconbtn {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 9px;
        font-size: 16px;
        line-height: 1;
      }
      .iconbtn:hover {
        background: var(--surface2);
      }
      [dir="rtl"] .mir {
        display: inline-block;
        transform: scaleX(-1);
      }
      .seg.sm button {
        padding: 4px 12px;
      }
      .cal {
        padding: 8px 14px 14px;
      }
      .cal .wd,
      .wk {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
      .wd {
        border-bottom: 1px solid var(--line);
      }
      .wd span {
        padding: 6px 8px;
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      .cgrid {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface);
      }
      .cgrid .wd {
        background: var(--surface2);
      }
      .wk {
        grid-template-rows: 30px repeat(3, 25px) 22px;
        row-gap: 2px;
        border-top: 1px solid var(--line);
        padding-bottom: 4px;
      }
      .wk:first-of-type {
        border-top: 0;
      }
      .day {
        grid-row: 1/6;
        border-inline-start: 1px solid var(--line);
        padding: 4px 6px;
        cursor: pointer;
        min-width: 0;
      }
      .day.c0 {
        border-inline-start: 0;
      }
      .day:hover {
        background: var(--accent-soft);
      }
      .day.out {
        background: color-mix(in srgb, var(--surface2) 55%, transparent);
      }
      .day.out .dn {
        color: var(--muted);
        font-weight: 500;
      }
      .dn {
        display: inline-grid;
        place-items: center;
        min-width: 24px;
        height: 24px;
        border-radius: 12px;
        font-weight: 650;
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        padding: 0 4px;
      }
      .day.today .dn {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .day:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        z-index: 3;
      }
      .ev {
        z-index: 2;
        margin-inline: 4px;
        border: 0;
        text-align: start;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 7px;
        border-radius: 7px;
        background: var(--tone-bg);
        color: var(--fg);
        border-inline-start: 3px solid var(--tone);
        font-size: 12px;
        font-weight: 600;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        cursor: pointer;
        height: 23px;
        align-self: center;
      }
      .ev .l {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        flex: 1;
      }
      .ev .tm {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 10.5px;
        color: var(--muted);
      }
      .ev.cl {
        border-start-start-radius: 0;
        border-end-start-radius: 0;
        margin-inline-start: 0;
        border-inline-start-width: 0;
      }
      .ev.cr {
        border-start-end-radius: 0;
        border-end-end-radius: 0;
        margin-inline-end: 0;
      }
      .ev.cl::before,
      .ev.cr::after {
        display: inline-block;
        color: var(--tone);
        font-weight: 700;
      }
      .ev.cl::before {
        content: "\2039";
      }
      .ev.cr::after {
        content: "\203A";
      }
      .ev .arr {
        color: var(--tone);
        font-weight: 700;
        display: inline-block;
      }
      [dir="rtl"] .ev.cl::before,
      [dir="rtl"] .ev.cr::after,
      [dir="rtl"] .ev .arr {
        transform: scaleX(-1);
      }
      .ev:hover {
        box-shadow: 0 0 0 1.5px var(--tone);
      }
      .ev.open {
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0 7px,
          color-mix(in srgb, var(--tone) 12%, transparent) 7px 9px
        );
      }
      .mored {
        z-index: 2;
        grid-row: 5;
        margin-inline: 4px;
        border: 0;
        background: transparent;
        color: var(--fg);
        font-weight: 650;
        font-size: 12px;
        text-align: start;
        padding: 0 6px;
        cursor: pointer;
        border-radius: 6px;
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-color: var(--line);
      }
      .mored:hover {
        background: var(--accent-soft);
      }
      .when {
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .when b {
        color: var(--fg);
        font-weight: 600;
      }
      .ecard {
        cursor: default;
      }
      .ag {
        padding: 6px 14px 14px;
      }
      .agd {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: var(--surface);
        z-index: 4;
        padding: 12px 0 7px;
        font-family: var(--display);
        font-weight: 650;
        font-size: 15.5px;
        display: flex;
        gap: 8px;
        align-items: baseline;
        border-bottom: 1px solid var(--line);
        margin-top: 6px;
      }
      .agd small {
        color: var(--muted);
        font-family: var(--font);
        font-weight: 500;
        font-size: 12.5px;
      }
      .agd .today-tag {
        font-family: var(--font);
        font-size: 11px;
        font-weight: 650;
        background: var(--accent);
        color: var(--accent-fg);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .agl {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
        padding-top: 10px;
      }
      .tray {
        margin: 0 14px 14px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .tray > button.th {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        padding: 11px 14px;
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
        font-weight: 650;
        border-radius: 12px;
      }
      .tray > button.th:focus-visible {
        outline: 2px solid var(--accent);
      }
      .tray .tb {
        padding: 0 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tray .agl {
        padding-top: 0;
      }
      .nothing {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }
      .nothing b {
        display: block;
        color: var(--fg);
        font-family: var(--display);
        font-size: 18px;
        margin-bottom: 4px;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 20, 0.45);
        z-index: 55;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .dlg {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        width: min(470px, 100%);
        max-height: min(82vh, 680px);
        display: flex;
        flex-direction: column;
      }
      .dlg header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--line);
      }
      .dlg header b {
        flex: 1;
        font-family: var(--display);
        font-size: 16px;
      }
      .dlgb {
        padding: 12px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ctable td.mono,
      .ctable .mono {
        font-variant-numeric: tabular-nums;
      }
      .pass {
        color: var(--ok);
      }
      .fail {
        color: var(--bad);
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .dstnote {
        font-size: 12.5px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn);
        font-weight: 550;
      }
      .cap {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .rec {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .rec b {
        font-size: 13px;
      }
      .rec span {
        color: var(--muted);
        font-size: 12.5px;
      }
      @media (max-width: 700px) {
        .calnav h2 {
          font-size: 20px;
        }
        .agl {
          grid-template-columns: minmax(0, 1fr);
        }
        .cal,
        .ag {
          padding-inline: 12px;
        }
      }

      /* ---- gantt ---- */
      :root {
        --gantt-label-width: 12rem;
        --gantt-min-column: 0.75rem;
        --gantt-row: 38px;
        --gantt-bar: 14px;
      }
      .compact {
        --gantt-row: 28px;
        --gantt-bar: 10px;
      }
      .gantt {
        padding: 6px 14px 0;
      }
      .gscroll {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .gin {
        min-width: calc(
          var(--gantt-label-width) + var(--ncols, 12) * var(--gantt-min-column)
        );
      }
      .gh {
        display: grid;
        grid-template-columns: var(--gantt-label-width) minmax(0, 1fr);
        background: var(--surface2);
        border-bottom: 1px solid var(--line);
      }
      .gh .gl {
        background: var(--surface2);
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .gl {
        position: sticky;
        inset-inline-start: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px 0 12px;
        background: var(--surface);
        border-inline-end: 1px solid var(--line);
        min-width: 0;
      }
      .gax {
        position: relative;
        height: 54px;
      }
      .t1,
      .t2 {
        position: absolute;
        inset-inline: 0;
        height: 27px;
      }
      .t1 {
        top: 0;
        border-bottom: 1px solid var(--line);
      }
      .t2 {
        top: 27px;
      }
      .hc {
        position: absolute;
        top: 0;
        bottom: 0;
        border-inline-start: 1px solid var(--line);
        font-size: 10.5px;
        display: flex;
        align-items: center;
        padding-inline: 3px;
        overflow: hidden;
        white-space: nowrap;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .t1 .hc {
        font-weight: 650;
        color: var(--fg);
        font-size: 12px;
        padding-inline: 8px;
      }
      .tl-tag {
        position: absolute;
        top: 2px;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 650;
        background: var(--accent);
        color: var(--accent-fg);
        border-radius: 999px;
        padding: 0 7px;
        z-index: 3;
      }
      [dir="rtl"] .tl-tag {
        transform: translateX(50%);
      }
      .gbody {
        position: relative;
      }
      .gover {
        position: absolute;
        top: 0;
        bottom: 0;
        inset-inline-start: var(--gantt-label-width);
        inset-inline-end: 0;
        pointer-events: none;
      }
      .gover i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-inline-start: 1px solid
          color-mix(in srgb, var(--line) 65%, transparent);
      }
      .gover .today {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-inline-start: -1px;
        background: var(--accent);
        opacity: 0.85;
      }
      .gr {
        display: grid;
        grid-template-columns: var(--gantt-label-width) minmax(0, 1fr);
        border-bottom: 1px solid
          color-mix(in srgb, var(--line) 70%, transparent);
        min-height: var(--gantt-row);
        position: relative;
      }
      .gr:hover .gl,
      .gr:focus-visible .gl {
        background: var(--accent-soft);
      }
      .gr:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;

          [
            "Approve as written",
            "P-G1, P-G2, P-G3, the contract (decision 3), milestones, the ceiling constant, and independent date-range declarations. The two-commit split and the identifier maps give a reviewable diff.",
          ],
          [
            "Gap · tone is the only status signal on a bar",
            "Bars carry no text, yet the blueprint says tone is never the only signal. The prototype adds a status dot and hidden status text to the row label. Add that to section 8.",
          ],
          [
            "Gap · short bars vanish at Year zoom",
            "Geometry is day-based, so one day is about 1/365 of the axis, roughly 1px. Section 8 sets a minimum column, not a minimum bar. The prototype enforces a 6px minimum bar and a fixed-size milestone. Add a minimum bar width as a third local constant.",
          ],
          [
            "Ambiguity · “upper tier names months (or quarters, or years)”",
            "It does not say which zoom shows which tier. The prototype uses month names above week columns at Quarter, month and year above days at Month, and quarters above months at Year. State this in section 8.",
          ],
          [
            "Risk · the start-ordered prefix at the ceiling",
            "Old long-running records can use rows that in-window records need. The prototype tests a cheap remedy: the ceiling notice offers “Only records starting in this period”, which adds start gte windowStart and drops the open-ended stream. It is a filter change with no new contract.",
          ],
          [
            "Clarify · Quarter window title and step",
            "The window is widened to whole weeks, so it can show days from the neighbouring quarter. Title it by the quarter (Q4 2026), as the prototype does, and say that rows from the widened days belong to the window.",
          ],
          [
            "Clarify · zero-length datetime at the window start",
            "A datetime range with end = start exactly at windowStart is excluded by end gt windowStart. Either use gte for zero-length points or state the edge case in section 7.",
          ],
          [
            "Keep · group counts only when complete",
            "Good rule. The prototype shows group counts only under exact counts with every row loaded, so a count is never partial.",
          ],
          [
            "Pilot data",
            "Updated at alone draws only milestones, as the blueprint says. This prototype adds illustrative Review period and Sync window fields so bars, open-ended, tray and zero-length cases can be judged. Real pilots wait for project-management onboarding.",
          ],
        ];
        function reviewTab() {
          return REVIEW.map(function (x) {
            return (
              '<div class="rec"><b>' +
              esc(x[0]) +
              "</b><span>" +
              esc(x[1]) +
              "</span></div>"
            );
          }).join("");
        }
        var DEC = [
          [
            "1 · P-G1 shared module",
            "Approve. Verify the diff against the identifier maps.",
          ],
          [
            "2 · P-G2 date-scale",
            "Approve. Add leap-year and DST-week tests as stated.",
          ],
          [
            "3 · Runtime contract",
            "Approve. Label from identity and title adds no property.",
          ],
          ["4 · Zoom set", "Approve. State the tier rules (see Review)."],
          [
            "5 · Row ceiling 500",
            "Approve, and consider the “starts in this period” remedy in the notice.",
          ],
          [
            "6 · Declared milestones",
            "Approve. It avoids guessing from start = end.",
          ],
          [
            "7 · Group and progress",
            "Approve, with the “Unmapped values” group as written.",
          ],
          [
            "8 · Authoring storage",
            "Agree with the shared entity_surface_date_range table, decided before Calendar authoring is built.",
          ],
          ["9 · Phase 1 scope", "Approve read-only."],
          ["10 · Fixtures", "Approve."],
          ["11 · AGENTS.md pointer", "Approve."],
          [
            "12 · P-G3 progress reader",
            "Approve, with a release note: blank progress text becomes an empty value instead of 0% on Table, Cards, Board and Calendar.",
          ],
        ];
        function decisionsTab() {
          return DEC.map(function (x) {
            return (
              '<div class="rec"><b>' +
              esc(x[0]) +
              "</b><span>" +
              esc(x[1]) +
              "</span></div>"
            );
          }).join("");
        }
        function renderInsp() {
          $("insp").classList.toggle("open", S.insp);
          $("openInsp").setAttribute("aria-expanded", S.insp);
          $("tabs").innerHTML = TABS.map(function (t) {
            return (
              '<button role="tab" data-act="tab" data-v="' +
              t +
              '" aria-selected="' +
              (S.tab === t) +
              '">' +
              t +
              "</button>"
            );
          }).join("");
          var h = "";
          if (S.tab === "Review") h = reviewTab();
          if (S.tab === "Descriptor") {
            var d = descriptor();
            h =
              '<p style="margin:0;color:var(--muted)">Published descriptor for this viewer. The anchor lives in the URL only.</p><pre>' +
              esc(JSON.stringify(d.d, null, 1)) +
              "</pre><b>Saved view</b><pre>" +
              esc(JSON.stringify(d.saved, null, 1)) +
              "</pre><b>Location (URL)</b><pre>" +
              esc(d.url) +
              "</pre>";
          }
          if (S.tab === "Queries") h = queriesTab();
          if (S.tab === "Findings") h = findingsTab();
          if (S.tab === "Simulate") h = simulateTab();
          if (S.tab === "Decisions") h = decisionsTab();
          var keep = $("ib").scrollTop;
          $("ib").innerHTML = h;
          $("ib").scrollTop = keep;
        }
        function render() {
          S.notes = [];
          var m = G.effMode();
          renderThemes();
          $("recCount").textContent =
            "247 records · demo fixture of " + G.ROWS.length + " countries";
          if (m !== "gantt") G.last = null;
          var html =
            m === "gantt" ? V.gantt() : m === "cards" ? V.cards() : V.table();
          $("body").innerHTML = html;
          $("body").className = S.density === "compact" ? "compact" : "";
          $("notices").innerHTML = S.notes
            .map(function (n) {
              return '<div class="notice" role="status">' + esc(n) + "</div>";
            })
            .join("");
          $("popHost").innerHTML = V.pop();
          $("quick").innerHTML = modeBtns(m, false);
          renderPop();
          renderInsp();
          if (m === "gantt" && G.last)
            announce(
              "Gantt, " + G.last.W.title + ", " + G.last.drawn.length + " rows",
            );
          if (S.dayPop) {
            var b = $("dlgClose");
            if (b) b.focus();
          } else if (S.refocus) {
            var el = document.querySelector(S.refocus);
            S.refocus = null;
            if (el) el.focus();
          }
        }
        /* ---- events ---- */
        document.addEventListener("click", function (e) {
          var b = e.target.closest("[data-act]");
          if (!b) {
            if (
              S.pop &&
              !e.target.closest("#pop") &&
              !e.target.closest("#ctlBtn")
            ) {
              S.pop = false;
              renderPop();
            }
            return;
          }
          var a = b.dataset.act,
            v = b.dataset.v;
          if (a === "scrim") {
            if (e.target !== b) return;
            a = "closepop";
          }
          if (a === "theme") {
            S.theme = v;
            render();
          } else if (a === "mode") {
            S.mode = v;
            render();
          } else if (a === "density") {
            S.density = v;
            render();
          } else if (a === "prev" || a === "next") {
            G.stepAnchor(a === "next" ? 1 : -1);
            render();
          } else if (a === "today") {
            S.anchor = G.TODAY;
            S.pages = 1;
            render();
          } else if (a === "zoom") {
            S.zoom = v;
            S.pages = 1;
            render();
          } else if (a === "field") {
            S.field = v;
            S.pages = 1;
            S.trayPages = 1;
            render();
          } else if (a === "more") {
            S.pages++;
            render();
            announce("More rows loaded");
          } else if (a === "startsonly") {
            S.startsOnly = !S.startsOnly;
            S.pages = 1;
            render();
          } else if (a === "grp") {
            S.collapsed[v] = !S.collapsed[v];
            S.refocus = '.gt[data-v="' + v + '"]';
            render();
          } else if (a === "rec") {
            S.dayPop = +b.dataset.rid;
            render();
          } else if (a === "closepop") {
            var rid = S.dayPop;
            S.dayPop = null;
            S.refocus = '.gr[data-rid="' + rid + '"]';
            render();
          } else if (a === "tray") {
            S.trayOpen = !S.trayOpen;
            render();
          } else if (a === "traymore") {
            S.trayPages++;
            render();
          } else if (a === "tab") {
            S.tab = v;
            renderInsp();
          }
        });
        $("ctlBtn").addEventListener("click", function (e) {
          e.stopPropagation();
          S.pop = !S.pop;
          renderPop();
        });
        $("openInsp").addEventListener("click", function () {
          S.insp = !S.insp;
          renderInsp();
        });
        $("closeInsp").addEventListener("click", function () {
          S.insp = false;
          renderInsp();
        });
        $("viewBtn").addEventListener("click", function () {
          toast(
            "System default view. A saved view keeps the date range and zoom, never the anchor.",
          );
        });
        $("filtersBtn").addEventListener("click", function () {
          toast(
            "Filters apply to Gantt unchanged: every stream is the list query AND its date filters.",
          );
        });
        $("q").addEventListener("input", function (e) {
          S.q = e.target.value;
          S.pages = 1;
          S.trayPages = 1;
          render();
          $("q").focus();
        });
        document.addEventListener("change", function (e) {
          var t = e.target,
            m = {
              sCl: "lowCeil",
              sEx: "exact",
              sMg: "maskGroup",
              sMp: "maskProgress",
              sMt: "maskTone",
              sMr: "maskReview",
              sMs: "maskSync",
              sMu: "maskUpd",
              sWk: "savedWeek",
              sRtl: "rtl",
            };
          if (m[t.id]) {
            S.sim[m[t.id]] = t.checked;
            S.pages = 1;
            render();
          } else if (t.id === "sPg") {
            S.sim.page = +t.value;
            S.pages = 1;
            render();
          } else if (t.id === "sTz") {
            S.tz = t.value;
            render();
          } else if (t.id === "sWs") {
            S.ws = +t.value;
            render();
          } else if (t.id === "sLoc") {
            S.loc = t.value;
            render();
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            if (S.dayPop) {
              var rid = S.dayPop;
              S.dayPop = null;
              S.refocus = '.gr[data-rid="' + rid + '"]';
              render();
            } else if (S.pop) {
              S.pop = false;
              renderPop();
              $("ctlBtn").focus();
            } else if (S.insp) {
              S.insp = false;
              renderInsp();
            }
            return;
          }
          if (
            e.key === "/" &&
            !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)
          ) {
            e.preventDefault();
            $("q").focus();
            return;
          }
          var row = e.target.closest && e.target.closest(".gr");
          if (row && e.target === row) {
            var rows = [].slice.call(document.querySelectorAll(".gr")),
              i = rows.indexOf(row),
              n = null;
            if (e.key === "ArrowDown") n = rows[i + 1];
            else if (e.key === "ArrowUp") n = rows[i - 1];
            else if (e.key === "Home") n = rows[0];
            else if (e.key === "End") n = rows[rows.length - 1];
            else if (e.key === "Enter") {
              e.preventDefault();
              S.dayPop = +row.dataset.rid;
              render();
              return;
            } else if (e.key === "PageDown" || e.key === "PageUp") {
              e.preventDefault();
              G.stepAnchor(e.key === "PageDown" ? 1 : -1);
              render();
              return;
            }
            if (n) {
              e.preventDefault();
              rows.forEach(function (r) {
                r.tabIndex = -1;
              });
              n.tabIndex = 0;
              n.focus();
            }
          }
        });
        function measure() {
          var w = $("body").parentNode.getBoundingClientRect().width,
            nb = w < 640;
          if (nb !== S.narrowBox) {
            S.narrowBox = nb;
            render();
          }
        }
        if (window.ResizeObserver)
          new ResizeObserver(measure).observe($("body").parentNode);
        $("rail").innerHTML =
          ICONS.map(function (p, i) {
            return (
              '<button aria-label="Section ' +
              (i + 1) +
              '"' +
              (i === 2 ? ' aria-current="page"' : "") +
              '><svg viewBox="0 0 24 24"><path d="' +
              p +
              '"/></svg></button>'
            );
          }).join("") + '<div class="av">CA</div>';
        S.narrowBox =
          $("body").parentNode.getBoundingClientRect().width < 640 &&
          $("body").parentNode.getBoundingClientRect().width > 0;
        S.tab = "Review";
        render();
      })();
    </script>
  </body>
</html>
