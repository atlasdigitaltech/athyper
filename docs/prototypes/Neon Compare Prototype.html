<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neon Compare Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: Neon app shell with Compare as a selection action opening an in-page comparison panel over four scenarios; inspector drawer for review, descriptor, request budget, findings and viewer simulation. */
:root{
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --bg:#f7f7f8;--surface:#fff;--surface2:#f0f0f2;--line:#e3e3e8;--fg:#16161a;--muted:#6a6a75;
  --accent:#16161a;--accent-fg:#fff;--accent-soft:#ececf0;--rail:#0b0b0d;--rail-fg:#e8e8ec;--top:#fff;
  --ok:#126b34;--ok-bg:#e3f4ea;--warn:#8a5200;--warn-bg:#fbefd6;--bad:#b02525;--bad-bg:#fbe4e4;--neu:#5c5c67;--neu-bg:#ececf0;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 14px rgba(20,20,30,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-neon]){
  --bg:#0a1020;--surface:#111a2e;--surface2:#16213a;--line:#233252;--fg:#e9eefb;--muted:#93a1c0;
  --accent:#5b9bf0;--accent-fg:#06101f;--accent-soft:#18284a;--rail:#070c18;--rail-fg:#c9d4ec;--top:#0d1527;
  --ok:#4cc17e;--ok-bg:#12301f;--warn:#e8a93a;--warn-bg:#352a0f;--bad:#f07070;--bad-bg:#381616;--neu:#93a1c0;--neu-bg:#1a2644;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]:not([data-neon]){
  --bg:#0a1020;--surface:#111a2e;--surface2:#16213a;--line:#233252;--fg:#e9eefb;--muted:#93a1c0;
  --accent:#5b9bf0;--accent-fg:#06101f;--accent-soft:#18284a;--rail:#070c18;--rail-fg:#c9d4ec;--top:#0d1527;
  --ok:#4cc17e;--ok-bg:#12301f;--warn:#e8a93a;--warn-bg:#352a0f;--bad:#f07070;--bad-bg:#381616;--neu:#93a1c0;--neu-bg:#1a2644;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
:root[data-neon="ocean"]{
  --bg:#f3f6fb;--surface:#fff;--surface2:#eaeff8;--line:#d9e1f0;--fg:#13233f;--muted:#5d6e8e;
  --accent:#1d4f91;--accent-fg:#fff;--accent-soft:#e1ebfa;--rail:#102a52;--rail-fg:#dbe6fa;--top:#fff;color-scheme:light}
:root[data-neon="midnight"]{
  --bg:#0a1020;--surface:#111a2e;--surface2:#16213a;--line:#233252;--fg:#e9eefb;--muted:#93a1c0;
  --accent:#5b9bf0;--accent-fg:#06101f;--accent-soft:#18284a;--rail:#070c18;--rail-fg:#c9d4ec;--top:#0d1527;
  --ok:#4cc17e;--ok-bg:#12301f;--warn:#e8a93a;--warn-bg:#352a0f;--bad:#f07070;--bad-bg:#381616;--neu:#93a1c0;--neu-bg:#1a2644;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
:root[data-neon="graphite"]{
  --bg:#0c0c0d;--surface:#161617;--surface2:#1d1d1f;--line:#2a2a2d;--fg:#f0f0f2;--muted:#9a9aa3;
  --accent:#f0f0f2;--accent-fg:#0c0c0d;--accent-soft:#242427;--rail:#000;--rail-fg:#dcdce0;--top:#101011;
  --ok:#4cc17e;--ok-bg:#12301f;--warn:#e8a93a;--warn-bg:#352a0f;--bad:#f07070;--bad-bg:#381616;--neu:#9a9aa3;--neu-bg:#232326;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);color-scheme:dark}
:root[data-neon="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}

.app{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;position:sticky;top:0;height:100vh;height:100dvh}
.rail button{all:unset;width:38px;height:38px;display:grid;place-items:center;border-radius:9px;cursor:pointer;opacity:.78}
.rail button:hover{opacity:1;background:rgba(255,255,255,.08)}
.rail button[aria-current]{opacity:1;background:rgba(255,255,255,.14)}
.rail svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .av{margin-top:auto;width:34px;height:34px;border-radius:50%;background:#2c2c33;display:grid;place-items:center;font-size:12px;font-weight:600}
main{min-width:0}
.top{background:var(--top);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.04em;font-size:22px;line-height:1}
.logo small{display:block;font-size:9px;font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:lowercase}
.tenant{font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.tenant span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.themes{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.themes button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.themes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(128,128,128,.5)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.crumbs{padding:10px 20px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);background:var(--bg)}
.crumbs b{color:var(--fg);font-weight:500}
.head{display:flex;gap:16px;align-items:center;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.head .ic{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.head h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--muted)}
.stage{padding:16px 20px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;padding:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);position:relative}
.toolbar .search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.toolbar .search input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;min-width:0}
.toolbar .search:focus-within{outline:2px solid var(--accent)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--neu-bg);color:var(--neu)}
.chip.success{background:var(--ok-bg);color:var(--ok)}.chip.warning{background:var(--warn-bg);color:var(--warn)}.chip.danger{background:var(--bad-bg);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neu);flex:none}
.dot.success{background:var(--ok)}.dot.warning{background:var(--warn)}.dot.danger{background:var(--bad)}

.pop{position:absolute;right:10px;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));z-index:20;padding:14px;display:flex;flex-direction:column;gap:14px}
.pop h3{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;background:var(--bg)}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through;text-decoration-thickness:1px}
.why{font-size:12.5px;color:var(--muted);border-left:3px solid var(--warn);padding:2px 0 2px 10px;margin:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.why code,.code{font-family:var(--mono);font-size:11.5px}
select,.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%}

.notice{margin:10px;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.info{background:var(--accent-soft);color:var(--fg)}
.notice button{margin-left:auto;border:1px solid currentColor;background:transparent;border-radius:6px;padding:3px 9px;font-weight:600}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:12px;align-items:flex-start}
.lane{flex:0 0 300px;scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:640px;min-width:0}
.lane.collapsed{flex-basis:64px;align-items:center}
.lane.over{outline:2px dashed var(--accent);outline-offset:2px}
.lh{display:flex;gap:8px;align-items:center;padding:10px 10px 10px 12px;position:sticky;top:0;background:inherit;border-radius:12px 12px 0 0;border-bottom:1px solid var(--line);width:100%}
.lh h2{margin:0;font-size:13.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane.collapsed .lh{flex-direction:column;border-bottom:0;padding:10px 4px}
.lane.collapsed .lh h2{writing-mode:vertical-rl;flex:none;max-height:220px}
.count{font-family:var(--mono);font-weight:500;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.lh .x{border:0;background:transparent;border-radius:6px;width:26px;height:26px;color:var(--muted)}
.lh .x:hover{background:var(--surface)}
.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.lb{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.lane.collapsed .lb{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.card:hover{border-color:var(--accent)}
.card[draggable="true"]{cursor:grab}
.card.drag{opacity:.4}
.card.flash{animation:flash 1.1s}
@keyframes flash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:none}}
.comfy .card{padding:12px 14px;gap:9px}
.compact .card{padding:7px 10px;gap:4px}
.compact .card .meta,.compact .card .prog{display:none}
.card .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.card .t b{font-size:14.5px;font-weight:650;overflow-wrap:anywhere}
.card .iso{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);flex:none}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:0}
.meta dt{color:var(--muted)}.meta dd{margin:0;text-align:end}
.prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--accent);border-radius:3px}
.lane.terminal .card{opacity:.82}
.more{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;color:var(--muted);font-weight:600}
.more:hover{color:var(--fg);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:12.5px}
.chips{display:none;gap:6px;overflow-x:auto;padding:10px 12px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;white-space:nowrap;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.unmapped{margin:0 12px 12px}

/* table + cards layouts */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th{font-weight:500;color:var(--muted);text-align:start;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:12px}

/* inspector */
.insp{position:fixed;inset:0 0 0 auto;width:min(480px,100vw);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s}
.insp.open{transform:none}
.insp header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.insp header b{flex:1}
.tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg)}
.ib{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
.find{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.find .code{flex:1;overflow-wrap:anywhere}
.find small{display:block;color:var(--muted);font-family:var(--font)}
.tog{display:flex;gap:10px;align-items:flex-start}
.tog input{margin-top:3px;accent-color:var(--accent)}
.tog small{display:block;color:var(--muted)}
.live{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;z-index:60;max-width:calc(100vw - 32px)}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .top,.crumbs,.head,.stage{padding-inline:16px}.stage{padding-top:12px}
  .head h1{font-size:24px}.themes span.l{display:none}
  .chips{display:flex}
  .lane{flex-basis:100%}
  .board{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- design pass ---- */
.t-success{--tone:var(--ok);--tone-bg:var(--ok-bg)}.t-warning{--tone:var(--warn);--tone-bg:var(--warn-bg)}.t-danger{--tone:var(--bad);--tone-bg:var(--bad-bg)}.t-neutral{--tone:var(--neu);--tone-bg:var(--neu-bg)}
body{background:radial-gradient(1100px 380px at 12% -80px,var(--accent-soft),transparent 70%),var(--bg);background-color:var(--bg)}
.head{border-bottom:0;padding-bottom:6px}
.head h1,.logo{font-family:var(--display);letter-spacing:-.025em}
.head h1{font-size:36px;font-weight:700}
.head .ic{background:linear-gradient(145deg,var(--surface),var(--accent-soft));border-radius:16px}
.panel{border-radius:16px}
.toolbar{padding:12px}
.toolbar .seg{flex:none}
.toolbar .seg button{padding:6px 14px}
.dist{padding:14px 14px 0;display:flex;flex-direction:column;gap:9px}
.dist .bar{display:flex;gap:3px;height:10px}
.dist .bar i{border-radius:5px;background:var(--tone);min-width:6px;transition:flex .4s}
.dist .leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.dist .leg span{display:inline-flex;gap:6px;align-items:center}
.dist .leg b{color:var(--fg);font-weight:600}
.dist .leg span:first-child{margin-inline-end:auto}
.board{padding:14px;gap:14px;scrollbar-width:thin}
.lane{background:color-mix(in srgb,var(--tone) 7%,var(--surface2));border-color:color-mix(in srgb,var(--tone) 22%,var(--line));border-radius:16px;box-shadow:inset 0 3px 0 var(--tone)}
.lh{padding:14px 12px 10px 14px;border-bottom:0}
.lh h2{font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.count{background:var(--tone-bg);color:var(--tone);border-color:transparent;font-weight:600;padding:1px 9px}
.lb{padding:2px 10px 12px;gap:10px}
.card{border-radius:12px;border-color:transparent;box-shadow:0 1px 2px rgba(20,20,30,.07),0 0 0 1px var(--line);transition:transform .16s,box-shadow .16s;animation:rise .35s both;gap:10px}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,20,30,.12),0 0 0 1.5px var(--accent)}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .t{justify-content:flex-start;align-items:center;gap:11px}
.tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:12.5px;background:var(--tone-bg);color:var(--tone);flex:none;letter-spacing:.02em}
.nm{min-width:0;display:flex;flex-direction:column}
.nm b{font-size:14.5px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.nm small{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip.mono{font-family:var(--mono);font-weight:500;background:var(--surface2);color:var(--muted)}
.prog i{height:4px}
.prog i b{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--tone,var(--accent))))}
.prog span:last-child{font-size:11px}
.compact .card .row,.compact .card .prog{display:none}
.compact .tile{width:28px;height:28px;border-radius:8px;font-size:11px}
.comfy .card{padding:13px 14px}
.more{border-radius:10px;border-style:solid;border-color:var(--line);background:var(--surface)}
.chips{padding-top:12px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.themes{box-shadow:var(--shadow)}

/* ---- calendar ---- */
.calnav{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:16px 14px 6px}
.calnav h2{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.025em;flex:1 1 180px;min-width:0}
.calnav .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:16px;line-height:1}
.iconbtn:hover{background:var(--surface2)}
[dir=rtl] .mir{display:inline-block;transform:scaleX(-1)}
.seg.sm button{padding:4px 12px}
.cal{padding:8px 14px 14px}
.cal .wd,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{border-bottom:1px solid var(--line)}
.wd span{padding:6px 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cgrid{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cgrid .wd{background:var(--surface2)}
.wk{grid-template-rows:30px repeat(3,25px) 22px;row-gap:2px;border-top:1px solid var(--line);padding-bottom:4px}
.wk:first-of-type{border-top:0}
.day{grid-row:1/6;border-inline-start:1px solid var(--line);padding:4px 6px;cursor:pointer;min-width:0}
.day.c0{border-inline-start:0}
.day:hover{background:var(--accent-soft)}
.day.out{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.day.out .dn{color:var(--muted);font-weight:500}
.dn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums;padding:0 4px}
.day.today .dn{background:var(--accent);color:var(--accent-fg)}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.ev{z-index:2;margin-inline:4px;border:0;text-align:start;display:flex;align-items:center;gap:6px;padding:0 7px;border-radius:7px;background:var(--tone-bg);color:var(--fg);border-inline-start:3px solid var(--tone);font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;cursor:pointer;height:23px;align-self:center}
.ev .l{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ev .tm{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--muted)}
.ev.cl{border-start-start-radius:0;border-end-start-radius:0;margin-inline-start:0;border-inline-start-width:0}
.ev.cr{border-start-end-radius:0;border-end-end-radius:0;margin-inline-end:0}
.ev.cl::before,.ev.cr::after{display:inline-block;color:var(--tone);font-weight:700}
.ev.cl::before{content:'\2039'}.ev.cr::after{content:'\203A'}
.ev .arr{color:var(--tone);font-weight:700;display:inline-block}
[dir=rtl] .ev.cl::before,[dir=rtl] .ev.cr::after,[dir=rtl] .ev .arr{transform:scaleX(-1)}
.ev:hover{box-shadow:0 0 0 1.5px var(--tone)}
.ev.open{background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--tone) 12%,transparent) 7px 9px)}
.mored{z-index:2;grid-row:5;margin-inline:4px;border:0;background:transparent;color:var(--fg);font-weight:650;font-size:12px;text-align:start;padding:0 6px;cursor:pointer;border-radius:6px;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line)}
.mored:hover{background:var(--accent-soft)}
.when{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.when b{color:var(--fg);font-weight:600}
.ecard{cursor:default}
.ag{padding:6px 14px 14px}
.agd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:4;padding:12px 0 7px;font-family:var(--display);font-weight:650;font-size:15.5px;display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);margin-top:6px}
.agd small{color:var(--muted);font-family:var(--font);font-weight:500;font-size:12.5px}
.agd .today-tag{font-family:var(--font);font-size:11px;font-weight:650;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:1px 8px}
.agl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding-top:10px}
.tray{margin:0 14px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.tray>button.th{all:unset;box-sizing:border-box;width:100%;padding:11px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:650;border-radius:12px}
.tray>button.th:focus-visible{outline:2px solid var(--accent)}
.tray .tb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.tray .agl{padding-top:0}
.nothing{padding:40px 16px;text-align:center;color:var(--muted)}
.nothing b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:4px}
.scrim{position:fixed;inset:0;background:rgba(8,10,20,.45);z-index:55;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(470px,100%);max-height:min(82vh,680px);display:flex;flex-direction:column}
.dlg header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.dlg header b{flex:1;font-family:var(--display);font-size:16px}
.dlgb{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ctable td.mono,.ctable .mono{font-variant-numeric:tabular-nums}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.dstnote{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:550}
.cap{margin:0;color:var(--muted);font-size:12px}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.rec b{font-size:13px}.rec span{color:var(--muted);font-size:12.5px}
@media (max-width:700px){
  .calnav h2{font-size:20px}
  .agl{grid-template-columns:minmax(0,1fr)}
  .cal,.ag{padding-inline:12px}
}

/* ---- gantt ---- */
:root{--gantt-label-width:12rem;--gantt-min-column:.75rem;--gantt-row:38px;--gantt-bar:14px}
.compact{--gantt-row:28px;--gantt-bar:10px}
.gantt{padding:6px 14px 0}
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gin{min-width:calc(var(--gantt-label-width) + var(--ncols,12)*var(--gantt-min-column))}
.gh{display:grid;grid-template-columns:var(--gantt-label-width) minmax(0,1fr);background:var(--surface2);border-bottom:1px solid var(--line)}
.gh .gl{background:var(--surface2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gl{position:sticky;inset-inline-start:0;z-index:4;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--surface);border-inline-end:1px solid var(--line);min-width:0}
.gax{position:relative;height:54px}
.t1,.t2{position:absolute;inset-inline:0;height:27px}
.t1{top:0;border-bottom:1px solid var(--line)}.t2{top:27px}
.hc{position:absolute;top:0;bottom:0;border-inline-start:1px solid var(--line);font-size:10.5px;display:flex;align-items:center;padding-inline:3px;overflow:hidden;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.t1 .hc{font-weight:650;color:var(--fg);font-size:12px;padding-inline:8px}
.tl-tag{position:absolute;top:2px;transform:translateX(-50%);font-size:10px;font-weight:650;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 7px;z-index:3}
[dir=rtl] .tl-tag{transform:translateX(50%)}
.gbody{position:relative}
.gover{position:absolute;top:0;bottom:0;inset-inline-start:var(--gantt-label-width);inset-inline-end:0;pointer-events:none}
.gover i{position:absolute;top:0;bottom:0;border-inline-start:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.gover .today{position:absolute;top:0;bottom:0;width:2px;margin-inline-start:-1px;background:var(--accent);opacity:.85}
.gr{display:grid;grid-template-columns:var(--gantt-label-width) minmax(0,1fr);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-height:var(--gantt-row);position:relative}
.gr:hover .gl,.gr:focus-visible .gl{background:var(--accent-soft)}
.gr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;z-index:5}
.gl .lbtn{all:unset;cursor:pointer;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.gl .lbtn:hover{text-decoration:underline}
.gl .lbtn:focus-visible,.gl .menu:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.gl .menu{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none}
.gl .menu:hover{background:var(--surface2);color:var(--fg)}
.gc{position:relative;min-width:0}
.bar{position:absolute;top:50%;height:var(--gantt-bar);margin-top:calc(var(--gantt-bar)/-2);border-radius:5px;background:color-mix(in srgb,var(--tone) 22%,var(--surface));border:1px solid var(--tone);min-width:6px;overflow:hidden;box-sizing:border-box}
.bar .pf{position:absolute;inset-block:0;inset-inline-start:0;background:var(--tone);opacity:.92}
.bar.open{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tone) 45%,transparent) 0 4px,transparent 4px 8px);border-inline-end-style:dashed}
.bar.cl{border-start-start-radius:0;border-end-start-radius:0;border-inline-start-width:0}
.bar.cr{border-start-end-radius:0;border-end-end-radius:0;border-inline-end-width:0}
.ms{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);background:var(--tone);border-radius:2px;box-shadow:0 0 0 2px var(--surface);z-index:1}
[dir=rtl] .ms{transform:translate(50%,-50%) rotate(45deg)}
.grow{display:flex;align-items:center;min-height:32px;background:var(--surface2);border-bottom:1px solid var(--line);position:relative}
.grow .gt{all:unset;box-sizing:border-box;cursor:pointer;position:sticky;inset-inline-start:0;display:flex;gap:8px;align-items:center;padding:0 12px;min-height:32px;font-family:var(--display);font-weight:650;font-size:13.5px}
.grow .gt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grow .tag{font-family:var(--font);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;padding:12px 2px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .lg{position:relative;display:inline-block;width:28px;height:12px;margin:0;top:auto;transform:none;inset:auto}
.legend .ms.lg{width:11px;height:11px;transform:rotate(45deg);margin-inline:8px}
.legend .today.lg{width:2px;height:14px;background:var(--accent);position:static;margin-inline:0}
.legend .bar.lg{position:relative;top:auto;margin:0;height:12px}
.more-rows{display:flex;gap:12px;align-items:center;padding:0 14px 14px}
.compact .gl .lbtn{font-size:12.5px}
@media (max-width:700px){.gantt{padding-inline:12px}}

/* ---- compare ---- */
[hidden]{display:none!important}
.dsbar{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px}
.dsbar button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:150px;padding:9px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex:none}
.dsbar button b{font-family:var(--display);font-size:14px;font-weight:650}
.dsbar button small{color:var(--muted);font-size:11.5px}
.dsbar button:hover{border-color:var(--muted)}
.dsbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.dsbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp{flex:1}
.cap{color:var(--muted);font-size:12px;margin:0}
.msg{color:var(--muted);font-style:italic;font-size:12.5px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}

.cmp th,.cmp td,.ltab th,.ltab td,.otab th,.otab td{font-family:var(--font);text-transform:none;letter-spacing:normal;font-size:13.5px;color:var(--fg);background:transparent}
.ltab,.otab{min-width:0}
.ltab thead th{text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--muted);background:var(--surface2)}
.cmp thead th{background:var(--surface2)}

/* list */
.selbar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.selbar2.snapbar{border:1px solid var(--line);border-radius:10px;margin-top:10px}
.lscroll{overflow:auto}
.ltab{width:100%;border-collapse:collapse}
.ltab th,.ltab td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);font-weight:400;vertical-align:middle}
.ltab thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2)}
.ltab tbody th b{font-weight:600;margin-inline-start:6px}
.ltab tr.on{background:var(--accent-soft)}
.ltab .lc{width:40px}
.ltab input,.snapc input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ord{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;margin-inline-start:6px}
.snaplist{padding:14px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.snaptabs{display:flex;gap:6px}
.stab{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13px}
.stab.on{background:var(--accent-soft);color:var(--fg)}
.snapc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.snapc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.snapb{display:flex;flex-direction:column;flex:1}
.snapb span{color:var(--muted);font-size:12.5px}
/* panel */
.cpanel{padding:0 0 14px}
.cph{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.cph h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.cpanel:focus{outline:none}
.ctool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:8px 16px}
.ctool.opt{padding-top:0;border-bottom:1px solid var(--line);padding-bottom:12px}
.sum{font-weight:600}
.swt{display:inline-flex;gap:9px;align-items:center;cursor:pointer;font-weight:500}
.swt input{position:absolute;opacity:0;width:1px;height:1px}
.swt .trk{width:34px;height:20px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.swt .trk::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.swt input:checked+.trk{background:var(--accent);border-color:var(--accent)}
.swt input:checked+.trk::after{transform:translateX(14px);background:var(--accent-fg)}
[dir=rtl] .swt input:checked+.trk::after{transform:translateX(-14px)}
.swt input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.swt small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:-1px}
.headline{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 4px}
.hl{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px}
.hl.best2{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.restr{margin:8px 16px 0;padding:7px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500;font-size:12.5px}
.cscroll{overflow:auto;max-height:min(66vh,760px);margin:12px 16px 0;border:1px solid var(--line);border-radius:12px;position:relative;background:var(--surface)}
.cmp{width:100%;border-collapse:separate;border-spacing:0;min-width:calc(14rem + var(--ncols,3)*11rem)}
.cmp caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cmp th,.cmp td{text-align:start;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);font-weight:400}
.cmp thead th{position:sticky;top:0;z-index:5;background:var(--surface2);border-bottom:1px solid var(--line);padding:10px 12px;vertical-align:top}
.cmp thead th.fh{inset-inline-start:0;z-index:7;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;vertical-align:middle}
.cmp tbody th[scope=row]{position:sticky;inset-inline-start:0;z-index:2;background:var(--surface);padding:10px 12px;min-width:12rem;max-width:15rem;font-weight:600;border-inline-end:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.cmp td{padding:10px 12px;min-width:11rem}
.chin{display:flex;gap:6px;align-items:flex-start}
.cht{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ct{font-family:var(--display);font-weight:650;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.cs{display:block}
.rcn{font-size:11.5px;color:var(--muted)}
.blt{display:inline-block;align-self:flex-start;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent-fg);background:var(--accent);border-radius:4px;padding:0 6px;margin-inline-start:6px}
.cmp th.bse,.cmp td.bse{box-shadow:inset 0 3px 0 var(--accent)}
.cmp td.bse{box-shadow:none;background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.cm{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none}
.cm:hover{background:var(--accent-soft);color:var(--fg)}.cm:focus-visible{outline:2px solid var(--accent)}
.cmenu{position:absolute;z-index:20;inset-inline-end:8px;margin-top:2px;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column}
.cmenu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-weight:500}
.cmenu button:hover:not([disabled]){background:var(--accent-soft)}
.cmenu button:focus-visible{outline:2px solid var(--accent)}
.cmenu button[disabled]{opacity:.45;cursor:not-allowed}
.cmp thead th{position:sticky}
.cmp thead th .cmenu{position:absolute}
.sech th{position:static;background:var(--surface2);padding:0;border-bottom:1px solid var(--line)}
.sech button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:9px;align-items:center;padding:9px 12px;cursor:pointer;font-family:var(--display);font-weight:650;font-size:13.5px;position:sticky;inset-inline-start:0;width:max(100%,0px)}
.sech button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chv{display:grid;place-items:center;transition:transform .15s;color:var(--muted)}
.chv.open{transform:rotate(90deg)}
[dir=rtl] .chv{transform:scaleX(-1)}
[dir=rtl] .chv.open{transform:scaleX(-1) rotate(90deg)}
.count{font-family:var(--mono);font-weight:500;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 9px;color:var(--muted)}
.count.dn{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.pv{font-family:var(--font);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 5px}
.subh th{position:static;background:var(--surface);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-bottom:1px solid var(--line)}
.none td{color:var(--muted);font-style:italic;padding:12px}
.r.diff td,.r.diff th[scope=row]{background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}
.r.diff td.bse{background:color-mix(in srgb,var(--warn-bg) 55%,var(--accent-soft))}
.r.same td,.r.same th[scope=row]{color:var(--muted)}
.r.same th[scope=row]{font-weight:500}
.r.cur td,.r.cur th[scope=row]{box-shadow:inset 0 0 0 0 transparent}
.r:focus{outline:2px solid var(--accent);outline-offset:-2px}
.r.cur th[scope=row]{box-shadow:inset 3px 0 0 var(--accent)}
.rl{display:flex;flex-direction:column;gap:1px}
.rs{font-size:11.5px;color:var(--muted);font-weight:500}
.rb{display:inline-block;margin-top:5px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border-radius:4px;padding:0 6px}
.rb.d{background:var(--warn);color:var(--warn-bg)}
.rb.n{background:var(--neu-bg);color:var(--neu);border:1px solid var(--line)}
.rn{display:block;font-size:11.5px;color:var(--warn);font-weight:500;margin-top:2px}
.v{overflow-wrap:anywhere}
.empty{color:var(--muted);font-style:italic}
.masked{font-family:var(--mono);letter-spacing:.1em}
.idh{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mks{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mk,.best{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;line-height:1.7}
.mk.same{background:var(--ok-bg);color:var(--ok)}
.mk.differs,.mk.notinbase{background:var(--warn-bg);color:var(--warn)}
.mk.nc{background:var(--neu-bg);color:var(--neu)}
.best{background:var(--ok-bg);color:var(--ok)}

function descriptor(){
  var sc=R.sections(),d=D(),ck=R.curKeys();
  var secs=sc.list.map(function(s){return {key:s.key,label:s.label,fields:s.fields.map(function(f){var o={key:f.k,label:f.label,valueKind:f.kind};if(f.options)o.options=f.options.map(function(x){return{value:x[0],label:x[1]}});if(S.sim.masked===f.k||(S.sim.maskCur&&ck[f.k]))o.masked=true;if(f.cur&&!(S.sim.hideCur))o.currencyField=f.cur;return o})}});
  var o={surface:{compare:{sections:secs,maxRecords:C.MAX}}};
  if(sc.restricted)o.surface.compare.fieldsRestricted=true;
  var pre=S.base?'&compareBaseline='+S.base:'';
  o.url='?compare='+S.sel.join(',')+pre+(S.all?'&compareAll=true':'');
  o.saved='none: a comparison is never saved in a view';
  o.note='Routing IDs appear here as readable codes for the prototype. The real URL carries record routing IDs, never displayed.';
  return o;
}
function queriesTab(){
  var h='<p style="margin:0">Opening a comparison is <b>one</b> request. Reload and Retry are one each. Changing the baseline, differences only, collapsing a section, removing a column and the best, words and lines options send nothing.</p>';
  h+=h3('Actions (latest first)');
  var a=S.acts.slice(-12).reverse();
  h+=a.length?a.map(function(x){return '<div class="find"><span class="chip '+(x.count===0?'success':'')+'">'+x.count+(x.count===1?' request':' requests')+'</span><span class="code">'+esc(x.label)+'</span></div>'}).join(''):'<p class="cap">No actions yet.</p>';
  h+=h3('Request log (latest first)');
  h+=S.log.slice(-4).reverse().map(function(q){var fs=q.spec.fields;return '<pre>'+esc('#'+q.n+' '+q.name+'\nlist operation, standalone\nrecordIds  ['+q.spec.recordIds.join(', ')+']\nfields     '+fs.length+' readable fields + title'+(fs.length?'':'')+'\nlimit      '+q.spec.limit+'\ncountMode  none\nnever sent: cursor, hierarchy, group, search, filters, sort, standard view\nlocked record scope and work context: carried\n→ '+q.rows+' of '+q.spec.recordIds.length+' records returned')+'</pre>'}).join('')||'<p class="cap">No requests yet.</p>';
  h+='<p class="cap">The request names only fields the viewer can read, so the server never refuses it with PROJECTION_FIELD_NOT_ALLOWED. Column order is the order of the compare key, not the response order.</p>';
  return h;
}
function contrastRows(){
  var cs=getComputedStyle(document.documentElement),g=function(n){return cs.getPropertyValue(n)},rows=[];
  function hexRgb(h){h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');return [0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16)})}
  function lum(rgb){var a=rgb.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
  function ratio(a,b){var x=lum(hexRgb(a)),y=lum(hexRgb(b));return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  [['success','--ok','--ok-bg'],['warning','--warn','--warn-bg'],['danger','--bad','--bad-bg'],['neutral','--neu','--neu-bg']].forEach(function(t){var a=g(t[2]),b=g(t[1]);if(!/#/.test(a)||!/#/.test(b))return;rows.push({tone:t[0],chip:ratio(b,a)})});
  return rows;
}
function findingsTab(){
  var d=D(),sc=R.sections().list,keys={},dupe=false,nF=0,ck=R.curKeys(),ncur=Object.keys(ck).length,bad=[];
  d.sections.forEach(function(s){s.fields.forEach(function(f){nF++;if(keys[f.k])dupe=true;keys[f.k]=1;if(f.better&&['integer','decimal','money','date','datetime'].indexOf(f.kind)<0)bad.push(f.k)})});
  var F=[
   ['COMPARE_FIELD_UNKNOWN',true,'Every listed field is a field of the Entity.'],
   ['COMPARE_FIELD_TECHNICAL',true,'No storage identity, version field or UUID-typed field is declared. '+(d.isSnap?'The shipped snapshot view shows Record ID, which this check would refuse.':'')],
   ['COMPARE_FIELD_DUPLICATE',!dupe,'Each field appears once.'],
   ['COMPARE_SECTION_EMPTY',d.sections.every(function(s){return s.fields.length>0}),d.sections.length+' sections, none empty.'],
   ['COMPARE_FIELDS_ABOVE_CAP',nF<=C.MAXF&&nF+2+ncur<=C.MAXLIST,nF+' declared of '+C.MAXF+'; request carries '+(nF+2+ncur)+' of '+C.MAXLIST+' fields.'],
   ['COMPARE_IDENTITY_REQUIRED',true,'The surface publishes a readable identity and title for column headings.'],
   ['COMPARE_BETTER_INELIGIBLE (C3)',!bad.length,bad.length?bad.join(', ')+' cannot be ranked.':'Every best-value field is a number, money or date.'],
   ['COMPARE_MATCH_KEY_NOT_UNIQUE (C4)',true,d.collection?'Match key '+esc(d.collection.matchLabel)+' is backed by a unique key (fixture).':'No collection declared.']
  ];
  var h=F.map(function(x){return '<div class="find"><span class="chip '+(x[1]?'success':'danger')+'">'+(x[1]?'pass':'blocks')+'</span><span class="code"><b>'+x[0]+'</b><small>'+esc(x[2])+'</small></span></div>'}).join('');
  var body=$('body').innerHTML||'';
  var rowsN=(body.match(/<th scope="row"/g)||[]).length,colN=(body.match(/<th scope="col"/g)||[]).length,btn=(body.match(/aria-expanded=/g)||[]).length;
  var uuid=/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}/i.test(body),cap=/<caption/.test(body);
  var marks=(body.match(/class="(rb|mk) /g)||[]).length;
  h+=h3('Rendered table checks, live');
  var checks=[['Table has a caption',cap||!/class="cmp"/.test(body),cap?'Present':'Not on this view'],['Column headers carry scope',colN>=1||!cap,colN+' column headers, '+rowsN+' row headers'],['Sections are buttons with aria-expanded',btn>=1||!cap,btn+' controls'],['Differences are text marks',marks>=0,marks+' text marks (Differs, Same as baseline, Best, Not compared)'],['No UUID or technical identity in the DOM',!uuid,uuid?'An identifier-like value is on screen':'Readable codes and names only']];
  h+=checks.map(function(x){return '<div class="find"><span class="chip '+(x[1]?'success':'danger')+'">'+(x[1]?'pass':'fail')+'</span><span class="code"><b>'+x[0]+'</b><small>'+esc(x[2])+'</small></span></div>'}).join('');
  h+=h3('Tone contrast, current theme (4.5:1)');
  h+=contrastRows().map(function(r){var ok=r.chip>=4.5;return '<div class="find"><span class="chip '+(ok?'success':'danger')+'">'+(ok?'pass':'fail')+'</span><span class="code"><b>'+r.tone+'</b><small>Chip text on its background '+r.chip.toFixed(1)+':1</small></span></div>'}).join('');
  return h;
}
function simulateTab(){
  var s=S.sim,d=D(),fs=[['','None']];d.sections.forEach(function(x){x.fields.forEach(function(f){fs.push([f.k,f.label])})});
  var cols=[['','None']].concat(S.sel.map(function(c){return [c,c]}));
  var h='<p style="margin:0;color:var(--muted)">Change what this person can read. The comparison reacts the way the blueprint says.</p>';
  h+=sel('sim_mask','Mask one field for this viewer',fs,s.masked);
  h+=tog('sim_maskCur','Mask the currency fields','A masked currency cannot tell MYR from USD, so money rows read “Currency not compared”.',s.maskCur);
  h+=tog('sim_hideCur','Hide the currency fields','The currency field is unreadable, so money is not compared.',s.hideCur);
  h+=tog('sim_hide','Hide some fields from this viewer','They are left out with no name or count, and one line says some fields aren’t shown.',s.hide);
  h+=sel('sim_un','Make a record unavailable',cols,s.unavail);
  h+=tog('sim_partial','Row outcome: partial rule (recommended)','Off is the blueprint’s strict rule: one masked or unavailable cell makes the row “Not compared”.',s.partial);
  h+='<button class="btn" data-act="accessChanged">Simulate “access changed”</button><p class="cap">PROJECTION_FIELD_NOT_ALLOWED between descriptor and request. No partial comparison.</p>';
  h+=tog('sim_latency','Simulate request delay','Shows skeleton rows while the one request is in flight.',s.latency>0);
  h+=tog('sim_rtl','Right to left','Mirrors the table, sticky first column and menus.',S.loc==='ar');
  h+=tog('sim_narrow','Force narrow layout','Two records at a time with a pair picker; the baseline is pinned first.',s.narrow);
  h+='<button class="btn" data-act="resetSim">Reset simulation</button>';
  return h;
}
var DEC=[['1','Placement','Selection action opening an in-page panel, not a Layout or route.','The panel opens from the selection bar; Close returns to the list.'],['2','Opt-in per list surface','No declaration, no Compare.','Descriptor tab shows the per-viewer declaration.'],['3','Caps','4 records, 2 narrow columns, 60 fields.','Compare is disabled with a reason outside 2 to 4.'],['4','Baseline','Text mark, in the URL, cleared on removal.','Column menu; try removing the baseline column.'],['5','C1 may change the snapshot code','After a rendering test pins the output.','Snapshots: Current versus Recommended.'],['6','Authoring storage','Two tables plus compare_better.','Not prototyped.'],['7','Restricted fields','Omit without names; one statement.','Simulate › Hide some fields.'],['8','Standalone request','Ignores list filters and search.','Queries tab shows what is never sent.'],['9','Phases','C1 and C2 first.','C3 and C4 are marked previews.'],['10','AGENTS.md entry','Added.','—']];
function decisionsTab(){
  var h='<p style="margin:0">All ten were approved on 9 October 2026. What the prototype shows for each:</p>';
  h+=DEC.map(function(x){return '<div class="rec"><b><span class="chip success">approved</span> '+x[0]+'. '+x[1]+'</b><span>'+x[2]+'</span><span><em>Prototype:</em> '+x[3]+'</span></div>'}).join('');
  h+=h3('Proposed additions, each needing approval');
  h+=['Partial row-outcome rule for masked cells.','Summary strip above the table.','Readable identity beside equal labels.','Differing-word highlight for text.','Next and previous difference.','“Not in baseline” wording with a baseline.','Count per option in the phone pair picker.'].map(function(t){return '<div class="rec"><b><span class="chip warning">proposed</span> '+t+'</b></div>'}).join('');
  return h;
}
function renderInsp(){
  $('insp').classList.toggle('open',S.insp);$('openInsp').setAttribute('aria-expanded',S.insp);
  if(!S.insp)return;
  $('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-act="tab" data-v="'+t+'" aria-selected="'+(S.tab===t)+'">'+t+'</button>'}).join('');
  var h=S.tab==='Review'?review():S.tab==='Descriptor'?'<pre>'+esc(JSON.stringify(descriptor(),null,2))+'</pre>':S.tab==='Queries'?queriesTab():S.tab==='Findings'?findingsTab():S.tab==='Simulate'?simulateTab():decisionsTab();
  $('ib').innerHTML=h;
}
var baseRender=R.render;
R.render=function(){baseRender();renderPop();if(S.insp)renderInsp()};
R.after=function(){
  if(S.focusNext){var el=document.querySelector(S.focusNext);S.focusNext=null;if(el&&el.focus)el.focus()}
};
/* ---------- difference navigation ---------- */
var diffIdx=-1;
function nav(dir){
  var rows=Array.prototype.slice.call(document.querySelectorAll('#cmp tr.r.diff'));
  if(!rows.length){announce('There are no differences to move to.');return}
  diffIdx=((diffIdx+dir)%rows.length+rows.length)%rows.length;
  var r=rows[diffIdx];r.setAttribute('tabindex','-1');if(r.scrollIntoView)r.scrollIntoView({block:'center'});if(r.focus)r.focus();
  rows.forEach(function(x){x.classList.remove('cur')});r.classList.add('cur');
  var lab=r.querySelector('.rl');announce('Difference '+(diffIdx+1)+' of '+rows.length+': '+(lab?lab.textContent:''));
}
/* ---------- events ---------- */
function act(a,t,e){
  var v=t.getAttribute('data-v'),code=t.getAttribute('data-code');
  if(a==='theme'){S.theme=v;renderThemes();R.render()}
  else if(a==='sc'){if(S.sc!==v)setSc(v)}
  else if(a==='snapview'){S.snapView=v;R.render()}
  else if(a==='density'){S.density=v;R.render()}
  else if(a==='pick'){}
  else if(a==='clrSel'){S.sel=[];S.base=null;S.allMatching=false;R.render()}
  else if(a==='allm'){S.allMatching=!S.allMatching;R.render()}
  else if(a==='compare'){if(!R.selReason()){S.base=S.base&&S.sel.indexOf(S.base)>-1?S.base:null;S.coll={};S.focusNext='#cpanel';R.openPanel()}}
  else if(a==='close'){S.open=false;S.epoch++;R.beginAct('Close comparison (Back)');S.focusNext='[data-act="compare"]';R.render();announce('Comparison closed')}
  else if(a==='reload'){S.sim.accessChanged=false;R.openPanel('Reload comparison')}
  else if(a==='menu'){S.menu=S.menu===code?null:code;R.render();var m=document.querySelector('.cmenu button:not([disabled])');if(S.menu&&m&&m.focus)m.focus()}
  else if(a==='setBase'){S.base=code;S.menu=null;R.beginAct('Set baseline (no request)');S.focusNext='[data-act="menu"][data-code="'+code+'"]';R.render();announce('Baseline set to '+code)}
  else if(a==='clrBase'){S.base=null;S.menu=null;R.beginAct('Clear baseline (no request)');R.render();announce('Baseline cleared')}
  else if(a==='remove'){if(S.sel.length>C.MIN){var wasBase=S.base===code;S.sel=S.sel.filter(function(x){return x!==code});if(wasBase)S.base=null;S.menu=null;R.beginAct('Remove '+code+' (no request)');R.render();announce(code+' removed from comparison'+(wasBase?'. Baseline cleared':''))}}
  else if(a==='openRec'){S.menu=null;R.render();toast('Opens '+code+' in the same tab. Back returns to the comparison.')}
  else if(a==='sec'){var k=t.getAttribute('data-key');var cur=S.coll[k];var d=D();var isTech=false;d.sections.forEach(function(s){if(s.key===k&&s.tech)isTech=true});var open=cur===undefined?!isTech:!cur;S.coll[k]=open;R.render()}
  else if(a==='colAll'||a==='expAll'){var d2=D();d2.sections.forEach(function(s){S.coll[s.key]=a==='colAll'});S.coll.lines=a==='colAll';R.render()}
  else if(a==='showAll'){S.all=true;R.render()}
  else if(a==='nextDiff')nav(1);
  else if(a==='prevDiff')nav(-1);
  else if(a==='accessChanged'){S.sim.accessChanged=true;R.openPanel('Open comparison (access changed)')}
  else if(a==='resetSim'){S.sim={masked:'',maskCur:false,hide:false,hideCur:false,unavail:'',partial:false,latency:S.sim.latency,narrow:false,accessChanged:false};S.loc='en';renderThemes();R.render()}
  else if(a==='tab'){S.tab=v;renderInsp()}
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-act]');
  if(t){var a=t.getAttribute('data-act');if(a==='pick')return;act(a,t,e);return}
  if(S.menu&&!(e.target.closest&&e.target.closest('.cmenu'))){S.menu=null;R.render()}
  if(S.pop&&!(e.target.closest&&(e.target.closest('#pop')||e.target.closest('#ctlBtn')))){S.pop=false;renderPop()}
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.id;
  if(t.getAttribute&&t.getAttribute('data-act')==='pick'){var c=t.getAttribute('data-code'),i=S.sel.indexOf(c);if(t.checked&&i<0){if(D().isSnap&&S.sel.length>=2)S.sel.shift();S.sel.push(c)}else if(!t.checked&&i>-1){S.sel.splice(i,1);if(S.base===c)S.base=null}S.allMatching=false;S.focusNext='[data-act="pick"][data-code="'+c+'"]';R.render();return}
  if(!id)return;var s=S.sim;
  if(id==='onlyDiff'){S.all=!t.checked;R.beginAct('Differences only '+(t.checked?'on':'off')+' (no request)');R.render();announce('Showing '+(S.all?'all rows':R.model().diff+' of '+R.model().total+' fields'));S.focusNext='#onlyDiff'}
  else if(id==='optBest'){S.best=t.checked;R.render()}
  else if(id==='optWords'){S.words=t.checked;R.render()}
  else if(id==='optLines'){S.lines=t.checked;R.render()}
  else if(id==='pair0'){S.pair[0]=+t.value;R.render()}
  else if(id==='pair1'){S.pair[1]=+t.value;R.render()}
  else if(id==='sim_mask'){s.masked=t.value;R.render()}
  else if(id==='sim_maskCur'){s.maskCur=t.checked;R.render()}
  else if(id==='sim_hideCur'){s.hideCur=t.checked;R.render()}
  else if(id==='sim_hide'){s.hide=t.checked;R.render()}
  else if(id==='sim_un'){s.unavail=t.value;R.render()}
  else if(id==='sim_partial'){s.partial=t.checked;R.render()}
  else if(id==='sim_latency'){s.latency=t.checked?160:0;renderInsp()}
  else if(id==='sim_rtl'){S.loc=t.checked?'ar':'en';renderThemes();R.render()}
  else if(id==='sim_narrow'){s.narrow=t.checked;R.render()}
});
$('ctlBtn').addEventListener('click',function(e){e.stopPropagation();S.pop=!S.pop;renderPop()});
$('openInsp').addEventListener('click',function(){S.insp=!S.insp;renderInsp()});
$('closeInsp').addEventListener('click',function(){S.insp=false;renderInsp()});
$('viewBtn').addEventListener('click',function(){toast('System default view. A saved view never stores a comparison; opening one closes the panel.')});
$('filtersBtn').addEventListener('click',function(){toast('The comparison ignores list filters and search: a record you chose stays comparable after you filter it out.')});
$('q').addEventListener('input',function(e){S.q=e.target.value;R.render()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(S.menu){S.menu=null;R.render();return}if(S.pop){S.pop=false;renderPop();return}if(S.open&&!(S.insp)){var b=document.getElementById('closeBtn');if(b)b.click();return}if(S.insp){S.insp=false;renderInsp()}}
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName||'')){e.preventDefault();$('q').focus()}
});
if(window.addEventListener)window.addEventListener('resize',function(){if(S.open)R.render()});
$('rail').innerHTML=ICONS.map(function(p,i){return '<button aria-label="Section '+(i+1)+'"'+(i===3?' aria-current="page"':'')+'><svg viewBox="0 0 24 24"><path d="'+p+'"/></svg></button>'}).join('')+'<div class="av">CA</div>';
renderThemes();
setSc('quote');
C.test={act:act,review:review,descriptor:descriptor,findings:findingsTab,simulate:simulateTab,queries:queriesTab,decisions:decisionsTab,renderInsp:renderInsp,setSc:setSc,renderThemes:renderThemes};
})();
</script>
